<title>Turno de Hoy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="app-style">
:root{
  --bg:#EEF2F1;
  --surface:#FFFFFF;
  --surface-2:#E2E9E7;
  --border:#C9D6D2;
  --ink:#1E2A28;
  --muted:#5C6B67;
  --accent:#1F7A6C;
  --accent-strong:#145C51;
  --accent-soft:#D7ECE7;
  --good:#2F9E5B;
  --good-soft:#DFF3E5;
  --warn:#C77A17;
  --warn-soft:#F7E6CC;
  --bad:#C0392B;
  --bad-soft:#F6DCD7;
  --admin:#8A5A00;
  --admin-soft:#F3E4C2;
  --shadow:0 1px 2px rgba(20,40,36,.07),0 6px 18px rgba(20,40,36,.07);
  --radius:14px;
  --font-display:'Barlow Condensed',sans-serif;
  --font-body:'Karla',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12201D; --surface:#182B27; --surface-2:#1E332E; --border:#2C463F;
    --ink:#EAF3F0; --muted:#9FB6B0;
    --accent:#4FC3AA; --accent-strong:#7BE0C9; --accent-soft:#1E3B35;
    --good:#5FCB88; --good-soft:#1E3B2A;
    --warn:#E4A94C; --warn-soft:#3C2E14;
    --bad:#E2776A; --bad-soft:#3C1F1B;
    --admin:#E0B85A; --admin-soft:#3A2F13;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#12201D; --surface:#182B27; --surface-2:#1E332E; --border:#2C463F;
  --ink:#EAF3F0; --muted:#9FB6B0;
  --accent:#4FC3AA; --accent-strong:#7BE0C9; --accent-soft:#1E3B35;
  --good:#5FCB88; --good-soft:#1E3B2A;
  --warn:#E4A94C; --warn-soft:#3C2E14;
  --bad:#E2776A; --bad-soft:#3C1F1B;
  --admin:#E0B85A; --admin-soft:#3A2F13;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button,input{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;margin:0}
.mono{font-family:var(--font-mono)}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 72px}

/* ---------- header ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:26px;color:var(--accent-strong)}
.brand .sub{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.who{display:flex;align-items:center;gap:10px}
.status{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ready{background:var(--good)}
.dot.offline{background:var(--muted)}
.dot.readonly{background:var(--warn)}
.dot.connecting{background:var(--muted);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.me-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 12px 5px 5px;box-shadow:var(--shadow)}
.me-chip button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:12px}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:800;font-size:14px;flex-shrink:0}
.avatar.lg{width:64px;height:64px;font-size:26px}
.badge-admin{font-size:11px;background:var(--admin-soft);color:var(--admin);border-radius:6px;padding:1px 6px;font-family:var(--font-mono);font-weight:600;text-transform:uppercase}

/* ---------- name picker ---------- */
.picker{padding:40px 0}
.picker h2{font-size:30px;margin-bottom:6px}
.picker p{color:var(--muted);margin:0 0 24px}
.name-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.name-btn{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s ease}
.name-btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.name-btn span{font-family:var(--font-display);font-weight:700;font-size:17px;text-transform:none}

/* ---------- hero (today) ---------- */
.hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:20px}
.hero-top{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.hero-top .date{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.hero-top h2{font-size:32px;line-height:1}
.hero-top .caption{color:var(--muted);font-size:13px;margin-top:2px}
.tasks{display:flex;flex-direction:column;gap:10px}
.task-row{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surface-2);border-radius:10px;padding:12px 14px;flex-wrap:wrap}
.task-row.is-done{background:var(--good-soft)}
.task-main{display:flex;align-items:center;gap:10px;min-width:0}
.task-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent}
.is-done .task-check{background:var(--good);border-color:var(--good);color:#fff}
.task-label{font-weight:600}
.task-meta{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.task-action{display:flex;align-items:center;gap:10px;flex-shrink:0}
.thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;border:1px solid var(--border)}
.pill{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 13px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.btn-file{position:relative;overflow:hidden}
.btn-file input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ---------- week strip ---------- */
.section-title{font-size:13px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}
.week-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.week-card{flex:0 0 auto;width:112px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 10px;text-align:center;box-shadow:var(--shadow)}
.week-card.today{border-color:var(--accent);border-width:2px;background:var(--accent-soft)}
.week-card .d{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.week-card .name{font-family:var(--font-display);font-weight:700;font-size:16px}

/* ---------- history ---------- */
.history-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow)}
.history-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;cursor:pointer}
.history-head .left{display:flex;align-items:center;gap:10px}
.history-head .date{font-family:var(--font-mono);font-size:12px;color:var(--muted);min-width:64px}
.history-photos{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px}
.history-photos img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
.history-photos .cap{font-size:11px;color:var(--muted);text-align:center;margin-top:3px;width:84px}
table.log{width:100%;border-collapse:collapse;font-size:13px}
table.log th{text-align:left;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--border)}
table.log td{padding:6px 8px;border-bottom:1px solid var(--border)}
.log-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.empty{color:var(--muted);font-size:13px;padding:14px 2px}

/* ---------- admin ---------- */
.admin-toggle{margin-top:26px}
.admin-panel{margin-top:14px;background:var(--admin-soft);border:1px solid var(--admin);border-radius:var(--radius);padding:18px}
.admin-panel h3{font-size:15px;color:var(--admin);margin-bottom:10px}
.admin-block{margin-bottom:22px}
.admin-block:last-child{margin-bottom:0}
.admin-row{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 10px;margin-bottom:6px}
.admin-row input[type=text]{flex:1;border:1px solid var(--border);border-radius:6px;padding:5px 8px;background:var(--bg);color:var(--ink);min-width:0}
.admin-row label.chk{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.icon-btn:hover{border-color:var(--accent)}
.new-row{display:flex;gap:8px;margin-top:8px}

@media(max-width:520px){
  .brand h1{font-size:22px}
  .hero-top h2{font-size:26px}
  .task-row{flex-direction:column;align-items:stretch}
  .task-action{justify-content:flex-end}
}
</style>
<div id="app"></div>
<script id="app-script">
(function(){
"use strict";

/* ================= constants ================= */
var FONTS_URL = "https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap";
var PALETTE = ["#D6604D","#DDA63A","#4F8A3D","#2E8B84","#4472C4","#8E5FA8","#B15C8E"];
var DOW = ["DOM","LUN","MAR","MIÉ","JUE","VIE","SÁB"];
var STORAGE_KEY = "turnoDeHoy_myName";

/* ================= state (published) ================= */
var STATE = /*STATE_START*/{
  "people": ["Yassine","Jorge","Miguel","Noel","Ali","Raul","Alberto"],
  "admins": ["Miguel","Alberto"],
  "startDate": "2026-09-07",
  "taskTemplate": [
    {"id":"basura","label":"Sacar la basura","photo":true},
    {"id":"barrer","label":"Barrer toda la casa","photo":true},
    {"id":"cocina","label":"Dejar la cocina limpia y recogida","photo":true}
  ],
  "days": {},
  "history": {}
}/*STATE_END*/;

/* ================= per-viewer local state (not published) ================= */
var myName = null;
try { myName = localStorage.getItem(STORAGE_KEY); } catch(e){}
var expandedDays = {};
var adminPanelOpen = false;
var CAP = null;
var capStatus = "connecting"; /* connecting | ready | offline | readonly */

/* ================= date helpers ================= */
function localDateStr(d){
  var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}
function addDays(dateStr,n){
  var d = new Date(dateStr+"T00:00:00");
  d.setDate(d.getDate()+n);
  return localDateStr(d);
}
function daysBetween(a,b){
  var da = new Date(a+"T00:00:00");
  var db = new Date(b+"T00:00:00");
  return Math.round((db-da)/86400000);
}
function todayStr(){ return localDateStr(new Date()); }
function fmtDateLong(dateStr){
  var d = new Date(dateStr+"T00:00:00");
  var dow = DOW[d.getDay()];
  var day = String(d.getDate()).padStart(2,"0");
  var mon = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"][d.getMonth()];
  return dow+" "+day+" "+mon;
}
function fmtDateShort(dateStr){
  var d = new Date(dateStr+"T00:00:00");
  return DOW[d.getDay()]+" "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
}
function fmtTime(iso){
  if(!iso) return "";
  var d = new Date(iso);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

/* ================= rotation ================= */
function personForDate(state, dateStr){
  var n = state.people.length;
  if(n===0) return null;
  var diff = daysBetween(state.startDate, dateStr);
  var idx = ((diff % n) + n) % n;
  return state.people[idx];
}
function colorFor(state, name){
  var idx = state.people.indexOf(name);
  if(idx<0) idx = 0;
  return PALETTE[idx % PALETTE.length];
}
function initialsFor(name){
  return (name||"?").slice(0,1).toUpperCase();
}
function isAdmin(state, name){
  return !!name && state.admins.indexOf(name) !== -1;
}

/* ================= data helpers ================= */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function ensureDay(state, dateKey){
  if(!state.days[dateKey]){
    state.days[dateKey] = {
      person: personForDate(state, dateKey),
      tasks: state.taskTemplate.map(function(t){
        return {id:t.id, label:t.label, photo:!!t.photo, done:false, by:null, at:null, img:null};
      })
    };
  }
  return state.days[dateKey];
}
function archiveOldDays(state){
  var today = todayStr();
  Object.keys(state.days).forEach(function(key){
    if(key===today) return;
    if(daysBetween(key, today) > 7){
      var day = state.days[key];
      var total = day.tasks.length;
      var done = day.tasks.filter(function(t){return t.done;}).length;
      state.history[key] = {person: day.person, done: done, total: total};
      delete state.days[key];
    }
  });
}

/* ================= image compression ================= */
function fileToCompressedDataURL(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error("read_failed")); };
    reader.onload = function(e){
      var img = new Image();
      img.onerror = function(){ reject(new Error("decode_failed")); };
      img.onload = function(){
        var maxDim = 640;
        var w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ================= publish ================= */
function buildFullDocument(state){
  var styleText = document.getElementById("app-style").textContent;
  var scriptSrc = document.getElementById("app-script").textContent;
  var jsonStr = JSON.stringify(state).split("<" + "/").join("<\\/");
  var newSrc = scriptSrc.replace(/\/\*STATE_START\*\/[\s\S]*?\/\*STATE_END\*\//, "/*STATE_START*/" + jsonStr + "/*STATE_END*/");
  var bodyHtml = "<div id=\"app\">" + renderApp(state) + "</div>";
  var scriptOpen = "<" + "script id=\"app-script\">";
  var scriptClose = "<" + "/script>";
  return "<!doctype html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Turno de Hoy</title>\n<link rel=\"stylesheet\" href=\"" + FONTS_URL + "\">\n<style id=\"app-style\">" + styleText + "</style>\n</head>\n<body>\n" + bodyHtml + "\n" + scriptOpen + newSrc + scriptClose + "\n</body>\n</html>";
}

function publishState(newState){
  STATE = newState;
  render();
  if(!CAP){ return; }
  var html = buildFullDocument(STATE);
  CAP.publish(html).catch(function(err){
    var code = err && err.code;
    if(code === "not_writer" || code === "not_granted"){
      capStatus = "readonly";
      CAP = null;
      render();
    } else if(code === "conflict"){
      /* another version is already replacing this view; nothing to do */
    } else {
      window.alert("No se pudo guardar el cambio, inténtalo de nuevo.");
    }
  });
}

/* ================= rendering ================= */
function render(){
  var el = document.getElementById("app");
  if(el) el.innerHTML = renderApp(STATE);
}

function renderApp(state){
  if(!myName){ return renderPicker(state); }
  var admin = isAdmin(state, myName);
  return renderHeader(state, admin) +
    "<div class=\"wrap\" style=\"padding-top:0\">" +
    renderHero(state) +
    renderWeekStrip(state) +
    renderHistory(state) +
    (admin ? renderAdminToggle() + (adminPanelOpen ? renderAdmin(state) : "") : "") +
    "</div>";
}

function renderPicker(state){
  var buttons = state.people.map(function(name){
    var c = colorFor(state, name);
    return "<button class=\"name-btn\" data-action=\"pick-name\" data-name=\"" + esc(name) + "\">" +
      "<span class=\"avatar lg\" style=\"background:" + c + "\">" + esc(initialsFor(name)) + "</span>" +
      "<span>" + esc(name) + "</span>" +
      "</button>";
  }).join("");
  return "<div class=\"wrap\"><div class=\"picker\">" +
    "<h2>¿Quién eres?</h2>" +
    "<p>Elige tu nombre para poder marcar tus tareas. Se recordará en este dispositivo.</p>" +
    "<div class=\"name-grid\">" + buttons + "</div>" +
    "</div></div>";
}

function renderHeader(state, admin){
  var statusLabel = {connecting:"Conectando…", ready:"Guardado para todos", offline:"Solo en este dispositivo", readonly:"Solo lectura"}[capStatus];
  var meHtml = "";
  if(myName){
    var c = colorFor(state, myName);
    meHtml = "<div class=\"me-chip\">" +
      "<span class=\"avatar\" style=\"background:" + c + "\">" + esc(initialsFor(myName)) + "</span>" +
      "<span>" + esc(myName) + (admin ? " <span class=\"badge-admin\">Admin</span>" : "") + "</span>" +
      "<button data-action=\"change-user\">cambiar</button>" +
      "</div>";
  }
  return "<div class=\"wrap\" style=\"padding-bottom:0\"><div class=\"topbar\">" +
    "<div class=\"brand\"><h1>Turno de Hoy</h1><span class=\"sub\">Limpieza · Casa Holanda</span></div>" +
    "<div class=\"who\">" +
    "<div class=\"status\"><span class=\"dot " + capStatus + "\"></span>" + statusLabel + "</div>" +
    meHtml +
    "</div></div></div>";
}

function renderHero(state){
  var today = todayStr();
  var person = personForDate(state, today);
  var day = state.days[today];
  var tasks = day ? day.tasks : state.taskTemplate.map(function(t){
    return {id:t.id, label:t.label, photo:!!t.photo, done:false, by:null, at:null, img:null};
  });
  var admin = isAdmin(state, myName);
  var canAct = myName && (myName === person || admin);
  var c = colorFor(state, person);
  var rows = tasks.map(function(t){
    return renderTaskRow(t, canAct);
  }).join("");
  return "<div class=\"hero\">" +
    "<div class=\"hero-top\">" +
    "<span class=\"avatar lg\" style=\"background:" + c + "\">" + esc(initialsFor(person)) + "</span>" +
    "<div><div class=\"date mono\">" + fmtDateLong(today) + "</div>" +
    "<h2>" + esc(person) + "</h2>" +
    "<div class=\"caption\">" + (canAct ? "Te toca hoy — completa las tareas de abajo" : "Le toca hoy") + "</div>" +
    "</div></div>" +
    "<div class=\"tasks\">" + rows + "</div>" +
    "</div>";
}

function renderTaskRow(t, canAct){
  var action = "";
  if(t.done){
    action = (t.img ? "<img class=\"thumb\" src=\"" + t.img + "\">" : "") +
      "<span class=\"task-meta\">" + esc(t.by||"") + (t.at ? " · " + fmtTime(t.at) : "") + "</span>";
  } else if(canAct){
    if(t.photo){
      action = "<label class=\"btn btn-primary btn-file\">📷 Adjuntar foto<input type=\"file\" accept=\"image/*\" capture=\"environment\" data-action=\"upload-photo\" data-task=\"" + esc(t.id) + "\"></label>";
    } else {
      action = "<button class=\"btn btn-primary\" data-action=\"complete-nophoto\" data-task=\"" + esc(t.id) + "\">Marcar hecho</button>";
    }
  } else {
    action = "<span class=\"pill warn\">Pendiente</span>";
  }
  return "<div class=\"task-row" + (t.done ? " is-done" : "") + "\">" +
    "<div class=\"task-main\"><span class=\"task-check\">✓</span><span class=\"task-label\">" + esc(t.label) + (t.photo ? " 📷" : "") + "</span></div>" +
    "<div class=\"task-action\">" + action + "</div>" +
    "</div>";
}

function renderWeekStrip(state){
  var today = todayStr();
  var cards = [];
  for(var i=0;i<7;i++){
    var d = addDays(today, i);
    var person = personForDate(state, d);
    var c = colorFor(state, person);
    cards.push("<div class=\"week-card" + (i===0 ? " today" : "") + "\">" +
      "<div class=\"d mono\">" + (i===0 ? "HOY" : fmtDateShort(d)) + "</div>" +
      "<span class=\"avatar\" style=\"background:" + c + ";margin:0 auto 8px\">" + esc(initialsFor(person)) + "</span>" +
      "<div class=\"name\">" + esc(person) + "</div>" +
      "</div>");
  }
  return "<div class=\"section-title\">Esta semana</div><div class=\"week-strip\">" + cards.join("") + "</div>";
}

function renderHistory(state){
  var today = todayStr();
  var recentKeys = Object.keys(state.days).filter(function(k){return k!==today;}).sort().reverse();
  var recentHtml = recentKeys.map(function(k){
    var day = state.days[k];
    var total = day.tasks.length;
    var done = day.tasks.filter(function(t){return t.done;}).length;
    var complete = done===total;
    var expanded = !!expandedDays[k];
    var photos = day.tasks.filter(function(t){return t.img;}).map(function(t){
      return "<div><img src=\"" + t.img + "\"><div class=\"cap\">" + esc(t.label) + "</div></div>";
    }).join("");
    return "<div class=\"history-item\">" +
      "<div class=\"history-head\" data-action=\"toggle-history\" data-date=\"" + k + "\">" +
      "<div class=\"left\"><span class=\"date mono\">" + fmtDateShort(k) + "</span><span>" + esc(day.person) + "</span></div>" +
      "<span class=\"pill " + (complete ? "good" : "warn") + "\">" + done + "/" + total + "</span>" +
      "</div>" +
      (expanded ? "<div class=\"history-photos\">" + (photos || "<span class=\"empty\">Sin fotos adjuntadas</span>") + "</div>" : "") +
      "</div>";
  }).join("");

  var histKeys = Object.keys(state.history).sort().reverse();
  var logRows = histKeys.map(function(k){
    var h = state.history[k];
    var complete = h.done === h.total;
    return "<tr><td class=\"mono\">" + fmtDateShort(k) + "</td><td>" + esc(h.person) + "</td><td>" +
      "<span class=\"pill " + (complete ? "good" : "warn") + "\">" + h.done + "/" + h.total + "</span></td></tr>";
  }).join("");
  var logTable = histKeys.length ?
    "<div class=\"log-wrap\"><table class=\"log\"><thead><tr><th>Fecha</th><th>Persona</th><th>Cumplido</th></tr></thead><tbody>" + logRows + "</tbody></table></div>" :
    "";

  return "<div class=\"section-title\">Historial reciente</div>" +
    (recentHtml || "<div class=\"empty\">Todavía no hay días registrados.</div>") +
    (histKeys.length ? "<div class=\"section-title\">Archivo</div>" + logTable : "");
}

function renderAdminToggle(){
  return "<div class=\"admin-toggle\"><button class=\"btn\" data-action=\"toggle-admin\">⚙️ Panel de administración" + (adminPanelOpen ? " (ocultar)" : "") + "</button></div>";
}

function renderAdmin(state){
  var taskRows = state.taskTemplate.map(function(t, i){
    return "<div class=\"admin-row\">" +
      "<input type=\"text\" data-field=\"label\" data-index=\"" + i + "\" value=\"" + escAttr(t.label) + "\">" +
      "<label class=\"chk\"><input type=\"checkbox\" data-action=\"task-toggle-photo\" data-index=\"" + i + "\" " + (t.photo?"checked":"") + "> foto</label>" +
      "<button class=\"icon-btn\" data-action=\"task-remove\" data-index=\"" + i + "\" title=\"Eliminar\">🗑</button>" +
      "</div>";
  }).join("");

  var peopleRows = state.people.map(function(name, i){
    return "<div class=\"admin-row\">" +
      "<span class=\"avatar\" style=\"background:" + colorFor(state,name) + "\">" + esc(initialsFor(name)) + "</span>" +
      "<span style=\"flex:1\">" + esc(name) + "</span>" +
      "<button class=\"icon-btn\" data-action=\"person-up\" data-index=\"" + i + "\" title=\"Subir\">▲</button>" +
      "<button class=\"icon-btn\" data-action=\"person-down\" data-index=\"" + i + "\" title=\"Bajar\">▼</button>" +
      "<button class=\"icon-btn\" data-action=\"person-remove\" data-index=\"" + i + "\" title=\"Quitar\">🗑</button>" +
      "</div>";
  }).join("");

  var today = todayStr();
  var day = state.days[today];
  var manualRows = "";
  if(day){
    manualRows = day.tasks.map(function(t){
      return "<div class=\"admin-row\"><span style=\"flex:1\">" + esc(t.label) + "</span>" +
        "<button class=\"btn\" data-action=\"admin-toggle-task\" data-task=\"" + esc(t.id) + "\">" + (t.done ? "Marcar pendiente" : "Marcar hecho") + "</button>" +
        "</div>";
    }).join("");
  } else {
    manualRows = "<div class=\"empty\">Aún no hay tareas de hoy iniciadas.</div>";
  }

  return "<div class=\"admin-panel\">" +
    "<div class=\"admin-block\"><h3>Tareas diarias</h3>" + taskRows +
    "<div class=\"new-row\"><input type=\"text\" id=\"new-task-label\" placeholder=\"Nueva tarea…\">" +
    "<label class=\"chk\"><input type=\"checkbox\" id=\"new-task-photo\" checked> foto</label>" +
    "<button class=\"btn btn-primary\" data-action=\"task-add\">Añadir</button></div></div>" +

    "<div class=\"admin-block\"><h3>Orden de turnos</h3>" + peopleRows +
    "<div class=\"new-row\"><input type=\"text\" id=\"new-person-name\" placeholder=\"Nombre…\">" +
    "<button class=\"btn btn-primary\" data-action=\"person-add\">Añadir</button></div></div>" +

    "<div class=\"admin-block\"><h3>Marcar manualmente (hoy)</h3>" + manualRows + "</div>" +
    "</div>";
}

/* ================= escaping ================= */
function esc(s){
  return String(s==null?"":s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; });
}
function escAttr(s){
  return esc(s).replace(/"/g, "&quot;");
}

/* ================= action handlers ================= */
function handlePickName(name){
  try{ localStorage.setItem(STORAGE_KEY, name); }catch(e){}
  myName = name;
  render();
}
function handleChangeUser(){
  if(!window.confirm("¿Cambiar de usuario en este dispositivo?")) return;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  myName = null;
  render();
}
function handleCompleteNoPhoto(taskId){
  var s = clone(STATE);
  var day = ensureDay(s, todayStr());
  var task = day.tasks.filter(function(t){return t.id===taskId;})[0];
  if(!task) return;
  task.done = true; task.by = myName; task.at = new Date().toISOString();
  archiveOldDays(s);
  publishState(s);
}
function handleUploadPhoto(taskId, file){
  fileToCompressedDataURL(file).then(function(dataUrl){
    var s = clone(STATE);
    var day = ensureDay(s, todayStr());
    var task = day.tasks.filter(function(t){return t.id===taskId;})[0];
    if(!task) return;
    task.done = true; task.img = dataUrl; task.by = myName; task.at = new Date().toISOString();
    archiveOldDays(s);
    publishState(s);
  }).catch(function(){
    window.alert("No se pudo procesar la foto, inténtalo de nuevo.");
  });
}
function handleAdminToggleTask(taskId){
  var s = clone(STATE);
  var day = ensureDay(s, todayStr());
  var task = day.tasks.filter(function(t){return t.id===taskId;})[0];
  if(!task) return;
  task.done = !task.done;
  if(task.done){ task.by = myName + " (manual)"; task.at = new Date().toISOString(); }
  else { task.by = null; task.at = null; task.img = null; }
  archiveOldDays(s);
  publishState(s);
}
function handleTaskToggle(index){
  var s = clone(STATE);
  if(!s.taskTemplate[index]) return;
  s.taskTemplate[index].photo = !s.taskTemplate[index].photo;
  publishState(s);
}
function handleTaskLabelChange(index, value){
  var s = clone(STATE);
  if(!s.taskTemplate[index]) return;
  s.taskTemplate[index].label = value;
  publishState(s);
}
function handleTaskRemove(index){
  var s = clone(STATE);
  if(!window.confirm("¿Eliminar esta tarea de la lista diaria?")) return;
  s.taskTemplate.splice(index,1);
  publishState(s);
}
function handleTaskAdd(){
  var labelEl = document.getElementById("new-task-label");
  var photoEl = document.getElementById("new-task-photo");
  var label = labelEl.value.trim();
  if(!label) return;
  var s = clone(STATE);
  var id = "t" + Date.now();
  s.taskTemplate.push({id:id, label:label, photo: photoEl.checked});
  publishState(s);
}
function handlePersonMove(index, dir){
  var s = clone(STATE);
  var j = index + dir;
  if(j<0 || j>=s.people.length) return;
  var tmp = s.people[index]; s.people[index]=s.people[j]; s.people[j]=tmp;
  publishState(s);
}
function handlePersonRemove(index){
  var s = clone(STATE);
  if(s.people.length<=1) return;
  if(!window.confirm("¿Quitar a " + s.people[index] + " de la rotación?")) return;
  s.people.splice(index,1);
  publishState(s);
}
function handlePersonAdd(){
  var el = document.getElementById("new-person-name");
  var name = el.value.trim();
  if(!name) return;
  var s = clone(STATE);
  if(s.people.indexOf(name)!==-1) return;
  s.people.push(name);
  publishState(s);
}

/* ================= events ================= */
document.getElementById("app").addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  var action = el.getAttribute("data-action");
  if(action==="pick-name") handlePickName(el.getAttribute("data-name"));
  else if(action==="change-user") handleChangeUser();
  else if(action==="complete-nophoto") handleCompleteNoPhoto(el.getAttribute("data-task"));
  else if(action==="toggle-admin"){ adminPanelOpen = !adminPanelOpen; render(); }
  else if(action==="toggle-history"){
    var k = el.getAttribute("data-date");
    expandedDays[k] = !expandedDays[k];
    render();
  }
  else if(action==="admin-toggle-task") handleAdminToggleTask(el.getAttribute("data-task"));
  else if(action==="task-remove") handleTaskRemove(parseInt(el.getAttribute("data-index"),10));
  else if(action==="task-add") handleTaskAdd();
  else if(action==="person-up") handlePersonMove(parseInt(el.getAttribute("data-index"),10), -1);
  else if(action==="person-down") handlePersonMove(parseInt(el.getAttribute("data-index"),10), 1);
  else if(action==="person-remove") handlePersonRemove(parseInt(el.getAttribute("data-index"),10));
  else if(action==="person-add") handlePersonAdd();
});

document.getElementById("app").addEventListener("change", function(e){
  var el = e.target;
  if(el.matches("[data-action='upload-photo']")){
    var file = el.files && el.files[0];
    if(file) handleUploadPhoto(el.getAttribute("data-task"), file);
  } else if(el.matches("[data-action='task-toggle-photo']")){
    handleTaskToggle(parseInt(el.getAttribute("data-index"),10));
  } else if(el.matches("[data-field='label']")){
    handleTaskLabelChange(parseInt(el.getAttribute("data-index"),10), el.value);
  }
});

/* ================= capability init ================= */
(function initCapability(){
  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(cap){
      if(cap){ CAP = cap; capStatus = "ready"; } else { capStatus = "offline"; }
      render();
    }).catch(function(){ capStatus = "offline"; render(); });
  } else {
    capStatus = "offline";
  }
})();

/* ================= initial paint ================= */
render();

})();
</script>
