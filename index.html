<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#176B4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa Holanda">
<meta name="description" content="Turnos de limpieza por zonas de la Casa Holanda: equipos semanales, tareas con foto y control del material.">
<title>Casa Holanda</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#EDF0EC; --line:#E0E5DF;
  --ink:#15201B; --muted:#697A71;
  --accent:#176B4A; --accent-soft:#E4EFE9;
  --ok:#2E8B57; --warn:#B07A24; --warn-soft:#FBF3E4; --warn-ink:#7A5312;
  --bad:#B4453A; --bad-soft:#F7E8E6;
  --r:14px;
  --shadow:0 1px 2px rgba(16,32,24,.05), 0 8px 24px -12px rgba(16,32,24,.18);
  --font:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1613; --surface:#18211D; --surface-2:#202B26; --line:#2C3832;
    --ink:#E8EFEA; --muted:#92A49A;
    --accent:#4FB487; --accent-soft:#1A2E26;
    --ok:#5CBE87; --warn:#D6A050; --warn-soft:#2C2516; --warn-ink:#E0BE78;
    --bad:#DE7A6D; --bad-soft:#331F1C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#18211D; --surface-2:#202B26; --line:#2C3832;
  --ink:#E8EFEA; --muted:#92A49A;
  --accent:#4FB487; --accent-soft:#1A2E26;
  --ok:#5CBE87; --warn:#D6A050; --warn-soft:#2C2516; --warn-ink:#E0BE78;
  --bad:#DE7A6D; --bad-soft:#331F1C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
     -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:480px;margin:0 auto;padding:0 16px 100px}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:16px 0 12px;
        display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand .name{font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand .week{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
          display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
.me{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:3px 11px 3px 3px;cursor:pointer}
.me .nm{font-size:13px;font-weight:600}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;
    font-weight:700;font-size:12px;flex-shrink:0;letter-spacing:-.01em}
.av.s{width:22px;height:22px;font-size:10px}
.av.l{width:52px;height:52px;font-size:20px}

.eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;
         color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow:first-child{margin-top:4px}

.zone{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.zone.mine{box-shadow:var(--shadow);border-color:transparent}
.zone-top{padding:15px 16px;display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.zone-bar{width:3px;align-self:stretch;border-radius:3px;background:var(--zc);flex-shrink:0}
.zone-id{flex:1;min-width:0}
.zone-name{font-weight:700;font-size:16px;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.zone-dot{width:8px;height:8px;border-radius:50%;background:var(--zc);flex-shrink:0}
.zone-rooms{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.zone-people{display:flex;align-items:center;gap:5px;margin-top:9px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border-radius:999px;
      padding:3px 9px 3px 3px;font-size:12px;font-weight:600}
.chip.you{background:var(--accent-soft);color:var(--accent)}
.chip.vacia{padding:3px 9px;color:var(--muted);font-weight:500}
.prog{flex-shrink:0;text-align:right}
.prog .n{font-family:var(--mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.prog .n b{font-size:17px;font-weight:500}
.bar{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:6px;width:62px}
.bar i{display:block;height:100%;background:var(--zc);border-radius:4px}
.bar.done i{background:var(--ok)}

.tasks{border-top:1px solid var(--line)}
.task{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.tick{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0;
      display:grid;place-items:center;color:transparent}
.task.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.t-main{flex:1;min-width:0}
.t-label{font-size:14px;font-weight:500;line-height:1.35}
.task.done .t-label{color:var(--muted)}
.t-meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.freq{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
      border:1px solid var(--line);border-radius:4px;padding:1px 4px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.thumb{width:34px;height:34px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--line);cursor:zoom-in}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);
     background:var(--surface);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;
     cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-pri:hover{filter:brightness(1.08);border-color:var(--accent)}
.btn-sm{padding:5px 9px;font-size:12px}
.btn-wide{width:100%;padding:11px}
.btn-danger{color:var(--bad);border-color:var(--bad)}

.note{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;
      font-size:13.5px;line-height:1.4;margin-bottom:10px;border:1px solid;cursor:pointer}
.note.buy{background:var(--warn-soft);border-color:var(--warn);color:var(--warn-ink)}
.note b{font-weight:700}

.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.stat .k{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat .v{font-size:23px;font-weight:700;letter-spacing:-.03em;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;color:var(--muted);font-weight:500}
.item{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:0}
.item .nm{flex:1;min-width:120px;font-size:14px;font-weight:500}
.item .nm small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:400;margin-top:1px}
.qty{display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:9px;padding:2px}
.qty button{width:28px;height:28px;border:0;background:none;border-radius:7px;cursor:pointer;
            color:var(--muted);font-size:16px;line-height:1;display:grid;place-items:center}
.qty button:hover{background:var(--surface);color:var(--ink)}
.qty .n{min-width:30px;text-align:center;font-family:var(--mono);font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums}
.tag{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;
     padding:3px 7px;border-radius:5px;font-weight:500;flex-shrink:0}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.low{background:var(--warn-soft);color:var(--warn-ink)}
.tag.out{background:var(--bad-soft);color:var(--bad)}
.tag.plain{background:var(--surface-2);color:var(--muted)}

.wk{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden}
.wk-top{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer}
.wk-when{font-family:var(--mono);font-size:12px;color:var(--muted);flex-shrink:0;min-width:76px}
.wk-sum{flex:1;display:flex;gap:4px}
.seg{height:5px;border-radius:3px;flex:1;background:var(--surface-2);overflow:hidden}
.seg i{display:block;height:100%;background:var(--zc)}
.wk-pct{font-family:var(--mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.wk-body{border-top:1px solid var(--line);padding:4px 0}
.wk-zone{display:flex;align-items:center;gap:10px;padding:9px 15px}
.wk-zone .nm{flex:1;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.wk-zone .who{font-size:12px;color:var(--muted)}
.wk.vacia{background:var(--bad-soft);border-color:var(--bad)}
.wk.vacia .wk-pct{color:var(--bad)}
.wk-sep{border-top:1px solid var(--line);margin:4px 0}
.dy{display:flex;align-items:center;gap:10px;padding:7px 15px}
.dy .d{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:52px;flex-shrink:0}
.dy .segs{flex:1;display:flex;gap:3px}
.dy .n{font-family:var(--mono);font-size:11.5px;color:var(--muted);
       font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.dy .qn{font-size:11.5px;color:var(--muted);min-width:56px;flex-shrink:0;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dy.nada{background:var(--bad-soft)}
.dy.nada .d,.dy.nada .n{color:var(--bad);font-weight:600}
.dchips{display:flex;gap:6px;flex-wrap:wrap}
.dchip{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;
       padding:9px 0;width:40px;text-align:center;border-radius:9px;cursor:pointer;
       border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
.dchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* ---------- admin ---------- */
.acc{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden}
.acc-top{display:flex;align-items:center;gap:10px;padding:14px 15px;cursor:pointer}
.acc-top .nm{flex:1;font-weight:600;font-size:14.5px}
.acc-top .ct{font-family:var(--mono);font-size:11px;color:var(--muted)}
.acc-body{border-top:1px solid var(--line);padding:12px 15px}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.row:last-child{margin-bottom:0}
.row .grow{flex:1;min-width:130px}
.fld{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg);color:var(--ink);width:100%}
.fld-sm{padding:5px 8px;font-size:13px}
.lab{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
     display:block;margin-bottom:4px}
.mini{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;
      display:grid;place-items:center;cursor:pointer;flex-shrink:0;color:var(--muted);font-size:14px}
.mini:hover{border-color:var(--muted);color:var(--ink)}
.sub{border-left:2px solid var(--zc);padding-left:11px;margin-bottom:14px}
.sub:last-child{margin-bottom:0}
.sub-h{font-weight:700;font-size:13.5px;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.card-task{background:var(--surface-2);border-radius:9px;padding:9px 10px;margin-bottom:7px}
.card-task select{min-width:0;flex:1 1 86px}

/* ---------- cámara y visor ---------- */
.cam-back{position:fixed;inset:0;background:rgba(8,16,12,.9);display:flex;align-items:center;
          justify-content:center;padding:14px;z-index:60}
.cam-box{background:var(--surface);border-radius:var(--r);width:100%;max-width:520px;overflow:hidden}
.cam-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line)}
.cam-head span{font-weight:600;font-size:14.5px}
.cam-head button{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.cam-stage{position:relative;background:#0B1210;min-height:220px;display:flex;align-items:center;justify-content:center}
.cam-stage video,.cam-stage img{width:100%;max-height:58vh;object-fit:contain;background:#0B1210}
.cam-status{position:absolute;color:#DCE8E2;font-family:var(--mono);font-size:12px;text-align:center;padding:0 20px}
.cam-actions{display:flex;gap:8px;justify-content:center;padding:14px}
.cam-fallback{padding:18px;text-align:center}
.cam-fallback p{color:var(--muted);font-size:13px;margin:0 0 12px}
.btn-file{position:relative;overflow:hidden}
.btn-file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.lightbox{position:fixed;inset:0;background:rgba(8,16,12,.94);display:flex;align-items:center;
          justify-content:center;padding:20px;z-index:70;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:90vh;object-fit:contain;border-radius:10px}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);
     border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.nav-in{max-width:480px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;cursor:pointer;padding:6px 0 4px;
            display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
.nav button.on{color:var(--accent)}
.nav .lb{font-size:10.5px;font-weight:600}
.nav svg{width:21px;height:21px}
.nav .dot{position:absolute;transform:translate(13px,-3px);width:7px;height:7px;border-radius:50%;background:var(--bad)}

#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
       padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:500;z-index:80;max-width:90vw;text-align:center}
#toast.bad{background:var(--bad);color:#fff}
.boot{max-width:480px;margin:0 auto;padding:70px 20px;text-align:center;color:var(--muted);
      font-family:var(--mono);font-size:13px;line-height:1.6}
.empty{color:var(--muted);font-size:13px;padding:16px 2px;text-align:center}

/* Bloques de sección: el turno diario y la limpieza a fondo se ven distintos
   de un vistazo, y cada uno se puede plegar. */
.blk{margin:0 0 4px}
.blk-h{display:flex;align-items:center;gap:11px;padding:2px 2px 11px;cursor:pointer}
.blk-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.blk-ic svg{width:19px;height:19px}
.blk-t{flex:1;min-width:0}
.blk-n{font-weight:700;font-size:15.5px;letter-spacing:-.015em}
.blk-s{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.35}
.blk-tag{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;
         padding:4px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0;font-weight:500}
.blk-ch{color:var(--muted);font-size:13px;flex-shrink:0}
.blk-hoy .blk-ic{background:var(--accent-soft);color:var(--accent)}
.blk-hoy .blk-tag{background:var(--accent);color:#fff}
.blk-fondo .blk-ic{background:var(--surface-2);color:var(--muted)}
.blk-fondo .blk-tag{background:var(--surface-2);color:var(--muted)}
.blk-fondo.activo .blk-ic{background:var(--warn-soft);color:var(--warn-ink)}
.blk-fondo.activo .blk-tag{background:var(--warn);color:#fff}

/* Una zona dormida: su fin de semana todavía no ha llegado. Se ve que está
   ahí y de quién es, pero que hoy no se le pide nada. */
.zone.dormida{background:transparent;border-style:dashed;box-shadow:none}
.zone.dormida .zone-top{padding-top:12px;padding-bottom:12px}
.zone.dormida .zone-name{font-size:15px}
.zone.dormida .zone-bar{opacity:.45}
.zone.dormida .prog .n{color:var(--muted);font-size:11px;font-family:var(--mono);
                       text-transform:uppercase;letter-spacing:.06em}
.zone.dormida .bar{display:none}
.cuenta{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;padding:0 0 12px}

/* Qué te toca a ti hoy, antes que nada. */
.mio{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
     border-radius:var(--r);padding:13px 15px;margin-bottom:20px;box-shadow:var(--shadow)}
.mio .av{width:38px;height:38px;font-size:15px;flex-shrink:0}
.mio-t{flex:1;min-width:0}
.mio-k{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;
       color:var(--muted);margin-bottom:3px}
.mio-v{font-size:14.5px;font-weight:600;line-height:1.3}
.mio-v em{font-style:normal;color:var(--muted);font-weight:500}
</style>
</head>
<body>

<div id="app"><div class="boot">Cargando…</div></div>
<div id="cam" hidden></div>
<div id="toast" hidden></div>

<nav class="nav" id="nav" hidden>
  <div class="nav-in" id="navIn"></div>
</nav>

<script>
(function(){
"use strict";

/* ================= backend ================= */
var SUPA_URL = "https://lmuiogddgfmmbouaanzo.supabase.co";
var SUPA_KEY = "sb_publishable_NqIyAof4Y4fYyzf53qjlnA_-xDvYwsc";
var BUCKET = "casa-fotos";

function api(path, opts){
  opts = opts || {};
  var h = {apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY, "Content-Type":"application/json"};
  if(opts.prefer) h["Prefer"] = opts.prefer;
  return fetch(SUPA_URL + "/rest/v1/" + path, {
    method: opts.method || "GET", headers: h, cache: "no-store",
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error("HTTP "+r.status+" "+t); });
    if(r.status === 204) return null;
    return r.text().then(function(t){ return t ? JSON.parse(t) : null; });
  });
}
function uploadPhoto(dataUrl, prefix){
  var blob = dataURLtoBlob(dataUrl);
  var path = prefix + "/" + Date.now() + "-" + Math.random().toString(36).slice(2,8) + ".jpg";
  return fetch(SUPA_URL + "/storage/v1/object/" + BUCKET + "/" + path, {
    method:"POST", headers:{apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY, "Content-Type":"image/jpeg"}, body:blob
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error("Subida "+r.status+" "+t); });
    return SUPA_URL + "/storage/v1/object/public/" + BUCKET + "/" + path;
  });
}
function dataURLtoBlob(dataUrl){
  var p = dataUrl.split(","), mime = (p[0].match(/:(.*?);/)||[])[1] || "image/jpeg";
  var bin = atob(p[1]), arr = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

/* ================= constantes ================= */

/* ================= fechas ================= */
function f(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function hoy(){ return f(new Date()); }
function mas(fecha, n){ var d = new Date(fecha+"T00:00:00"); d.setDate(d.getDate()+n); return f(d); }
function entre(a,b){ return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000); }
function dow(fecha){ return new Date(fecha+"T00:00:00").getDay(); }
/* La semana va de lunes a domingo, para que el fin de semana entero caiga
   dentro de la semana del mismo equipo: la limpieza a fondo se puede hacer el
   sábado o el domingo sin que por medio haya un relevo. Los cubos verdes no
   dependen de esto: llevan su propio turno, contado por días. */
function semanaDe(fecha){ return mas(fecha, -((dow(fecha) + 6) % 7)); }
function corta(fecha){ var d = new Date(fecha+"T00:00:00"); return d.getDate()+" "+MES[d.getMonth()]; }
function rango(sem){ return corta(sem)+" – "+corta(mas(sem,6)); }
function hora(iso){
  if(!iso) return "";
  var d = new Date(iso);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function eur(n){ return (n===null||n===undefined||isNaN(n)) ? "—" : Number(n).toFixed(2).replace(".",",")+" €"; }
function num(v){ var n = parseFloat(String(v).replace(",",".")); return isNaN(n) ? null : n; }
function qty(n){ n = Math.round(Number(n||0)*100)/100; return String(n).replace(".",","); }

/* ================= rotación ================= */
/* Las secciones con rotación propia (los cubos) no consumen plaza en el
   reparto de zonas: por eso 7 plazas siguen cuadrando con 7 personas. */
function zonasDeTurno(){ return S.zonas.filter(function(z){ return !z.rota_aparte; }); }
function zonasAparte(){ return S.zonas.filter(function(z){ return z.rota_aparte; }); }
function plazas(){
  var out = [];
  zonasDeTurno().forEach(function(z){ for(var i=0;i<z.plazas;i++) out.push(z.id); });
  return out;
}
/* El paso de la rotación. Con paso 1 todos avanzan una plaza y las parejas son
   siempre vecinos de la lista; con paso 2 quedan a dos puestos, y así. Vale
   cualquier multiplicador coprimo con el número de personas: así reparte las
   plazas sin repetir a nadie. Como a y n-a dan las mismas parejas, basta con
   la primera mitad. */
function mcd(a, b){ while(b){ var t = a % b; a = b; b = t; } return a; }
function pasos(n){
  var out = [];
  for(var a=1; a<=Math.floor(n/2); a++) if(mcd(a, n) === 1) out.push(a);
  return out.length ? out : [1];
}
function semanasDesdeAncla(sem){ return Math.round(entre(S.rotacionDesde, sem) / 7); }
/* Una ronda son n semanas: al acabarla todos han pasado por todas las plazas.
   La ronda siguiente cambia el paso, y con él las parejas. */
function rondaDe(sem){
  var n = S.gente.length;
  if(!n || !S.rotacionDesde) return 0;
  return Math.floor(semanasDesdeAncla(sem) / n);
}
function pasoDe(sem){
  var ps = pasos(S.gente.length || 1), r = rondaDe(sem);
  return ps[((r % ps.length) + ps.length) % ps.length];
}
/* El reparto de zonas, que dura toda la semana. */
function calcula(sem){
  var p = plazas(), n = S.gente.length, map = {};
  zonasDeTurno().forEach(function(z){ map[z.id] = []; });
  if(!n || !S.rotacionDesde || sem < S.rotacionDesde) return map;
  var w = semanasDesdeAncla(sem), paso = pasoDe(sem);
  p.forEach(function(zid, i){
    map[zid].push(S.gente[((((paso * i + w) % n) + n) % n)]);
  });
  return map;
}
/* Las secciones con rotación propia se cuentan por días, no por semanas: el
   turno diario cambia cada día y el de los cubos cada domingo, que ya no es
   donde empieza la semana de las zonas. */
function turnoDe(z, dia){
  var n = S.gente.length;
  if(!n || !z.rota_desde || !z.rota_persona || dia < z.rota_desde) return [];
  var dias = entre(z.rota_desde, dia);
  var cada = Math.max(1, z.rota_cada || 7);
  /* `rota_salto` son los puestos extra que corre el turno cada semana. El turno
     diario necesita 2: con 1 se anula contra el avance semanal de las zonas y
     el turno del fin de semana caería siempre sobre la misma zona durante toda
     una ronda. Con 2 se reparte entre las cuatro. */
  var idx = Math.floor(dias / cada) + (z.rota_salto || 0) * Math.floor(dias / 7);
  var base = S.gente.indexOf(z.rota_persona);
  if(base < 0) base = 0;
  var out = [];
  for(var k=0; k<Math.max(1, z.plazas); k++){
    out.push(S.gente[((((base + idx + k) % n) + n) % n)]);
  }
  return out;
}
/* Las personas distintas que pasan por una sección aparte a lo largo de una
   semana: una sola para los cubos, la casa entera para el turno diario. */
function turnoSemana(z, sem){
  var out = [];
  for(var i=0;i<7;i++){
    turnoDe(z, mas(sem, i)).forEach(function(q){ if(out.indexOf(q) < 0) out.push(q); });
  }
  return out;
}
function asignacion(sem){ return S.semanas[sem] || calcula(sem); }
/* Reparto completo de un día: las zonas por su semana, las secciones aparte
   por su propio turno. */
function asignacionDia(dia){
  var a = asignacion(semanaDe(dia)), map = {};
  S.zonas.forEach(function(z){
    map[z.id] = z.rota_aparte ? turnoDe(z, dia) : (a[z.id] || []);
  });
  return map;
}
/* La sección que rota a diario, si la hay: su turno se enseña en el historial
   día a día, porque cambia de dueño cada jornada. */
function zonaDiaria(){
  return S.zonas.filter(function(z){ return z.rota_aparte && (z.rota_cada || 7) < 7; })[0] || null;
}
/* Fija el reparto de zonas de la semana en curso para que el historial no
   cambie si alguien entra o sale de la casa más adelante. Las secciones
   aparte no se congelan: se recalculan por día. */
function fijarSemana(){
  var sem = semanaDe(hoy());
  if(S.semanas[sem] || !S.gente.length || !S.rotacionDesde || sem < S.rotacionDesde) return Promise.resolve();
  var a = calcula(sem);
  S.semanas[sem] = a;
  return api("casa_semanas?on_conflict=semana", {
    method:"POST", prefer:"resolution=ignore-duplicates,return=minimal",
    body:[{semana: sem, asignacion: a}]
  }).catch(function(){});
}
/* Se puede tener zona, turno diario y cubos el mismo día. */
function misZonas(dia){
  var a = asignacionDia(dia);
  return S.zonas.filter(function(z){ return (a[z.id]||[]).indexOf(yo) > -1; });
}

/* ================= tareas ================= */
/* Una tarea se pide en unos días (`dias`, o los días de limpieza de la casa si
   no tiene los suyos) y cuenta por día o por semana (`semanal`). La limpieza a
   fondo se pide sábado y domingo pero es semanal: un solo tic, lo haga el
   equipo el día que lo haga. */
function tareasDe(zid){ return S.tareas.filter(function(t){ return t.zona_id === zid; }); }
function diasLimpieza(){ return S.diasLimpieza || []; }
function esDiaDeLimpieza(dia){ return diasLimpieza().indexOf(dow(dia)) > -1; }
function toca(t, dia){
  return (t.dias && t.dias.length)
    ? t.dias.indexOf(dow(dia)) > -1
    : esDiaDeLimpieza(dia);
}
function tareasDeDia(zid, dia){
  /* Una zona sin nadie asignado ese día no pide nada: no puede estar "sin
     hacer" lo que no era de nadie. Pasa antes de que arranque una rotación. */
  if(!(asignacionDia(dia)[zid] || []).length) return [];
  return tareasDe(zid).filter(function(t){ return toca(t, dia); });
}
/* El siguiente día con turno propio: el bloque de hoy mira solo lo suyo, no
   el fin de semana de las zonas. */
function proximoDiaAparte(dia){
  for(var i=1;i<=7;i++){
    var d = mas(dia, i);
    if(zonasAparte().some(function(z){ return tareasDeDia(z.id, d).length > 0; })) return d;
  }
  return null;
}
/* El periodo es la clave con la que se guarda que una tarea está hecha: el día
   para las diarias, el lunes que abre la semana para las semanales. */
function periodoDe(t, dia){ return t.semanal ? semanaDe(dia) : dia; }
function hecha(t, dia){ return S.hechas[t.id + "|" + periodoDe(t, dia)] || null; }
/* Progreso de un día: solo las tareas que tocaban ese día. */
function progreso(zid, dia){
  var ts = tareasDeDia(zid, dia), d = 0;
  ts.forEach(function(t){ if(hecha(t, dia)) d++; });
  return {d:d, t:ts.length, p: ts.length ? Math.round(d/ts.length*100) : 0};
}
/* Progreso de una semana: suma de sus días, sin contar dos veces una tarea
   semanal que se pide en varios días. Por defecto los días que aún no han
   llegado no cuentan, si no la semana en curso saldría siempre a medias;
   `entera` recorre la semana completa, que es lo que interesa en la ficha de
   una zona para ver cuánto le falta al fin de semana. */
function progresoSemana(zid, sem, entera){
  var total = 0, d = 0, tope = hoy(), vistos = {};
  for(var i=0;i<7;i++){
    var dia = mas(sem, i);
    if(!entera && dia > tope) break;
    tareasDeDia(zid, dia).forEach(function(t){
      var k = t.id + "|" + periodoDe(t, dia);
      if(vistos[k]) return;
      vistos[k] = 1;
      total++;
      if(S.hechas[k]) d++;
    });
  }
  return {d:d, t:total, p: total ? Math.round(d/total*100) : 0};
}
/* Un día vacío es un día en que tocó limpiar y no se hizo nada en ninguna
   zona. Son los que hay que ver de un golpe en el historial. */
function progresoDia(dia){
  var total = 0, d = 0;
  S.zonas.forEach(function(z){ var p = progreso(z.id, dia); total += p.t; d += p.d; });
  return {d:d, t:total, p: total ? Math.round(d/total*100) : 0};
}
function puedoHacer(zid, dia){
  if(!yo) return false;
  if(esAdmin()) return true;
  return (asignacionDia(dia)[zid] || []).indexOf(yo) > -1;
}
/* Los días en que se pide algo de las zonas de equipo: el fin de semana. */
function diasFondo(){
  var s = {};
  zonasDeTurno().forEach(function(z){
    tareasDe(z.id).forEach(function(t){
      (t.dias && t.dias.length ? t.dias : diasLimpieza()).forEach(function(d){ s[d] = 1; });
    });
  });
  return Object.keys(s).map(Number).sort(function(a, b){ return ((a+6)%7) - ((b+6)%7); });
}
function diasFondoTexto(){
  var ds = diasFondo();
  if(!ds.length) return "sin días";
  if(ds.length > 3) return ds.length + " días";
  return ds.map(function(d){ return DOW_C[d].toLowerCase(); }).join(" y ");
}
function fondoAbierto(dia){
  return zonasDeTurno().some(function(z){ return tareasDeDia(z.id, dia).length > 0; });
}
function proximoFondo(dia){
  for(var i=1;i<=7;i++){ var d = mas(dia, i); if(fondoAbierto(d)) return d; }
  return null;
}
/* El último día de esta semana en que todavía se puede hacer el fondo. */
function ultimoFondo(dia){
  var sem = semanaDe(dia);
  for(var i=6;i>=0;i--){ var d = mas(sem, i); if(fondoAbierto(d)) return d; }
  return null;
}
/* Una tarea de fin de semana: se pide sábado y domingo y cuenta una sola vez. */
function esDeFinde(t){
  return !!t.semanal && !!t.dias && t.dias.length === 2 &&
         t.dias.indexOf(6) > -1 && t.dias.indexOf(0) > -1;
}
/* El próximo día en que una sección con turno propio cambia de manos. */
function proximoRelevo(z){
  var cada = Math.max(1, z.rota_cada || 7), d = hoy();
  if(!z.rota_desde || z.rota_desde > d) return z.rota_desde || mas(d, 1);
  return mas(z.rota_desde, (Math.floor(entre(z.rota_desde, d) / cada) + 1) * cada);
}
function avatar(n, cls){

}
function esAdmin(){ return !!yo && S.admins.indexOf(yo) > -1; }
function color(n){
  var i = S.gente.indexOf(n);
  return PAL[(i < 0 ? 0 : i) % PAL.length];
}
function comprar(){ return S.items.filter(function(i){ return i.estado === "low" || i.estado === "out"; }); }

/* ================= escapado ================= */
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
function at(s){ return esc(s).replace(/"/g,"&quot;"); }

/* ================= pintado ================= */
function pinta(){
  var el = document.getElementById("app");
  if(!S){ el.innerHTML = '<div class="boot">Cargando…</div>'; return; }
  if(!yo){ el.innerHTML = selector(); document.getElementById("nav").hidden = true; return; }
  document.getElementById("nav").hidden = false;
  pintaNav();
  var cuerpo = vista === "hoy" ? vHoy()
    : vista === "fondo" ? vFondo()
    : vista === "stock" ? vStock()
    : vista === "historial" ? vHistorial()
    : vAdmin();
  el.innerHTML = cabecera() + '<div class="app" style="padding-top:0">' + cuerpo + '</div>' +
    (lightbox ? '<div class="lightbox" data-a="cerrar-foto"><img src="'+at(lightbox)+'" alt=""></div>' : '');
}

function selector(){
  return '<div class="app"><div style="padding:48px 0 10px">' +
    '<div style="font-size:26px;font-weight:700;letter-spacing:-.03em">¿Quién eres?</div>' +
    '<p style="color:var(--muted);margin:6px 0 24px;font-size:14px">Elige tu nombre. Se recordará en este móvil.</p>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px">' +
    S.gente.map(function(n){
      return '<button class="zone" style="padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;margin:0" data-a="yo" data-n="'+at(n)+'">' +
        '<span class="av l" style="background:'+color(n)+'">'+esc(n.charAt(0))+'</span>' +
        '<span style="font-weight:600;font-size:15px">'+esc(n)+'</span></button>';
    }).join('') + '</div></div></div>';
}

function cabecera(){
  var sem = semanaDe(hoy());
  var estado = {ok:"", guardando:"Guardando…", error:"Sin conexión"}[guardando];
  return '<div class="app" style="padding-bottom:0"><div class="topbar">' +
    '<div class="brand"><div class="name">Casa Holanda</div>' +
    '<div class="week">' + (estado ? esc(estado) : rango(sem).toUpperCase()) + '</div></div>' +
    '<div class="topbar-right">' +
    '<button class="icon-btn" data-a="tema" title="Cambiar tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3v1.5M12 19.5V21M4.2 4.2l1.1 1.1M18.7 18.7l1.1 1.1M3 12h1.5M19.5 12H21M4.2 19.8l1.1-1.1M18.7 5.3l1.1-1.1"/><circle cx="12" cy="12" r="4"/></svg></button>' +
    '<button class="me" data-a="cambiar-yo"><span class="av" style="background:'+color(yo)+'">'+esc(yo.charAt(0))+'</span>' +
    '<span class="nm">'+esc(yo)+'</span></button>' +
    '</div></div></div>';
}

function pintaNav(){
  var defs = [{id:"hoy",lb:"Hoy"},{id:"fondo",lb:"A fondo"},
              {id:"stock",lb:"Stock"},{id:"historial",lb:"Historial"}];
  if(esAdmin()) defs.push({id:"admin",lb:"Admin"});
  var falta = comprar().length;
  /* El punto rojo avisa de lo que pide atención: material por comprar, y la
     limpieza a fondo mientras esté abierta y le falte algo a alguna zona. */
  var fondoPide = fondoAbierto(hoy()) && zonasDeTurno().some(function(z){
    var pr = progreso(z.id, hoy());
    return pr.t > pr.d;
  });
  document.getElementById("navIn").innerHTML = defs.map(function(d){
    var punto = (d.id === "stock" && falta) || (d.id === "fondo" && fondoPide);
    return '<button data-a="ir" data-v="'+d.id+'" class="'+(vista===d.id?"on":"")+'">' +
      '<span style="position:relative;display:block">'+NAV_ICON[d.id] +
      (punto ? '<span class="dot"></span>' : '') + '</span>' +
      '<span class="lb">'+d.lb+'</span></button>';
  }).join('');
}

/* ---------- casa ---------- */
function tareaHTML(t, puede, dia){
  var h = hecha(t, dia), acc;
  /* Solo se etiqueta la tarea que se sale del calendario de su sección. La
     limpieza a fondo no lleva etiqueta: ya está dentro del bloque del finde. */
  var etiqueta = "";
  if(t.dias && t.dias.length && t.dias.length < 7 && !esDeFinde(t)){
    var ds = t.dias.slice().sort(function(a, b){ return ((a+6)%7) - ((b+6)%7); });
    etiqueta = (ds.length === 5 && ds.join() === "1,2,3,4,5")
      ? "LUN A VIE"
      : ds.map(function(n){ return DOW_C[n]; }).join(" ");
  }
  if(h){
    acc = (h.foto_url ? '<img class="thumb" src="'+at(h.foto_url)+'" data-a="foto" data-src="'+at(h.foto_url)+'" alt="" loading="lazy">' : '');
  } else if(puede){
    acc = t.foto
      ? '<button class="btn btn-pri btn-sm" data-a="foto-tarea" data-t="'+at(t.id)+'">'+CAM_SVG+' Foto</button>'
      : '<button class="btn btn-pri btn-sm" data-a="marcar" data-t="'+at(t.id)+'">Hecho</button>';
  } else {
    acc = '<span class="tag plain">Pendiente</span>';
  }
  return '<div class="task'+(h?" done":"")+'">' +
    '<span class="tick">'+TICK_SVG+'</span>' +
    '<div class="t-main"><div class="t-label">'+esc(t.label) +
      (etiqueta ? '<span class="freq">'+esc(etiqueta)+'</span>' : '') + '</div>' +
    (h ? '<div class="t-meta">'+esc(h.por)+' · '+hora(h.at)+'</div>' : '') + '</div>' + acc + '</div>';
}

function zonaHTML(z, dia, mia, dormida){
  var sem = semanaDe(dia);
  var p = progreso(z.id, dia);
  /* Dormida: hoy no se le pide nada. La ficha sigue diciendo de quién es y, si
     es tuya, lo deja claro; el progreso se guarda para cuando se abra. */
  if(dormida === undefined) dormida = !p.t && tareasDe(z.id).length > 0;
  var eq = asignacionDia(dia)[z.id] || [];
  var gente = eq.length
    ? eq.map(function(n){
        return '<span class="chip'+(n===yo?" you":"")+'"><span class="av s" style="background:'+color(n)+'">'+esc(n.charAt(0))+'</span>'+esc(n===yo?"Tú":n)+'</span>';
      }).join('')
    : '<span class="chip vacia">Sin asignar</span>';
  var ts = tareasDeDia(z.id, dia);
  var abierta = !dormida && (mia || abierto["z"+z.id]);
  var cuerpo = abierta
    ? '<div class="tasks">' + (ts.length
        ? ts.map(function(t){ return tareaHTML(t, puedoHacer(z.id, dia), dia); }).join('')
        : '<div class="empty">Esta zona no tiene tareas todavía.</div>') + '</div>'
    : '';
  return '<div class="zone'+(mia && !dormida ? " mine" : "")+(dormida ? " dormida" : "")+
    '" style="--zc:'+at(z.color)+'">' +
    '<div class="zone-top" data-a="abre-zona" data-z="'+at(z.id)+'">' +
      '<span class="zone-bar"></span>' +
      '<div class="zone-id"><div class="zone-name"><span class="zone-dot"></span>'+esc(z.nombre)+'</div>' +
        (z.descripcion ? '<div class="zone-rooms">'+esc(z.descripcion)+'</div>' : '') +
        '<div class="zone-people">'+gente+'</div></div>' +
      '<div class="prog"><div class="n">' +
        (dormida ? (mia ? "tu zona" : esc(diasFondoTexto()))
                 : (p.t ? '<b>'+p.d+'</b>/'+p.t : '—')) + '</div>' +
        '<div class="bar'+(p.p===100?" done":"")+'"><i style="width:'+p.p+'%"></i></div></div>' +
    '</div>' + cuerpo + '</div>';
}

/* Un bloque de sección: cabecera con icono, explicación y etiqueta, y el
   cuerpo plegable. Lo que distingue de un vistazo el día a día del fondo. */
function bloque(id, clase, icono, titulo, sub, tag, cuerpo){
  var ab = abierto["b"+id] !== false;             /* abiertos por defecto */
  return '<section class="blk '+clase+'">' +
    '<div class="blk-h" data-a="abre-blk" data-b="'+at(id)+'">' +
      '<span class="blk-ic">'+icono+'</span>' +

        '<div class="blk-s">'+esc(sub)+'</div></div>' +
      '<span class="blk-tag">'+esc(tag)+'</span>' +
      '<span class="blk-ch">'+(ab ? "\u25be" : "\u25b8")+'</span>' +

function avisoCompra(){
  var falta = comprar();
  if(!falta.length) return '';
  return '<div class="note buy" data-a="ir" data-v="stock"><div><b>Hay que comprar ('+falta.length+')</b><br>' +
    esc(falta.slice(0,3).map(function(i){ return i.nombre; }).join(" \u00b7 ")) +
    (falta.length>3 ? ' \u00b7 +'+(falta.length-3) : '') + '</div></div>';
}

function avisoSinRota(dia){
  if(!S.rotacionDesde || semanaDe(dia) >= S.rotacionDesde) return '';
  return '<div class="note"><div><b>La rotaci\u00f3n empieza el ' + DOW[dow(S.rotacionDesde)] + ' ' +
    corta(S.rotacionDesde) + '.</b><br>Hasta entonces las zonas no tienen equipo.</div></div>';
}

/* La tira de arriba: lo tuyo de hoy, en una línea. */
function tiraMia(dia){
  if(!yo) return '';
  var mias = misZonas(dia);
  var conHoy = mias.filter(function(z){ return tareasDeDia(z.id, dia).length > 0; });
  var pend = 0;
  conHoy.forEach(function(z){ var p = progreso(z.id, dia); pend += p.t - p.d; });
  var v, extra;
  if(conHoy.length){
    v = conHoy.map(function(z){ return z.nombre; }).join(" + ");
    extra = pend
      ? "\u00b7 " + (pend === 1 ? "queda 1 tarea" : "quedan " + pend + " tareas")
      : "\u00b7 todo hecho";
  } else {
    v = "Nada por hoy";
    var zf = mias.filter(function(z){ return !z.rota_aparte; })[0];
    extra = zf ? "\u00b7 tu zona del finde es " + zf.nombre : "";
  }
  return '<div class="mio">' + avatar(yo) + '<div class="mio-t">' +
    '<div class="mio-k">Hoy te toca</div>' +
    '<div class="mio-v">' + esc(v) + ' <em>' + esc(extra) + '</em></div></div></div>';
}

/* Ordena poniendo delante lo que es tuyo. */
function miasPrimero(zs, dia){
  var mias = misZonas(dia).map(function(z){ return z.id; });
  return zs.slice().sort(function(a, b){
    return (mias.indexOf(b.id) > -1 ? 1 : 0) - (mias.indexOf(a.id) > -1 ? 1 : 0);
  });
}

/* ---------- hoy: el turno diario y lo que se pide cada día ---------- */
function vHoy(){
  var dia = hoy();
  var mias = misZonas(dia).map(function(z){ return z.id; });
  var zs = miasPrimero(zonasAparte().filter(function(z){
    return tareasDeDia(z.id, dia).length > 0;
  }), dia);
  var sig = zs.length ? null : proximoDiaAparte(dia);
  var cuerpo = zs.length
    ? zs.map(function(z){ return zonaHTML(z, dia, mias.indexOf(z.id) > -1, false); }).join('')
    : '<div class="empty">Hoy no hay turno diario.' +
      (sig ? ' El siguiente es el ' + DOW[dow(sig)] + ' ' + corta(sig) + '.' : '') + '</div>';
  return avisoCompra() + avisoSinRota(dia) + tiraMia(dia) +
    bloque("hoy", "blk-hoy", NAV_ICON.hoy, "Turno diario",
           "Una persona al d\u00eda, para toda la casa.", "cada d\u00eda", cuerpo);
}

/* ---------- a fondo: las zonas, el fin de semana ---------- */
function vFondo(){
  var dia = hoy(), abierta = fondoAbierto(dia);
  var mias = misZonas(dia).map(function(z){ return z.id; });
  var tag, nota = '';
  if(abierta){
    tag = (ultimoFondo(dia) === dia) ? "\u00faltimo d\u00eda" : "abierto hoy";
  } else {
    tag = diasFondoTexto();
    var sig = proximoFondo(dia);
    if(sig){
      var f = entre(dia, sig);
      nota = '<div class="cuenta">Se abre el ' + DOW[dow(sig)] + ' \u00b7 ' +
        (f === 1 ? "ma\u00f1ana" : "faltan " + f + " d\u00edas") + '</div>';
    }
  }
  var zs = miasPrimero(zonasDeTurno(), dia);
  var cuerpo = nota + (zs.length
    ? zs.map(function(z){
        return zonaHTML(z, dia, mias.indexOf(z.id) > -1, !tareasDeDia(z.id, dia).length);
      }).join('')
    : '<div class="empty">No hay zonas todav\u00eda.</div>');
  return avisoSinRota(dia) +
    bloque("fondo", "blk-fondo" + (abierta ? " activo" : ""), NAV_ICON.fondo,
           "Limpieza a fondo",
           "Por zonas, en equipo. Un solo tic: s\u00e1bado o domingo.", tag, cuerpo);
}

/* ---------- historial ---------- */
/* Dos niveles: la semana con su media, y dentro una fila por día. Un día en
   que tocaba limpiar y no se hizo nada sale marcado: era lo que no se veía. */
function vHistorial(){
  var sem = semanaDe(hoy()), tope = hoy(), fila = [];
  for(var i=0;i<SEMANAS_HIST;i++) fila.push(mas(sem, -7*i));
  var arranque = fila[fila.length-1];
  if(S.rotacionDesde && S.rotacionDesde > arranque) arranque = S.rotacionDesde;

  var vacios = 0, activos = 0;
  for(var d = arranque; d <= tope; d = mas(d, 1)){
    var pd = progresoDia(d);
    if(!pd.t) continue;
    activos++;
    if(!pd.d) vacios++;
  }
  var ps = pasos(S.gente.length || 1);

  var resumen = '<div class="stat-row">' +
    '<div class="stat"><div class="k">Días sin hacer nada</div>' +
      '<div class="v"'+(vacios ? ' style="color:var(--bad)"' : '')+'>'+vacios +
      '<small> / '+activos+'</small></div></div>' +
    '<div class="stat"><div class="k">Ronda</div><div class="v">'+(rondaDe(sem)+1) +
      '<small> de '+ps.length+' · paso '+pasoDe(sem)+'</small></div></div>' +
    '</div>';

  var semanas = fila.map(function(w, idx){
    if(S.rotacionDesde && mas(w, 6) < S.rotacionDesde) return "";
    var zs = S.zonas.map(function(z){
      var eq = z.rota_aparte ? turnoSemana(z, w) : (asignacion(w)[z.id] || []);
      if(eq.length > 3) eq = [eq.length + " personas"];
      return {z:z, p:progresoSemana(z.id, w), eq:eq};
    });
    var tot = zs.reduce(function(a,x){ return a + x.p.t; }, 0);
    var don = zs.reduce(function(a,x){ return a + x.p.d; }, 0);
    var media = tot ? Math.round(don/tot*100) : 0;

    var zd = zonaDiaria();
    var dias = [];
    for(var k=0;k<7;k++){
      var dd = mas(w, k);
      if(dd > tope) break;
      if(S.rotacionDesde && dd < S.rotacionDesde) continue;
      dias.push({
        d: dd,
        p: progresoDia(dd),
        quien: zd ? (turnoDe(zd, dd)[0] || "") : "",
        zs: S.zonas.map(function(z){ return {z:z, p:progreso(z.id, dd)}; })
      });
    }

    var ab = abierto["w"+w];
    return '<div class="wk'+(tot && !don ? " vacia" : "")+'">' +
      '<div class="wk-top" data-a="abre-sem" data-w="'+w+'">' +
        '<span class="wk-when">'+(idx===0 ? "ESTA SEM." : rango(w).toUpperCase())+'</span>' +
        '<div class="wk-sum">' + zs.map(function(x){
          return '<span class="seg" style="--zc:'+at(x.z.color)+'"><i style="width:'+x.p.p+'%"></i></span>';
        }).join('') + '</div>' +
        '<span class="wk-pct">'+media+'%</span>' +
      '</div>' +
      (ab ? '<div class="wk-body">' +
        zs.map(function(x){
          return '<div class="wk-zone"><div class="nm">' +
            '<span class="zone-dot" style="background:'+at(x.z.color)+'"></span>' +
            esc(x.z.nombre) + '<span class="who">'+esc(x.eq.join(", ") || "sin asignar")+'</span></div>' +
            '<div class="bar" style="--zc:'+at(x.z.color)+';margin:0"><i style="width:'+x.p.p+'%"></i></div>' +
            '<span class="wk-pct" style="font-size:12px">'+x.p.p+'%</span></div>';
        }).join('') +
        (dias.length ? '<div class="wk-sep"></div>' + dias.map(function(x){
          var nada = x.p.t && !x.p.d;
          return '<div class="dy'+(nada ? " nada" : "")+'">' +
            '<span class="d">'+DOW_C[dow(x.d)]+' '+Number(x.d.slice(8,10))+'</span>' +
            '<span class="qn">'+esc(x.quien)+'</span>' +
            '<span class="segs">' + x.zs.map(function(y){
              return '<span class="seg" style="--zc:'+at(y.z.color)+'"><i style="width:'+y.p.p+'%"></i></span>';
            }).join('') + '</span>' +
            '<span class="n">'+(x.p.t ? (nada ? "nada" : x.p.d+"/"+x.p.t) : "libre")+'</span>' +
          '</div>';
        }).join('') : '') +
      '</div>' : '') +
    '</div>';
  }).join('');

  return '<div class="eyebrow">Resumen</div>' + resumen +
    '<div class="eyebrow">Por semanas</div>' + semanas;
}

/* ================= acciones ================= */
function toast(m, mal){
  var el = document.getElementById("toast");
  el.textContent = m; el.className = mal ? "bad" : ""; el.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.hidden = true; }, mal ? 4500 : 2200);
}
function completa(tareaId, url){
  var t = S.tareas.filter(function(x){ return x.id === tareaId; })[0];
  if(!t) return;
  run(api("casa_completadas?on_conflict=tarea_id,periodo", {
    method:"POST", prefer:"resolution=merge-duplicates,return=minimal",
    body:[{tarea_id:t.id, periodo:periodoDe(t, hoy()), por:yo, at:new Date().toISOString(), foto_url:url || null}]
  }), "Hecho");
}
function cantidad(id, q){
  if(q===null || isNaN(q) || q<0) q = 0;
  run(api("casa_items?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal",
    body:{quantity:q, updated_by:yo, updated_at:new Date().toISOString()}}));
}
function cfg(patch){
  patch.updated_at = new Date().toISOString();
  return api("casa_config?id=eq.1", {method:"PATCH", prefer:"return=minimal", body:patch});
}
function sincroCompra(){
  var a = document.getElementById("c-imp"), b = document.getElementById("c-con");
  if(a) compra.importe = a.value;
  if(b) compra.concepto = b.value;
}
function guardaCompra(){
  sincroCompra();
  var imp = num(compra.importe);
  if(imp === null || imp < 0){ toast("Pon el importe.", true); return; }
  if(!compra.ticket){ toast("Falta la foto del ticket.", true); return; }
  var repuestos = Object.keys(compra.items).filter(function(k){ return compra.items[k]; });
  guardando = "guardando"; pinta();
  uploadPhoto(compra.ticket, "tickets").then(function(url){
    var jobs = [api("casa_purchases", {method:"POST", prefer:"return=minimal",
      body:[{by_name:yo, amount:imp, note:compra.concepto || "Compra de limpieza", ticket_url:url}]})];
    repuestos.forEach(function(id){
      var it = S.items.filter(function(x){ return x.id === id; })[0];
      jobs.push(api("casa_items?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal",
        body:{quantity:(it ? it.min : 0) + 2, updated_by:yo, updated_at:new Date().toISOString()}}));
    });
    compraAbierta = false;
    compra = {importe:"", concepto:"", ticket:null, items:{}};
    return run(Promise.all(jobs), "Compra registrada");
  }).catch(function(e){
    guardando = "error"; pinta();
    toast("No se pudo guardar la compra.", true);
    if(window.console) console.error(e);
  });
}

/* ================= cámara ================= */
function abreCamara(titulo, max, cb){
  camCb = cb; camShot = null; camMax = max;
  var cam = document.getElementById("cam");
  cam.hidden = false;
  cam.innerHTML = '<div class="cam-back"><div class="cam-box">' +
    '<div class="cam-head"><span>'+esc(titulo)+'</span><button data-c="cerrar" aria-label="Cerrar">✕</button></div>' +
    '<div class="cam-stage"><video id="cv" playsinline muted></video><img id="cp" hidden alt="">' +
    '<div class="cam-status" id="cs">Abriendo cámara…</div></div>' +
    '<div class="cam-actions" id="ca"><button class="btn btn-pri" data-c="disparo" disabled>'+CAM_SVG+' Hacer foto</button></div>' +
    '</div></div>';
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ fallback(); return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}, audio:false})
    .then(function(st){
      camStream = st;
      var v = document.getElementById("cv");
      if(!v){ paraCam(); return; }
      v.srcObject = st; v.play();
      var s = document.getElementById("cs"); if(s) s.textContent = "";
      var b = document.querySelector("[data-c='disparo']"); if(b) b.disabled = false;
    }).catch(fallback);
}
function fallback(){
  var box = document.querySelector(".cam-box");
  if(!box) return;
  var st = box.querySelector(".cam-stage"); if(st) st.remove();
  var ac = box.querySelector(".cam-actions"); if(ac) ac.remove();
  var d = document.createElement("div");
  d.className = "cam-fallback";
  d.innerHTML = '<p>Este navegador no deja abrir la cámara dentro de la app. Pulsa el botón: en el móvil se abrirá la cámara.</p>' +
    '<label class="btn btn-pri btn-file">'+CAM_SVG+' Abrir cámara<input type="file" accept="image/*" capture="environment" data-c="archivo"></label>';
  box.appendChild(d);
}
function paraCam(){ if(camStream){ camStream.getTracks().forEach(function(t){ t.stop(); }); camStream = null; } }
function cierraCam(){
  paraCam(); camCb = null; camShot = null;
  var c = document.getElementById("cam"); c.innerHTML = ""; c.hidden = true;
}
function dispara(){
  var v = document.getElementById("cv");
  if(!v || !v.videoWidth) return;
  var w = v.videoWidth, h = v.videoHeight, m = camMax;
  if(w > h && w > m){ h = Math.round(h*m/w); w = m; }
  else if(h >= w && h > m){ w = Math.round(w*m/h); h = m; }
  var c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(v, 0, 0, w, h);
  camShot = c.toDataURL("image/jpeg", 0.7);
  var p = document.getElementById("cp");
  p.src = camShot; p.hidden = false; v.hidden = true;
  paraCam();
  document.getElementById("ca").innerHTML =
    '<button class="btn" data-c="repite">Repetir</button>' +
    '<button class="btn btn-pri" data-c="usa">Usar esta foto</button>';
}
function encoge(src, max){
  return new Promise(function(res, rej){
    var img = new Image();
    img.onerror = function(){ rej(new Error("decode")); };
    img.onload = function(){
      var w = img.width, h = img.height;
      if(w > h && w > max){ h = Math.round(h*max/w); w = max; }
      else if(h >= w && h > max){ w = Math.round(w*max/h); h = max; }
      var c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      res(c.toDataURL("image/jpeg", 0.7));
    };
    img.src = src;
  });
}
function leeArchivo(file){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onerror = function(){ rej(new Error("read")); };
    r.onload = function(e){ res(e.target.result); };
    r.readAsDataURL(file);
  });
}

/* La barra inferior vive fuera de #app, así que el mismo manejador se engancha
   a los dos contenedores. */
function onClick(e){
  var el = e.target.closest("[data-a]");
  if(!el || !S) return;
  var a = el.getAttribute("data-a"), id = el.getAttribute("data-id"), i;

  if(a === "yo"){
    yo = el.getAttribute("data-n");
    try{ localStorage.setItem(KEY, yo); }catch(x){}
    pinta();
  }
  else if(a === "cambiar-yo"){
    if(!window.confirm("¿Cambiar de usuario en este móvil?")) return;
    try{ localStorage.removeItem(KEY); }catch(x){}
    yo = null; pinta();
  }
  else if(a === "tema"){
    var r = document.documentElement;
    var osc = r.getAttribute("data-theme") === "dark" ||
      (!r.getAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches);
    r.setAttribute("data-theme", osc ? "light" : "dark");
  }
  else if(a === "ir"){ vista = el.getAttribute("data-v"); pinta(); window.scrollTo(0,0); }
  else if(a === "abre-zona"){ var z = el.getAttribute("data-z"); abierto["z"+z] = !abierto["z"+z]; pinta(); }
  else if(a === "abre-blk"){
    var b = el.getAttribute("data-b");
    abierto["b"+b] = abierto["b"+b] === false;    /* por defecto están abiertos */
    pinta();
  }
  else if(a === "abre-sem"){ var w = el.getAttribute("data-w"); abierto["w"+w] = !abierto["w"+w]; pinta(); }
  else if(a === "abre-acc"){ var k = el.getAttribute("data-k"); abierto["a"+k] = !abierto["a"+k]; pinta(); }
  else if(a === "foto"){ lightbox = el.getAttribute("data-src"); pinta(); }
  else if(a === "cerrar-foto"){ lightbox = null; pinta(); }
  else if(a === "foto-tarea"){
    var tid = el.getAttribute("data-t");
    abreCamara("Foto de la tarea", 1024, function(img){
      guardando = "guardando"; pinta();
      uploadPhoto(img, "tareas").then(function(u){ completa(tid, u); })
        .catch(function(err){ guardando = "error"; pinta(); toast("No se pudo subir la foto.", true); if(window.console) console.error(err); });
    });
  }
  else if(a === "marcar") completa(el.getAttribute("data-t"), null);
  else if(a === "cant"){
    var it = S.items.filter(function(x){ return x.id === id; })[0];
    if(it) cantidad(id, Math.max(0, Number(it.cant||0) + parseInt(el.getAttribute("data-d"),10)));
  }
  else if(a === "compra-abre"){ compraAbierta = true; pinta(); }
  else if(a === "c-cancela"){ compraAbierta = false; compra = {importe:"",concepto:"",ticket:null,items:{}}; pinta(); }
  else if(a === "c-ticket"){ sincroCompra(); abreCamara("Foto del ticket", 1400, function(img){ compra.ticket = img; pinta(); }); }
  else if(a === "c-guardar") guardaCompra();

  /* --- admin --- */
  else if(a === "g-add"){
    var n = document.getElementById("g-nuevo").value.trim();
    if(!n || S.gente.indexOf(n) > -1) return;
    run(cfg({people: S.gente.concat([n])}), "Añadido");
  }
  else if(a === "g-quita"){
    i = parseInt(el.getAttribute("data-i"),10);
    if(!window.confirm("¿Quitar a " + S.gente[i] + " de la casa?")) return;
    var g = S.gente.slice(); g.splice(i,1);
    run(cfg({people:g}));
  }
  else if(a === "g-sube" || a === "g-baja"){
    i = parseInt(el.getAttribute("data-i"),10);
    var j = i + (a === "g-sube" ? -1 : 1);
    if(j < 0 || j >= S.gente.length) return;
    var gg = S.gente.slice(); var tmp = gg[i]; gg[i] = gg[j]; gg[j] = tmp;
    run(cfg({people:gg}));
  }
  else if(a === "dl"){
    var dd = parseInt(el.getAttribute("data-d"), 10);
    var ds = diasLimpieza().slice(), pos = ds.indexOf(dd);
    if(pos > -1) ds.splice(pos, 1); else ds.push(dd);
    ds.sort(function(x, y){ return x - y; });
    run(cfg({dias_limpieza: ds}), ds.length ? "Días de limpieza actualizados" : "Ya no hay días de limpieza");
  }
  else if(a === "z-add"){
    var zn = document.getElementById("z-nueva").value.trim();
    if(!zn) return;
    var slug = zn.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,24) || ("z"+Date.now());
    run(api("casa_zonas", {method:"POST", prefer:"return=minimal",
      body:[{id:slug, nombre:zn, plazas:1, color:PAL[S.zonas.length % PAL.length], orden:S.zonas.length+1}]}), "Zona añadida");
  }
  else if(a === "z-quita"){
    if(!window.confirm("¿Eliminar la zona y todas sus tareas?")) return;
    run(api("casa_zonas?id=eq."+encodeURIComponent(id), {method:"DELETE", prefer:"return=minimal"}));
  }
  else if(a === "t-add"){
    var zid = el.getAttribute("data-z");
    var inp = document.querySelector("[data-f='t-nueva'][data-z='"+zid+"']");
    var lb = inp.value.trim();
    if(!lb) return;
    inp.value = "";
    run(api("casa_tareas", {method:"POST", prefer:"return=minimal",
      body:[{zona_id:zid, label:lb, foto:true, orden:tareasDe(zid).length+1}]}), "Tarea añadida");
  }
  else if(a === "t-quita"){
    if(!window.confirm("¿Eliminar esta tarea?")) return;
    run(api("casa_tareas?id=eq."+encodeURIComponent(id), {method:"DELETE", prefer:"return=minimal"}));
  }
  else if(a === "i-add"){
    var zona = el.getAttribute("data-z");
    var ii = document.querySelector("[data-f='i-nuevo'][data-z='"+zona+"']");
    var nn = ii.value.trim();
    if(!nn) return;
    ii.value = "";
    run(api("casa_items", {method:"POST", prefer:"return=minimal",
      body:[{name:nn, zone:zona, sort_order:S.items.length+1}]}), "Artículo añadido");
  }
  else if(a === "i-quita"){
    if(!window.confirm("¿Eliminar este artículo?")) return;
    run(api("casa_items?id=eq."+encodeURIComponent(id), {method:"DELETE", prefer:"return=minimal"}));
  }
  else if(a === "ap-add"){
    var q = document.getElementById("ap-quien").value;
    var c = num(document.getElementById("ap-cuanto").value);
    if(c === null || c <= 0){ toast("Pon la cantidad.", true); return; }
    run(api("casa_contributions", {method:"POST", prefer:"return=minimal",
      body:[{by_name:q, amount:c}]}), "Aportación registrada");
  }
  else if(a === "m-add"){
    var m = document.getElementById("m-nuevo").value.trim();
    if(!m || m.indexOf("@") < 0){ toast("Correo no válido.", true); return; }
    if(S.correos.indexOf(m) > -1) return;
    run(cfg({aviso_emails: S.correos.concat([m])}), "Añadido");
  }
  else if(a === "m-quita"){
    i = parseInt(el.getAttribute("data-i"),10);
    var cs = S.correos.slice(); cs.splice(i,1);
    run(cfg({aviso_emails:cs}));
  }
}
document.getElementById("app").addEventListener("click", onClick);
document.getElementById("nav").addEventListener("click", onClick);

document.getElementById("app").addEventListener("change", function(e){
  var el = e.target, fl = el.getAttribute("data-f"), a = el.getAttribute("data-a");
  var id = el.getAttribute("data-id");
  if(!S) return;

  if(a === "c-item"){ compra.items[id] = el.checked; return; }
  if(a === "t-foto"){
    run(api("casa_tareas?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal", body:{foto: el.checked}}));
    return;
  }
  if(!fl) return;

  if(fl === "z-turno"){
    /* Re-ancla el turno en su próximo relevo: a partir de ahí sigue corriendo
       por la lista a su ritmo. */
    var zt = S.zonas.filter(function(x){ return x.id === id; })[0];
    if(!zt) return;
    run(api("casa_zonas?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal",
      body:{rota_persona: el.value, rota_desde: proximoRelevo(zt)}}), "Turno actualizado");
    return;
  }
  if(fl === "z-cada"){
    /* Al cambiar el ritmo se re-ancla en mañana con quien lo tiene hoy, para
       que el cambio no reordene el pasado. */
    var zc = S.zonas.filter(function(x){ return x.id === id; })[0];
    if(!zc) return;
    run(api("casa_zonas?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal",
      body:{rota_cada: Math.max(1, parseInt(el.value, 10) || 7),
            rota_persona: turnoDe(zc, hoy())[0] || zc.rota_persona,
            rota_desde: hoy()}}), "Ritmo del turno actualizado");
    return;
  }
  if(fl === "z-nombre" || fl === "z-desc" || fl === "z-plazas" || fl === "z-color"){
    var campo = {"z-nombre":"nombre","z-desc":"descripcion","z-plazas":"plazas","z-color":"color"}[fl];
    var val = fl === "z-plazas" ? Math.max(0, parseInt(el.value,10) || 0) : el.value;
    var antes = S.zonas.filter(function(z){ return z.id === id; })[0];
    var p = {}; p[campo] = val;
    var cad = api("casa_zonas?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal", body:p});
    /* Si cambia el nombre de la zona, el stock debe seguirla. */
    if(fl === "z-nombre" && antes && antes.nombre !== val){
      cad = cad.then(function(){
        return api("casa_items?zone=eq."+encodeURIComponent(antes.nombre), {method:"PATCH", prefer:"return=minimal", body:{zone:val}});
      });
    }
    run(cad);
  }
  else if(fl === "t-label"){
    run(api("casa_tareas?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal", body:{label: el.value}}));
  }
  else if(fl === "t-dias"){
    if(el.value === "=") return;              /* la etiqueta de varios días no cambia nada */
    var cuerpo = el.value === ""      ? {dias: null, semanal: false}
               : el.value === "finde" ? {dias: [6, 0], semanal: true}
               :                        {dias: [parseInt(el.value, 10)], semanal: false};
    run(api("casa_tareas?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal",
      body: cuerpo}));
  }
  else if(fl === "i-nombre"){
    run(api("casa_items?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal", body:{name: el.value}}));
  }
  else if(fl === "i-precio"){
    run(api("casa_items?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal", body:{price: num(el.value)}}));
  }
  else if(fl === "i-min"){
    var mn = num(el.value);
    run(api("casa_items?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal",
      body:{low_threshold: (mn === null || mn < 0) ? 0 : mn}}));
  }
});

document.getElementById("cam").addEventListener("click", function(e){
  var el = e.target.closest("[data-c]");
  if(!el) return;
  var c = el.getAttribute("data-c");
  if(c === "cerrar") cierraCam();
  else if(c === "disparo") dispara();
  else if(c === "repite"){
    var cb = camCb, m = camMax, t = document.querySelector(".cam-head span");
    var titulo = t ? t.textContent : "Hacer foto";
    cierraCam(); abreCamara(titulo, m, cb);
  }
  else if(c === "usa"){
    var img = camShot, cb2 = camCb;
    cierraCam();
    if(img && cb2) cb2(img);
  }
});
document.getElementById("cam").addEventListener("change", function(e){
  var el = e.target;
  if(el.getAttribute("data-c") !== "archivo") return;
  var file = el.files && el.files[0];
  if(!file) return;
  var cb = camCb, m = camMax;
  leeArchivo(file).then(function(src){ return encoge(src, m); }).then(function(img){
    cierraCam(); if(cb) cb(img);
  }).catch(function(){ toast("No se pudo procesar la foto.", true); });
});

cargar().then(function(){
  pinta();
  return fijarSemana();
}).then(pinta).catch(function(e){

    '<div class="boot">No se pudo conectar con el servidor.<br>Comprueba la conexión y recarga la página.</div>';

});

/* El refresco repinta la pantalla entera, así que no puede saltar mientras
   alguien escribe: le borraría lo tecleado a media frase. */
function escribiendo(){
  if(compraAbierta) return true;
  var el = document.activeElement;
  return !!el && (el.tagName === "INPUT" || el.tagName === "SELECT" || el.tagName === "TEXTAREA");
}
setInterval(function(){ if(!document.hidden && S && !escribiendo()) refrescar(); }, 45000);
window.addEventListener("focus", function(){ if(S && !escribiendo()) refrescar(); });

})();
