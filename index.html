<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F7A6C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turno de Hoy">
<meta name="description" content="Turnos de limpieza de la Casa Holanda: a quién le toca hoy, tareas con foto y control del material de limpieza.">
<title>Turno de Hoy — Casa Holanda</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧹</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF2F1;
  --surface:#FFFFFF;
  --surface-2:#E2E9E7;
  --border:#C9D6D2;
  --ink:#1E2A28;
  --muted:#5C6B67;
  --accent:#1F7A6C;
  --accent-strong:#145C51;
  --accent-soft:#D7ECE7;
  --good:#2F9E5B;
  --good-soft:#DFF3E5;
  --warn:#C77A17;
  --warn-soft:#F7E6CC;
  --bad:#C0392B;
  --bad-soft:#F6DCD7;
  --admin:#8A5A00;
  --admin-soft:#F3E4C2;
  --shadow:0 1px 2px rgba(20,40,36,.07),0 6px 18px rgba(20,40,36,.07);
  --radius:14px;
  --font-display:'Barlow Condensed',sans-serif;
  --font-body:'Karla',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12201D; --surface:#182B27; --surface-2:#1E332E; --border:#2C463F;
    --ink:#EAF3F0; --muted:#9FB6B0;
    --accent:#4FC3AA; --accent-strong:#7BE0C9; --accent-soft:#1E3B35;
    --good:#5FCB88; --good-soft:#1E3B2A;
    --warn:#E4A94C; --warn-soft:#3C2E14;
    --bad:#E2776A; --bad-soft:#3C1F1B;
    --admin:#E0B85A; --admin-soft:#3A2F13;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#12201D; --surface:#182B27; --surface-2:#1E332E; --border:#2C463F;
  --ink:#EAF3F0; --muted:#9FB6B0;
  --accent:#4FC3AA; --accent-strong:#7BE0C9; --accent-soft:#1E3B35;
  --good:#5FCB88; --good-soft:#1E3B2A;
  --warn:#E4A94C; --warn-soft:#3C2E14;
  --bad:#E2776A; --bad-soft:#3C1F1B;
  --admin:#E0B85A; --admin-soft:#3A2F13;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;margin:0}
.mono{font-family:var(--font-mono)}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 72px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- header ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:26px;color:var(--accent-strong)}
.brand .sub{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.who{display:flex;align-items:center;gap:10px}
.status{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.dot.saving{background:var(--warn);animation:pulse 1.2s infinite}
.dot.error{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot.saving{animation:none}}
.me-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 12px 5px 5px;box-shadow:var(--shadow)}
.me-chip button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:12px}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:800;font-size:14px;flex-shrink:0}
.avatar.lg{width:64px;height:64px;font-size:26px}
.badge-admin{font-size:11px;background:var(--admin-soft);color:var(--admin);border-radius:6px;padding:1px 6px;font-family:var(--font-mono);font-weight:600;text-transform:uppercase}

/* ---------- boot / name picker ---------- */
.boot{max-width:900px;margin:0 auto;padding:60px 16px;text-align:center;color:var(--muted);font-family:var(--font-mono);font-size:13px}
.picker{padding:40px 0}
.picker h2{font-size:30px;margin-bottom:6px}
.picker p{color:var(--muted);margin:0 0 24px}
.name-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.name-btn{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s ease}
.name-btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.name-btn span{font-family:var(--font-display);font-weight:700;font-size:17px;text-transform:none}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px;margin-bottom:18px;overflow-x:auto}
.tab{flex:1;min-width:84px;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
.tab.active{background:var(--surface);color:var(--accent-strong);box-shadow:var(--shadow)}
.tab .count{font-family:var(--font-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:1px 5px;margin-left:4px}

/* ---------- alerts ---------- */
.alert{display:flex;align-items:flex-start;gap:10px;border-radius:11px;padding:11px 14px;margin-bottom:10px;font-size:14px;cursor:pointer;border:1px solid transparent}
.alert.buy{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.alert.review{background:var(--accent-soft);color:var(--accent-strong);border-color:var(--accent)}
.alert b{font-weight:700}

/* ---------- hero ---------- */
.hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:16px}
.hero-top{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.hero-top .date{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.hero-top h2{font-size:32px;line-height:1}
.hero-top .caption{color:var(--muted);font-size:13px;margin-top:2px}
.tasks{display:flex;flex-direction:column;gap:10px}
.task-row{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surface-2);border-radius:10px;padding:12px 14px;flex-wrap:wrap}
.task-row.is-done{background:var(--good-soft)}
.task-main{display:flex;align-items:center;gap:10px;min-width:0}
.task-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent}
.is-done .task-check{background:var(--good);border-color:var(--good);color:#fff}
.task-label{font-weight:600}
.task-meta{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.task-action{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;border:1px solid var(--border);cursor:zoom-in}
.pill{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent-strong)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 13px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn-sm{padding:5px 9px;font-size:12px}

/* ---------- weekly ---------- */
.weekly{background:var(--surface);border:1px dashed var(--accent);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.weekly h3{font-size:15px;color:var(--accent-strong);margin-bottom:4px}
.weekly .who-line{font-size:13px;color:var(--muted);margin-bottom:12px}

/* ---------- week strip ---------- */
.section-title{font-size:13px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}
.week-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.week-card{flex:0 0 auto;width:112px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 10px;text-align:center;box-shadow:var(--shadow)}
.week-card.today{border-color:var(--accent);border-width:2px;background:var(--accent-soft)}
.week-card .d{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.week-card .name{font-family:var(--font-display);font-weight:700;font-size:16px}

/* ---------- history ---------- */
.history-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow)}
.history-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;cursor:pointer}
.history-head .left{display:flex;align-items:center;gap:10px}
.history-head .date{font-family:var(--font-mono);font-size:12px;color:var(--muted);min-width:64px}
.history-photos{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px}
.history-photos img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:zoom-in}
.history-photos .cap{font-size:11px;color:var(--muted);text-align:center;margin-top:3px;width:84px;line-height:1.25}
.empty{color:var(--muted);font-size:13px;padding:14px 2px}

/* ---------- stock ---------- */
.money-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.money-tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.money-tile .k{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.money-tile .v{font-family:var(--font-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;margin-top:2px}
.money-tile .v.neg{color:var(--bad)}
.zone{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.zone-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--surface-2)}
.zone-head h3{font-size:15px}
.item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border);flex-wrap:wrap}
.item .nm{flex:1;min-width:130px;font-weight:600}
.item .pr{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.qty-group{display:flex;align-items:center;gap:5px}
.qty-input{width:46px;text-align:center;border:1px solid var(--border);border-radius:6px;padding:5px 2px;background:var(--bg);color:var(--ink)}
.buy-list{background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.buy-list h3{font-size:15px;color:var(--warn);margin-bottom:8px}
.buy-list ul{margin:0;padding-left:18px}
.buy-list li{margin-bottom:3px}
.purchase{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.purchase .amt{font-family:var(--font-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.purchase .info{flex:1;min-width:0}
.purchase .info .n{font-weight:600}
.purchase .info .m{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.form-card{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:16px;margin-bottom:14px}
.form-card h3{font-size:15px;color:var(--accent-strong);margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.field input,.field select{border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink);width:100%}
.chk-list{display:flex;flex-wrap:wrap;gap:6px}
.chk-list label{display:flex;align-items:center;gap:5px;background:var(--surface-2);border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.ticket-thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}

/* ---------- admin ---------- */
.admin-panel{background:var(--admin-soft);border:1px solid var(--admin);border-radius:var(--radius);padding:18px}
.admin-panel h3{font-size:15px;color:var(--admin);margin-bottom:10px}
.admin-block{margin-bottom:22px}
.admin-block:last-child{margin-bottom:0}
.admin-row{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 10px;margin-bottom:6px;flex-wrap:wrap}
.admin-row input[type=text],.admin-row input[type=number],.admin-row select{border:1px solid var(--border);border-radius:6px;padding:5px 8px;background:var(--bg);color:var(--ink);min-width:0}
.admin-row input.grow{flex:1;min-width:120px}
/* Fila de artículo: el nombre en su propia línea siempre — con zona, precio,
   mínimo y borrar compitiendo por sitio, un input flex:1 puede encogerse
   hasta casi desaparecer en pantallas estrechas (bug clásico de flexbox). */
.admin-row.item-row{flex-direction:column;align-items:stretch}
.admin-row.item-row input.grow{width:100%;min-width:0}
.item-row-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.admin-row label.chk{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:6px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.icon-btn:hover{border-color:var(--accent)}
.new-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.new-row input,.new-row select{border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:var(--surface);color:var(--ink);flex:1;min-width:120px}

/* ---------- camera ---------- */
.cam-backdrop{position:fixed;inset:0;background:rgba(8,18,16,.86);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.cam-box{background:var(--surface);border-radius:var(--radius);width:100%;max-width:560px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.cam-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.cam-head span{font-family:var(--font-display);font-weight:700;font-size:16px;text-transform:uppercase}
.cam-head button{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.cam-stage{position:relative;background:#0B1614;min-height:220px;display:flex;align-items:center;justify-content:center}
.cam-stage video,.cam-stage img{width:100%;max-height:58vh;object-fit:contain;background:#0B1614}
.cam-status{position:absolute;color:#DCEBE7;font-family:var(--font-mono);font-size:12px;text-align:center;padding:0 20px}
.cam-actions{display:flex;gap:8px;justify-content:center;padding:14px}
.cam-fallback{padding:18px;text-align:center}
.cam-fallback p{color:var(--muted);font-size:13px;margin:0 0 12px}
.btn-file{position:relative;overflow:hidden}
.btn-file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.lightbox{position:fixed;inset:0;background:rgba(8,18,16,.92);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:90vh;object-fit:contain;border-radius:10px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:14px;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#toast.bad{background:var(--bad);color:#fff}

@media(max-width:520px){
  .brand h1{font-size:22px}
  .hero-top h2{font-size:26px}
  .task-row{flex-direction:column;align-items:stretch}
  .task-action{justify-content:flex-end}
}
</style>
</head>
<body>
<div id="app"><div class="boot">Cargando…</div></div>
<div id="cam" hidden></div>
<div id="toast" hidden></div>
<script>
(function(){
"use strict";

/* ================= backend ================= */
var SUPA_URL = "https://lmuiogddgfmmbouaanzo.supabase.co";
var SUPA_KEY = "sb_publishable_NqIyAof4Y4fYyzf53qjlnA_-xDvYwsc";
var BUCKET = "casa-fotos";

function api(path, opts){
  opts = opts || {};
  var headers = {
    "apikey": SUPA_KEY,
    "Authorization": "Bearer " + SUPA_KEY,
    "Content-Type": "application/json"
  };
  if(opts.prefer) headers["Prefer"] = opts.prefer;
  return fetch(SUPA_URL + "/rest/v1/" + path, {
    method: opts.method || "GET",
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    if(!r.ok){
      return r.text().then(function(t){ throw new Error("HTTP " + r.status + " " + t); });
    }
    if(r.status === 204) return null;
    return r.text().then(function(t){ return t ? JSON.parse(t) : null; });
  });
}

function uploadPhoto(dataUrl, prefix){
  var blob = dataURLtoBlob(dataUrl);
  var path = prefix + "/" + Date.now() + "-" + Math.random().toString(36).slice(2,8) + ".jpg";
  return fetch(SUPA_URL + "/storage/v1/object/" + BUCKET + "/" + path, {
    method: "POST",
    headers: {
      "apikey": SUPA_KEY,
      "Authorization": "Bearer " + SUPA_KEY,
      "Content-Type": "image/jpeg"
    },
    body: blob
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error("Subida " + r.status + " " + t); });
    return SUPA_URL + "/storage/v1/object/public/" + BUCKET + "/" + path;
  });
}

function dataURLtoBlob(dataUrl){
  var parts = dataUrl.split(",");
  var mime = (parts[0].match(/:(.*?);/) || [])[1] || "image/jpeg";
  var bin = atob(parts[1]);
  var arr = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mime});
}

/* ================= constants ================= */
var PALETTE = ["#D6604D","#DDA63A","#4F8A3D","#2E8B84","#4472C4","#8E5FA8","#B15C8E"];
var DOW = ["DOM","LUN","MAR","MIÉ","JUE","VIE","SÁB"];
var DOW_LONG = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var MONTHS = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
var STORAGE_KEY = "turnoDeHoy_myName";

/* ================= state ================= */
var STATE = null;
var myName = null;
try { myName = localStorage.getItem(STORAGE_KEY); } catch(e){}
var tab = "hoy";
var expandedDays = {};
var lightbox = null;
var purchaseFormOpen = false;
var purchaseDraft = {amount:"", note:"", ticket:null, items:{}};
var saveStatus = "ok"; /* ok | saving | error */
var camStream = null, camOnCapture = null, camShot = null, camMaxDim = 1024;

/* ================= date helpers ================= */
function localDateStr(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function addDays(dateStr,n){
  var d = new Date(dateStr+"T00:00:00");
  d.setDate(d.getDate()+n);
  return localDateStr(d);
}
function daysBetween(a,b){
  return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000);
}
function todayStr(){ return localDateStr(new Date()); }
function dowOf(dateStr){ return new Date(dateStr+"T00:00:00").getDay(); }
function fmtDateLong(dateStr){
  var d = new Date(dateStr+"T00:00:00");
  return DOW[d.getDay()]+" "+String(d.getDate()).padStart(2,"0")+" "+MONTHS[d.getMonth()];
}
function fmtDateShort(dateStr){
  var d = new Date(dateStr+"T00:00:00");
  return DOW[d.getDay()]+" "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
}
function fmtTime(iso){
  if(!iso) return "";
  var d = new Date(iso);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function fmtEur(n){
  if(n===null || n===undefined || isNaN(n)) return "—";
  return Number(n).toFixed(2).replace(".",",")+" €";
}
function parseNum(v){
  var n = parseFloat(String(v).replace(",","."));
  return isNaN(n) ? null : n;
}
function fmtQty(n){
  n = Math.round(Number(n||0)*100)/100;
  return String(n).replace(".",",");
}

/* ================= load ================= */
function loadAll(){
  return Promise.all([
    api("casa_config?id=eq.1&select=*"),
    api("casa_days?select=*&order=date.desc&limit=60"),
    api("casa_items?select=*&order=sort_order.asc,name.asc"),
    api("casa_purchases?select=*&order=at.desc&limit=40"),
    api("casa_contributions?select=*&order=at.desc&limit=60"),
    api("casa_summary?select=*")
  ]).then(function(res){
    var cfg = (res[0] && res[0][0]) || {};
    var days = {};
    (res[1]||[]).forEach(function(row){
      days[row.date] = {person: row.person, tasks: row.tasks || []};
    });
    STATE = {
      people: cfg.people || [],
      admins: cfg.admins || [],
      reviewer: cfg.reviewer || null,
      startDate: cfg.start_date,
      binsStartDate: cfg.bins_start_date || null,
      binsStartPerson: cfg.bins_start_person || null,
      taskTemplate: cfg.task_template || [],
      weeklyTasks: cfg.weekly_tasks || [],
      zones: cfg.zones || [],
      days: days,
      items: (res[2]||[]).map(function(i){
        return {id:i.id, name:i.name, zone:i.zone, price: i.price===null?null:Number(i.price),
                quantity: Number(i.quantity), threshold: Number(i.low_threshold), status:i.status, sort:i.sort_order};
      }),
      purchases: (res[3]||[]).map(function(p){
        return {id:p.id, at:p.at, by:p.by_name, amount:Number(p.amount), note:p.note, ticket:p.ticket_url};
      }),
      contributions: (res[4]||[]).map(function(c){
        return {id:c.id, at:c.at, by:c.by_name, amount:Number(c.amount)};
      }),
      /* Totales calculados en el servidor sobre TODAS las filas. Sumarlos
         aquí sobre las listas cargadas daría un saldo falso en cuanto haya
         más compras de las que se traen. */
      summary: (res[5] && res[5][0]) || null
    };
  });
}

function refresh(){
  return loadAll().then(render).catch(function(){ /* silencioso: se reintenta al siguiente ciclo */ });
}

/* ================= mutations ================= */
function run(promise, okMsg){
  saveStatus = "saving";
  render();
  return promise
    .then(function(){ return loadAll(); })
    .then(function(){
      saveStatus = "ok";
      render();
      if(okMsg) toast(okMsg);
    })
    .catch(function(err){
      saveStatus = "error";
      render();
      toast("No se pudo guardar. Revisa la conexión e inténtalo otra vez.", true);
      if(window.console) console.error(err);
    });
}

function saveDay(dateKey, person, tasks){
  return api("casa_days?on_conflict=date", {
    method: "POST",
    prefer: "resolution=merge-duplicates,return=minimal",
    body: [{date: dateKey, person: person, tasks: tasks, updated_at: new Date().toISOString()}]
  });
}
function patchConfig(patch){
  patch.updated_at = new Date().toISOString();
  return api("casa_config?id=eq.1", {method:"PATCH", prefer:"return=minimal", body: patch});
}

/* ================= rotation & people ================= */
function personForDate(state, dateStr){
  var n = state.people.length;
  if(!n) return null;
  return state.people[((daysBetween(state.startDate, dateStr) % n) + n) % n];
}
function colorFor(state, name){
  var idx = state.people.indexOf(name);
  return PALETTE[(idx<0?0:idx) % PALETTE.length];
}
function initialsFor(name){ return (name||"?").slice(0,1).toUpperCase(); }
function isAdmin(state, name){ return !!name && state.admins.indexOf(name) !== -1; }
function isReviewer(state, name){ return !!name && state.reviewer === name; }

/* ---- cubos verdes: una persona por semana, correlativa ----
   La "semana de cubos" va del domingo (sacarlos) al lunes (entrarlos), así
   que el lunes sigue siendo responsabilidad de quien los sacó el día antes. */
function binsAnchorSunday(dateStr){
  return dowOf(dateStr) === 1 ? addDays(dateStr, -1) : dateStr;
}
function nextBinsSunday(){
  var t = todayStr(), dow = dowOf(t);
  return dow === 0 ? t : addDays(t, 7 - dow);
}
function binsPersonForDate(state, dateStr){
  var n = state.people.length;
  if(!n || !state.binsStartDate || !state.binsStartPerson) return null;
  var sunday = binsAnchorSunday(dateStr);
  if(sunday < state.binsStartDate) return null; /* antes de empezar la rotación */
  var weeks = Math.floor(daysBetween(state.binsStartDate, sunday) / 7);
  var start = state.people.indexOf(state.binsStartPerson);
  if(start < 0) start = 0;
  return state.people[(((start + weeks) % n) + n) % n];
}

/* ================= day tasks ================= */
function templateTasksFor(state, dateKey){
  var out = state.taskTemplate.map(function(t){
    return {id:t.id, label:t.label, photo:!!t.photo, kind:"daily", assignee:null};
  });
  var dow = dowOf(dateKey);
  (state.weeklyTasks||[]).forEach(function(w){
    if(w.dow === dow){
      out.push({id:w.id, label:w.label, photo:!!w.photo, kind:"weekly", assignee: binsPersonForDate(state, dateKey)});
    }
  });
  return out;
}
function blankTask(t){
  return {id:t.id, label:t.label, photo:t.photo, kind:t.kind, assignee:t.assignee,
          done:false, by:null, at:null, img:null, verified:false, verifiedAt:null};
}
function effectiveTasks(state, dateKey){
  var stored = state.days[dateKey] ? state.days[dateKey].tasks : [];
  /* Los días pasados se muestran tal y como se registraron. Si les
     aplicáramos la plantilla actual, añadir una tarea nueva dejaría
     "incompletos" todos los días anteriores, que ya no se pueden arreglar. */
  if(dateKey < todayStr()) return JSON.parse(JSON.stringify(stored));
  var wanted = templateTasksFor(state, dateKey);
  var out = [];
  wanted.forEach(function(w){
    var found = null;
    for(var i=0;i<stored.length;i++){ if(stored[i].id===w.id){ found = stored[i]; break; } }
    if(found){
      var merged = JSON.parse(JSON.stringify(found));
      merged.label = w.label; merged.photo = w.photo; merged.kind = w.kind; merged.assignee = w.assignee;
      out.push(merged);
    } else {
      out.push(blankTask(w));
    }
  });
  stored.forEach(function(s){
    var stillThere = false;
    for(var i=0;i<out.length;i++){ if(out[i].id===s.id){ stillThere = true; break; } }
    if(!stillThere && s.done) out.push(s);
  });
  return out;
}
function canDoTask(state, task, dayPerson){
  if(!myName) return false;
  if(isAdmin(state, myName)) return true;
  if(task.kind === "weekly") return !task.assignee || task.assignee === myName;
  return myName === dayPerson;
}
function pendingReview(state){
  var out = [];
  Object.keys(state.days).sort().reverse().forEach(function(k){
    effectiveTasks(state, k).forEach(function(t){
      if(t.done && t.img && !t.verified) out.push({date:k, task:t});
    });
  });
  return out;
}
function itemsToBuy(state){
  return state.items.filter(function(i){ return i.status==="low" || i.status==="out"; });
}
function potBalance(state){
  return state.summary ? Number(state.summary.bote) : null;
}
function spentThisMonth(state){
  return state.summary ? Number(state.summary.gastado_mes) : null;
}

/* ================= camera ================= */
function openCamera(title, maxDim, onCapture){
  camOnCapture = onCapture; camShot = null; camMaxDim = maxDim;
  var cam = document.getElementById("cam");
  cam.hidden = false;
  cam.innerHTML =
    "<div class=\"cam-backdrop\"><div class=\"cam-box\">" +
    "<div class=\"cam-head\"><span>" + esc(title) + "</span><button data-cam=\"close\" aria-label=\"Cerrar\">✕</button></div>" +
    "<div class=\"cam-stage\"><video id=\"cam-video\" playsinline muted></video>" +
    "<img id=\"cam-preview\" hidden alt=\"\">" +
    "<div class=\"cam-status\" id=\"cam-status\">Abriendo cámara…</div></div>" +
    "<div class=\"cam-actions\" id=\"cam-actions\"><button class=\"btn btn-primary\" data-cam=\"shoot\" disabled>📷 Hacer foto</button></div>" +
    "</div></div>";
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ camFallback(); return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}, audio:false})
    .then(function(stream){
      camStream = stream;
      var v = document.getElementById("cam-video");
      if(!v){ stopCamStream(); return; }
      v.srcObject = stream; v.play();
      var st = document.getElementById("cam-status"); if(st) st.textContent = "";
      var btn = document.querySelector("[data-cam='shoot']"); if(btn) btn.disabled = false;
    })
    .catch(function(){ camFallback(); });
}
function camFallback(){
  var box = document.querySelector(".cam-box");
  if(!box) return;
  var stage = box.querySelector(".cam-stage"); if(stage) stage.remove();
  var actions = box.querySelector(".cam-actions"); if(actions) actions.remove();
  var div = document.createElement("div");
  div.className = "cam-fallback";
  div.innerHTML = "<p>Este navegador no deja abrir la cámara dentro de la app. Pulsa el botón: en el móvil se abrirá la cámara para hacer la foto en el momento.</p>" +
    "<label class=\"btn btn-primary btn-file\">📷 Abrir cámara<input type=\"file\" accept=\"image/*\" capture=\"environment\" data-cam=\"fallback-file\"></label>";
  box.appendChild(div);
}
function stopCamStream(){
  if(camStream){ camStream.getTracks().forEach(function(t){ t.stop(); }); camStream = null; }
}
function closeCamera(){
  stopCamStream(); camOnCapture = null; camShot = null;
  var cam = document.getElementById("cam");
  cam.innerHTML = ""; cam.hidden = true;
}
function camShoot(){
  var v = document.getElementById("cam-video");
  if(!v || !v.videoWidth) return;
  var w = v.videoWidth, h = v.videoHeight, maxDim = camMaxDim;
  if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
  else if(h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
  var canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(v,0,0,w,h);
  camShot = canvas.toDataURL("image/jpeg",0.7);
  var preview = document.getElementById("cam-preview");
  preview.src = camShot; preview.hidden = false;
  v.hidden = true;
  stopCamStream();
  document.getElementById("cam-actions").innerHTML =
    "<button class=\"btn\" data-cam=\"retake\">↺ Repetir</button>" +
    "<button class=\"btn btn-primary\" data-cam=\"use\">Usar esta foto</button>";
}
function shrinkDataURL(src, maxDim){
  return new Promise(function(resolve, reject){
    var img = new Image();
    img.onerror = function(){ reject(new Error("decode_failed")); };
    img.onload = function(){
      var w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
      else if(h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL("image/jpeg",0.7));
    };
    img.src = src;
  });
}
function fileToDataURL(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error("read_failed")); };
    reader.onload = function(e){ resolve(e.target.result); };
    reader.readAsDataURL(file);
  });
}

/* ================= toast ================= */
var toastTimer = null;
function toast(msg, bad){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.className = bad ? "bad" : "";
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.hidden = true; }, bad ? 5000 : 2500);
}

/* ================= escaping ================= */
function esc(s){
  return String(s==null?"":s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; });
}
function escAttr(s){ return esc(s).replace(/"/g, "&quot;"); }

/* ================= render ================= */
function render(){
  var el = document.getElementById("app");
  if(!STATE){ el.innerHTML = "<div class=\"boot\">Cargando…</div>"; return; }
  el.innerHTML = renderApp(STATE);
}

function renderApp(state){
  if(!myName) return renderPicker(state);
  var admin = isAdmin(state, myName);
  var body = "";
  if(tab==="hoy") body = renderToday(state);
  else if(tab==="stock") body = renderStock(state);
  else if(tab==="historial") body = renderHistory(state);
  else if(tab==="admin" && admin) body = renderAdmin(state);
  return renderHeader(state, admin) +
    "<div class=\"wrap\" style=\"padding-top:0\">" +
    renderAlerts(state) + renderTabs(state, admin) + body +
    "</div>" +
    (lightbox ? "<div class=\"lightbox\" data-action=\"close-lightbox\"><img src=\"" + escAttr(lightbox) + "\" alt=\"\"></div>" : "");
}

function renderPicker(state){
  var buttons = state.people.map(function(name){
    return "<button class=\"name-btn\" data-action=\"pick-name\" data-name=\"" + escAttr(name) + "\">" +
      "<span class=\"avatar lg\" style=\"background:" + colorFor(state,name) + "\">" + esc(initialsFor(name)) + "</span>" +
      "<span>" + esc(name) + "</span></button>";
  }).join("");
  return "<div class=\"wrap\"><div class=\"picker\">" +
    "<h2>¿Quién eres?</h2>" +
    "<p>Elige tu nombre para poder marcar tus tareas. Se recordará en este móvil.</p>" +
    "<div class=\"name-grid\">" + buttons + "</div></div></div>";
}

function renderHeader(state, admin){
  var label = {ok:"Guardado", saving:"Guardando…", error:"Sin conexión"}[saveStatus];
  var meHtml = "<div class=\"me-chip\">" +
    "<span class=\"avatar\" style=\"background:" + colorFor(state,myName) + "\">" + esc(initialsFor(myName)) + "</span>" +
    "<span>" + esc(myName) + (admin ? " <span class=\"badge-admin\">Admin</span>" : "") + "</span>" +
    "<button data-action=\"change-user\">cambiar</button></div>";
  return "<div class=\"wrap\" style=\"padding-bottom:0\"><div class=\"topbar\">" +
    "<div class=\"brand\"><h1>Turno de Hoy</h1><span class=\"sub\">Limpieza · Casa Holanda</span></div>" +
    "<div class=\"who\"><div class=\"status\"><span class=\"dot " + (saveStatus==="ok"?"":saveStatus) + "\"></span>" + label + "</div>" +
    meHtml + "</div></div></div>";
}

function renderTabs(state, admin){
  var pend = isReviewer(state, myName) ? pendingReview(state).length : 0;
  var buy = itemsToBuy(state).length;
  var defs = [
    {id:"hoy", label:"Hoy", count: (pend && tab!=="historial") ? pend : 0},
    {id:"stock", label:"Stock", count: buy},
    {id:"historial", label:"Historial", count:0}
  ];
  if(admin) defs.push({id:"admin", label:"Admin", count:0});
  return "<div class=\"tabs\">" + defs.map(function(d){
    return "<button class=\"tab" + (tab===d.id?" active":"") + "\" data-action=\"tab\" data-tab=\"" + d.id + "\">" +
      esc(d.label) + (d.count ? "<span class=\"count\">" + d.count + "</span>" : "") + "</button>";
  }).join("") + "</div>";
}

function renderAlerts(state){
  var out = "";
  var buy = itemsToBuy(state);
  if(buy.length && tab!=="stock"){
    var names = buy.slice(0,3).map(function(i){ return i.name + " (" + i.zone + ")"; }).join(", ");
    out += "<div class=\"alert buy\" data-action=\"tab\" data-tab=\"stock\">🧴 <span><b>Hay que comprar (" + buy.length + "):</b> " +
      esc(names) + (buy.length>3 ? " y " + (buy.length-3) + " más" : "") + "</span></div>";
  }
  if(isReviewer(state, myName)){
    var pend = pendingReview(state);
    if(pend.length){
      out += "<div class=\"alert review\" data-action=\"tab\" data-tab=\"historial\">📷 <span><b>" + pend.length +
        " foto" + (pend.length>1?"s":"") + " pendiente" + (pend.length>1?"s":"") + " de tu revisión.</b> Compruébalas y márcalas como verificadas.</span></div>";
    }
  }
  return out;
}

function renderToday(state){
  var today = todayStr();
  var person = personForDate(state, today);
  var tasks = effectiveTasks(state, today);
  var daily = tasks.filter(function(t){ return t.kind !== "weekly"; });
  var weekly = tasks.filter(function(t){ return t.kind === "weekly"; });
  var canAct = myName && (myName === person || isAdmin(state, myName));
  var reviewer = isReviewer(state, myName);

  var hero = "<div class=\"hero\"><div class=\"hero-top\">" +
    "<span class=\"avatar lg\" style=\"background:" + colorFor(state,person) + "\">" + esc(initialsFor(person)) + "</span>" +
    "<div><div class=\"date mono\">" + fmtDateLong(today) + "</div><h2>" + esc(person) + "</h2>" +
    "<div class=\"caption\">" + (canAct ? "Te toca hoy — barrer, fregar y sacar la basura" : "Le toca hoy") + "</div></div></div>" +
    "<div class=\"tasks\">" + daily.map(function(t){
      return renderTaskRow(state, t, canDoTask(state,t,person), today, reviewer);
    }).join("") + "</div></div>";

  var weeklyHtml = weekly.map(function(t){
    var who = t.assignee ? t.assignee : "sin asignar — cualquiera puede hacerlo";
    return "<div class=\"weekly\"><h3>♻️ Cubos verdes · " + esc(DOW_LONG[dowOf(today)]) + "</h3>" +
      "<div class=\"who-line\">Responsable esta semana: <b>" + esc(who) + "</b></div>" +
      "<div class=\"tasks\">" + renderTaskRow(state, t, canDoTask(state,t,person), today, reviewer) + "</div></div>";
  }).join("");

  return hero + weeklyHtml + renderWeekStrip(state);
}

function renderTaskRow(state, t, canAct, dateKey, reviewer){
  var action = "";
  if(t.done){
    if(t.img) action += "<img class=\"thumb\" src=\"" + escAttr(t.img) + "\" data-action=\"zoom\" data-img=\"" + escAttr(t.img) + "\" alt=\"\" loading=\"lazy\">";
    action += "<span class=\"task-meta\">" + esc(t.by||"") + (t.at ? " · " + fmtTime(t.at) : "") + "</span>";
    if(t.img){
      if(t.verified) action += "<span class=\"pill good\">✓ Verificada</span>";
      else if(reviewer) action += "<button class=\"btn btn-primary btn-sm\" data-action=\"verify\" data-date=\"" + dateKey + "\" data-task=\"" + escAttr(t.id) + "\">✓ Verificar</button>";
      else action += "<span class=\"pill accent\">Pendiente de revisión</span>";
    }
  } else if(canAct){
    action = t.photo
      ? "<button class=\"btn btn-primary\" data-action=\"shoot-task\" data-task=\"" + escAttr(t.id) + "\">📷 Hacer foto</button>"
      : "<button class=\"btn btn-primary\" data-action=\"complete-nophoto\" data-task=\"" + escAttr(t.id) + "\">Marcar hecho</button>";
  } else {
    action = "<span class=\"pill warn\">Pendiente</span>";
  }
  return "<div class=\"task-row" + (t.done ? " is-done" : "") + "\">" +
    "<div class=\"task-main\"><span class=\"task-check\">✓</span><span class=\"task-label\">" + esc(t.label) + (t.photo ? " 📷" : "") + "</span></div>" +
    "<div class=\"task-action\">" + action + "</div></div>";
}

function renderWeekStrip(state){
  var today = todayStr(), cards = [];
  for(var i=0;i<7;i++){
    var d = addDays(today, i), person = personForDate(state, d);
    cards.push("<div class=\"week-card" + (i===0 ? " today" : "") + "\">" +
      "<div class=\"d mono\">" + (i===0 ? "HOY" : fmtDateShort(d)) + "</div>" +
      "<span class=\"avatar\" style=\"background:" + colorFor(state,person) + ";margin:0 auto 8px\">" + esc(initialsFor(person)) + "</span>" +
      "<div class=\"name\">" + esc(person) + "</div></div>");
  }
  return "<div class=\"section-title\">Esta semana</div><div class=\"week-strip\">" + cards.join("") + "</div>";
}

function renderStock(state){
  var buy = itemsToBuy(state), bal = potBalance(state), out = "";
  out += "<div class=\"money-row\">" +
    "<div class=\"money-tile\"><div class=\"k\">Bote común</div><div class=\"v" + (bal<0?" neg":"") + "\">" + fmtEur(bal) + "</div></div>" +
    "<div class=\"money-tile\"><div class=\"k\">Gastado este mes</div><div class=\"v\">" + fmtEur(spentThisMonth(state)) + "</div></div>" +
    "<div class=\"money-tile\"><div class=\"k\">Por comprar</div><div class=\"v\">" + buy.length + "</div></div></div>";

  if(buy.length){
    out += "<div class=\"buy-list\"><h3>🛒 Lista de la compra</h3><ul>" +
      buy.map(function(i){
        return "<li><b>" + esc(i.name) + "</b> — " + esc(i.zone) +
          " <span class=\"pill " + (i.status==="out"?"bad":"warn") + "\">" + (i.status==="out"?"Agotado":"Queda poco") + "</span></li>";
      }).join("") + "</ul></div>";
  }

  state.zones.forEach(function(zone){
    var items = state.items.filter(function(i){ return i.zone===zone; });
    out += "<div class=\"zone\"><div class=\"zone-head\"><h3>" + esc(zone) + "</h3>" +
      "<span class=\"pill\">" + items.length + " artículos</span></div>" +
      (items.length ? items.map(renderItem).join("") : "<div class=\"item\"><span class=\"nm\" style=\"color:var(--muted);font-weight:400\">Sin artículos todavía</span></div>") +
      "</div>";
  });

  out += "<div class=\"section-title\">Compras y tickets</div>";
  out += purchaseFormOpen ? renderPurchaseForm(state) :
    "<button class=\"btn btn-primary\" data-action=\"purchase-open\">＋ Registrar compra</button>";

  if(state.purchases.length){
    out += "<div style=\"margin-top:14px\">" + state.purchases.map(function(p){

/* ================= handlers ================= */
/* Relee el día justo antes de escribirlo: dos personas actuando con pocos
   segundos de diferencia (uno sube la foto, Miguel verifica otra tarea) ya no
   se pisan, porque cada uno guarda sobre la versión recién leída. */
function editDay(dateKey, apply, okMsg){
  return run(
    api("casa_days?date=eq." + dateKey + "&select=*").then(function(rows){
      var fresh = rows && rows[0];
      if(fresh) STATE.days[dateKey] = {person: fresh.person, tasks: fresh.tasks || []};
      var tasks = effectiveTasks(STATE, dateKey);
      if(!apply(tasks)) return null;
      var person = (fresh && fresh.person) || personForDate(STATE, dateKey);
      return saveDay(dateKey, person, tasks);
    }),
    okMsg
  );
}
function completeTask(taskId, img){
  editDay(todayStr(), function(tasks){
    for(var i=0;i<tasks.length;i++){
      if(tasks[i].id===taskId){
        tasks[i].done = true;
        tasks[i].by = myName;
        tasks[i].at = new Date().toISOString();
        if(img) tasks[i].img = img;
        tasks[i].verified = false;
        tasks[i].verifiedAt = null;
        return true;
      }
    }
    return false;
  }, "Tarea guardada");
}
function verifyTask(dateKey, taskId){
  editDay(dateKey, function(tasks){
    var found = false;
    tasks.forEach(function(t){
      if(t.id===taskId){ t.verified = true; t.verifiedAt = new Date().toISOString(); found = true; }
    });
    return found;
  }, "Verificada");
}
function setItemQuantity(id, qty){
  if(qty===null || isNaN(qty) || qty<0) qty = 0;
  run(api("casa_items?id=eq." + encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal",
    body:{quantity: qty, updated_by: myName, updated_at: new Date().toISOString()}}));
}
function shootFor(taskId){
  openCamera("Foto de la tarea", 1024, function(img){
    saveStatus = "saving"; render();
    uploadPhoto(img, "tareas").then(function(url){
      completeTask(taskId, url);
    }).catch(function(err){
      saveStatus = "error"; render();
      toast("No se pudo subir la foto. Inténtalo otra vez.", true);
      if(window.console) console.error(err);
    });
  });
}
function syncPurchaseDraft(){
  var a = document.getElementById("pf-amount"), n = document.getElementById("pf-note");
  if(a) purchaseDraft.amount = a.value;
  if(n) purchaseDraft.note = n.value;
}
function savePurchase(){
  syncPurchaseDraft();
  var amount = parseNum(purchaseDraft.amount);
  if(amount===null || amount<0){ toast("Pon el importe de la compra.", true); return; }
  if(!purchaseDraft.ticket){ toast("Hace falta la foto del ticket.", true); return; }
  var note = purchaseDraft.note || "Compra de limpieza";
  var repuestos = Object.keys(purchaseDraft.items).filter(function(id){ return purchaseDraft.items[id]; });
  saveStatus = "saving"; render();
  uploadPhoto(purchaseDraft.ticket, "tickets").then(function(url){
    var jobs = [api("casa_purchases", {method:"POST", prefer:"return=minimal",
      body:[{by_name: myName, amount: amount, note: note, ticket_url: url}]})];
    repuestos.forEach(function(id){
      /* "status" ya no se marca a mano: se recalcula solo a partir de la
         cantidad. Al reponer, sube la cantidad por encima del mínimo. */
      var item = null;
      for(var i=0;i<STATE.items.length;i++){ if(STATE.items[i].id===id){ item = STATE.items[i]; break; } }
      var newQty = (item ? Number(item.threshold||0) : 0) + 2;
      jobs.push(api("casa_items?id=eq." + encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal",
        body:{quantity: newQty, updated_by: myName, updated_at: new Date().toISOString()}}));
    });
    purchaseFormOpen = false;
    purchaseDraft = {amount:"", note:"", ticket:null, items:{}};
    return run(Promise.all(jobs), "Compra registrada");
  }).catch(function(err){
    saveStatus = "error"; render();
    toast("No se pudo guardar la compra. Inténtalo otra vez.", true);
    if(window.console) console.error(err);
  });
}

/* ================= events ================= */
document.getElementById("app").addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if(!el || !STATE) return;
  var a = el.getAttribute("data-action");
  var i, s;

  if(a==="pick-name"){
    myName = el.getAttribute("data-name");
    try{ localStorage.setItem(STORAGE_KEY, myName); }catch(err){}
    render();
  }
  else if(a==="change-user"){
    if(!window.confirm("¿Cambiar de usuario en este dispositivo?")) return;
    try{ localStorage.removeItem(STORAGE_KEY); }catch(err){}
    myName = null; render();
  }
  else if(a==="tab"){ tab = el.getAttribute("data-tab"); render(); }
  else if(a==="toggle-history"){
    var k = el.getAttribute("data-date");
    expandedDays[k] = !expandedDays[k];
    render();
  }
  else if(a==="zoom"){ lightbox = el.getAttribute("data-img"); render(); }
  else if(a==="close-lightbox"){ lightbox = null; render(); }
  else if(a==="shoot-task") shootFor(el.getAttribute("data-task"));
  else if(a==="complete-nophoto") completeTask(el.getAttribute("data-task"), null);
  else if(a==="verify") verifyTask(el.getAttribute("data-date"), el.getAttribute("data-task"));
  else if(a==="qty-step"){
    i = null;
    for(var qi=0; qi<STATE.items.length; qi++){ if(STATE.items[qi].id===el.getAttribute("data-id")){ i = STATE.items[qi]; break; } }
    if(!i) return;
    var dir = parseInt(el.getAttribute("data-dir"),10);
    setItemQuantity(i.id, Math.max(0, Number(i.quantity||0) + dir));
  }
  else if(a==="purchase-open"){ purchaseFormOpen = true; render(); }
  else if(a==="purchase-cancel"){
    purchaseFormOpen = false;
    purchaseDraft = {amount:"", note:"", ticket:null, items:{}};
    render();
  }
  else if(a==="shoot-ticket"){
    syncPurchaseDraft();
    openCamera("Foto del ticket", 1400, function(img){ purchaseDraft.ticket = img; render(); });
  }
  else if(a==="purchase-save") savePurchase();
  else if(a==="task-add"){
    var label = document.getElementById("new-task-label").value.trim();
    if(!label) return;
    s = STATE.taskTemplate.slice();
    s.push({id:"t"+Date.now().toString(36), label:label, photo:true});
    run(patchConfig({task_template: s}), "Tarea añadida");
  }
  else if(a==="task-remove"){
    if(!window.confirm("¿Eliminar esta tarea diaria?")) return;
    s = STATE.taskTemplate.slice();
    s.splice(parseInt(el.getAttribute("data-index"),10),1);
    run(patchConfig({task_template: s}));
  }
  else if(a==="weekly-remove"){
    if(!window.confirm("¿Eliminar esta tarea semanal?")) return;
    s = STATE.weeklyTasks.slice();
    s.splice(parseInt(el.getAttribute("data-index"),10),1);
    run(patchConfig({weekly_tasks: s}));
  }
  else if(a==="person-up" || a==="person-down"){
    i = parseInt(el.getAttribute("data-index"),10);
    var j = i + (a==="person-up" ? -1 : 1);
    if(j<0 || j>=STATE.people.length) return;
    s = STATE.people.slice();
    var tmp = s[i]; s[i] = s[j]; s[j] = tmp;
    run(patchConfig({people: s}));
  }
  else if(a==="person-remove"){
    i = parseInt(el.getAttribute("data-index"),10);
    if(STATE.people.length<=1) return;
    if(!window.confirm("¿Quitar a " + STATE.people[i] + " de la rotación?")) return;
    s = STATE.people.slice(); s.splice(i,1);
    run(patchConfig({people: s}));
  }
  else if(a==="person-add"){
    var nm = document.getElementById("new-person-name").value.trim();
    if(!nm || STATE.people.indexOf(nm)!==-1) return;
    run(patchConfig({people: STATE.people.concat([nm])}), "Añadido");
  }
  else if(a==="item-add"){
    var iname = document.getElementById("new-item-name").value.trim();
    var izone = document.getElementById("new-item-zone").value;
    if(!iname) return;
    run(api("casa_items", {method:"POST", prefer:"return=minimal",
      body:[{name:iname, zone:izone, sort_order: STATE.items.length+1}]}), "Artículo añadido");
  }
  else if(a==="item-remove"){
    if(!window.confirm("¿Eliminar este artículo?")) return;
    run(api("casa_items?id=eq." + encodeURIComponent(el.getAttribute("data-id")), {method:"DELETE", prefer:"return=minimal"}));
  }
  else if(a==="zone-add"){
    var zn = document.getElementById("new-zone-name").value.trim();
    if(!zn || STATE.zones.indexOf(zn)!==-1) return;
    run(patchConfig({zones: STATE.zones.concat([zn])}), "Zona añadida");
  }
  else if(a==="contrib-add"){
    var who = document.getElementById("new-contrib-who").value;
    var amt = parseNum(document.getElementById("new-contrib-amount").value);
    if(amt===null || amt<=0){ toast("Pon la cantidad aportada.", true); return; }
    run(api("casa_contributions", {method:"POST", prefer:"return=minimal",
      body:[{by_name: who, amount: amt}]}), "Aportación registrada");
  }
});

  if(!STATE) return;
  if(el.matches("[data-action='draft-item']")){
    purchaseDraft.items[el.getAttribute("data-id")] = el.checked;
  } else if(el.matches("[data-action='task-toggle-photo']")){
    s = JSON.parse(JSON.stringify(STATE.taskTemplate));
    var idx = parseInt(el.getAttribute("data-index"),10);
    s[idx].photo = !s[idx].photo;
    run(patchConfig({task_template: s}));
  } else if(el.matches("[data-field='task-label']")){
    s = JSON.parse(JSON.stringify(STATE.taskTemplate));
    s[parseInt(el.getAttribute("data-index"),10)].label = el.value;
    run(patchConfig({task_template: s}));
  } else if(el.matches("[data-field='weekly-label']")){
    s = JSON.parse(JSON.stringify(STATE.weeklyTasks));
    s[parseInt(el.getAttribute("data-index"),10)].label = el.value;
    run(patchConfig({weekly_tasks: s}));
  } else if(el.matches("[data-field='bins-person']")){
    /* Re-ancla la rotación en el próximo domingo: a partir de ahí sigue
       pasando de uno al siguiente cada semana. */
    run(patchConfig({
      bins_start_person: el.value || null,
      bins_start_date: el.value ? nextBinsSunday() : null
    }), "Rotación de cubos actualizada");
  } else if(el.matches("[data-field='item-name']")){
    run(api("casa_items?id=eq." + encodeURIComponent(el.getAttribute("data-id")), {method:"PATCH", prefer:"return=minimal",
      body:{name: el.value, updated_at: new Date().toISOString()}}));
  } else if(el.matches("[data-field='item-price']")){
    run(api("casa_items?id=eq." + encodeURIComponent(el.getAttribute("data-id")), {method:"PATCH", prefer:"return=minimal",
      body:{price: parseNum(el.value), updated_at: new Date().toISOString()}}));
  } else if(el.matches("[data-field='item-quantity']")){
    setItemQuantity(el.getAttribute("data-id"), parseNum(el.value));
  } else if(el.matches("[data-field='item-threshold']")){
    var th = parseNum(el.value);
    if(th===null || th<0) th = 0;
    run(api("casa_items?id=eq." + encodeURIComponent(el.getAttribute("data-id")), {method:"PATCH", prefer:"return=minimal",
      body:{low_threshold: th, updated_at: new Date().toISOString()}}));
  }
});

document.getElementById("cam").addEventListener("click", function(e){
  var el = e.target.closest("[data-cam]");
  if(!el) return;
  var a = el.getAttribute("data-cam");
  if(a==="close") closeCamera();
  else if(a==="shoot") camShoot();
  else if(a==="retake"){
    var cb = camOnCapture, dim = camMaxDim;
    var titleEl = document.querySelector(".cam-head span");
    var title = titleEl ? titleEl.textContent : "Hacer foto";
    closeCamera();
    openCamera(title, dim, cb);
  }
  else if(a==="use"){
    var img = camShot, cb2 = camOnCapture;
    closeCamera();
    if(img && cb2) cb2(img);
  }
});
document.getElementById("cam").addEventListener("change", function(e){
  var el = e.target;
  if(!el.matches("[data-cam='fallback-file']")) return;
  var file = el.files && el.files[0];
  if(!file) return;
  var cb = camOnCapture, dim = camMaxDim;
  fileToDataURL(file).then(function(src){ return shrinkDataURL(src, dim); }).then(function(img){
    closeCamera();
    if(cb) cb(img);
  }).catch(function(){ toast("No se pudo procesar la foto.", true); });
});

/* ================= boot ================= */
loadAll().then(render).catch(function(err){
  document.getElementById("app").innerHTML =
    "<div class=\"boot\">No se pudo conectar con el servidor.<br>Comprueba tu conexión y recarga la página.</div>";
  if(window.console) console.error(err);
});

/* El refresco vuelve a pintar la pantalla entera, así que no puede saltar
   mientras alguien está rellenando algo: le borraría lo escrito a media frase. */
function escribiendo(){
  if(purchaseFormOpen) return true;
  var el = document.activeElement;
  return !!el && (el.tagName==="INPUT" || el.tagName==="SELECT" || el.tagName==="TEXTAREA");
}
setInterval(function(){ if(!document.hidden && STATE && !escribiendo()) refresh(); }, 30000);
window.addEventListener("focus", function(){ if(STATE && !escribiendo()) refresh(); });

})();
</script>
