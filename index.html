/* Sustituye a window.confirm por un diálogo con el tema de la app. Cancelar
   tiene el foco al abrir, Esc cierra y Tab se queda dentro. */
var dlgActual = null;           /* el diálogo abierto; solo puede haber uno */
function confirma(pregunta, aceptar, hacer){
  if(dlgActual) dlgActual.cierra(false);   /* uno a la vez: el nuevo sustituye al anterior */
  var bg = document.createElement("div");
  bg.className = "dlg-bg";
  bg.innerHTML = '<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t">' +
    '<p class="dlg-t" id="dlg-t"></p><div class="dlg-b">' +
    '<button type="button" class="btn" data-k="no">Cancelar</button>' +
    '<button type="button" class="btn btn-danger" data-k="si"></button></div></div>';
  bg.querySelector(".dlg-t").textContent = pregunta;
  var si = bg.querySelector('[data-k="si"]'), no = bg.querySelector('[data-k="no"]');
  si.textContent = aceptar;
  var previo = document.activeElement;
  function tecla(e){
    if(e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); cierra(false); }
    else if(e.key === "Tab"){ e.preventDefault(); (document.activeElement === si ? no : si).focus(); }
  }
  function cierra(ok){
    if(!bg.isConnected) return;               /* ya cerrado */
    document.removeEventListener("keydown", tecla, true);
    bg.remove();
    if(dlgActual && dlgActual.cierra === cierra) dlgActual = null;
    if(previo && previo.isConnected && previo.focus) previo.focus();
    if(ok) hacer();
  }
  dlgActual = {cierra: cierra};
  bg.addEventListener("click", function(e){
    var k = e.target.getAttribute && e.target.getAttribute("data-k");
    if(k === "si") cierra(true);
    else if(k === "no" || e.target === bg) cierra(false);
  });
  document.addEventListener("keydown", tecla, true);
  document.body.appendChild(bg);
  no.focus();
}
function cabecera(){
  var sem = semanaDe(hoy());
  /* El estado (sin conexi\u00f3n, marcas por enviar, error) va en el banner, con su acci\u00f3n.
     Aqu\u00ed solo un indicador de guardado que no cambia la fecha. */
  var guardandoYa = guardando === "guardando";
  return '<div class="app u-pb-0"><div class="topbar">' +
    '<div class="brand"><h1 class="name">Casa Holanda</h1>' +
    '<div class="week">' + rango(sem).toUpperCase() +
      (guardandoYa ? ' <span class="sync" aria-live="polite">\u00b7 Guardando\u2026</span>' : '') + '</div></div>' +
    '<div class="topbar-right">' +
    '<button class="icon-btn" data-a="tema" title="Cambiar tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3v1.5M12 19.5V21M4.2 4.2l1.1 1.1M18.7 18.7l1.1 1.1M3 12h1.5M19.5 12H21M4.2 19.8l1.1-1.1M18.7 5.3l1.1-1.1"/><circle cx="12" cy="12" r="4"/></svg></button>' +
    '<button class="me" data-a="cambiar-yo"><span class="av" style="--zc:'+color(yo)+'">'+esc(yo.charAt(0))+'</span>' +
    '<span class="nm">'+esc(yo)+'</span></button>' +
    '</div></div></div>';
}

function pintaNav(){
  var defs = [{id:"hoy",lb:"Hoy"},{id:"fondo",lb:"A fondo"},{id:"mes",lb:"Mi mes"},
              {id:"historial",lb:"Historial"}];
  var masDefs = [{id:"compra",lb:"Compra"},{id:"bote",lb:"Bote"}];
  if(esAdmin()) masDefs.push({id:"admin",lb:"Admin"});
  var masActivo = masDefs.some(function(d){ return d.id === vista; });
  var lista = document.getElementById("sheetList");
  var htmlHoja = masDefs.map(function(d){
    var on = vista === d.id;
    return '<button type="button" data-a="ir" data-v="'+d.id+'" class="'+(on?"on":"")+'"'+(on?' aria-current="page"':'')+'>' +
      NAV_ICON[d.id] + '<span>'+d.lb+'</span></button>';
  }).join('');
  /* Con la hoja abierta no se reescribe si no ha cambiado; si cambia, el foco
     vuelve al botón que lo tenía (o al activo/primero) para no caer al body. */
  if(lista.innerHTML !== htmlHoja){
    var foco = document.activeElement, vFoco = foco && lista.contains(foco) ? foco.getAttribute("data-v") : null;
    lista.innerHTML = htmlHoja;
    if(masAbierto && (vFoco || (foco && foco === document.body))){
      var nb = (vFoco && lista.querySelector('button[data-v="'+vFoco+'"]')) ||
               lista.querySelector("button.on") || lista.querySelector("button");
      if(nb) nb.focus();
    }
  }
  /* El punto rojo avisa de lo que pide atención hoy. La lista de la compra no
     lleva: tener cosas apuntadas es su estado normal, no una alarma. */
  var fondoPide = fondoAbierto(hoy()) && zonasDeTurno().some(function(z){
    var pr = progreso(z.id, hoy());
    return pr.t > pr.d;
  });
  document.getElementById("navIn").innerHTML = defs.map(function(d){
    var punto = (d.id === "fondo" && fondoPide);
    return '<button type="button" data-a="ir" data-v="'+d.id+'" class="'+(vista===d.id?"on":"")+'"'+(vista===d.id?' aria-current="page"':'')+'>' +
      '<span class="u-pos-relative u-d-block">'+NAV_ICON[d.id] +
      (punto ? '<span class="dot" role="img" aria-label="pendiente"></span>' : '') + '</span>' +
      '<span class="lb">'+d.lb+'</span></button>';
  }).join('') +
  '<button type="button" id="masBtn" data-a="mas" class="'+(masActivo?"on":"")+'"' +
    (masActivo?' aria-current="page"':'') +
    ' aria-label="Más: Compra, Bote'+(esAdmin()?', Admin':'')+'" aria-haspopup="dialog" aria-controls="sheet" aria-expanded="'+(masAbierto?"true":"false")+'">' +
    '<span class="u-pos-relative u-d-block">'+NAV_ICON.mas+'</span><span class="lb">Más</span></button>';
}

/* ---------- hoja «Más» ---------- */
var masAbierto = false;
/* Mientras la hoja está abierta el fondo ni hace scroll ni recibe foco. */
function bloqueaFondo(on){
  document.documentElement.style.overflow = on ? "hidden" : "";
  document.body.style.overflow = on ? "hidden" : "";
  ["app","nav"].forEach(function(id){
    var n = document.getElementById(id);
    if(on) n.setAttribute("inert",""); else n.removeAttribute("inert");
  });
}
function abreMas(){
  masAbierto = true;
  document.getElementById("sheetBg").hidden = false;
  bloqueaFondo(true);
  var b = document.getElementById("masBtn"); if(b) b.setAttribute("aria-expanded","true");
  var p = document.querySelector("#sheetList button.on") || document.querySelector("#sheetList button");
  if(p) p.focus();
}
function cierraMas(devuelveFoco){
  if(!masAbierto) return;
  masAbierto = false;
  document.getElementById("sheetBg").hidden = true;
  bloqueaFondo(false);
  var b = document.getElementById("masBtn");
  if(b){ b.setAttribute("aria-expanded","false"); if(devuelveFoco) b.focus(); }
}
/* Teclado para los bloques que son div con role=button, y Esc para la foto ampliada. */
document.addEventListener("keydown", function(e){
  if(lightbox){
    if(e.key === "Escape"){ e.preventDefault(); cierraFoto(); return; }
    if(e.key === "Tab"){ e.preventDefault(); var lbx = document.querySelector(".lightbox"); if(lbx) lbx.focus(); return; }
  }
  var t = e.target;
  if((e.key === "Enter" || e.key === " ") && t && t.getAttribute && t.getAttribute("role") === "button" && t.hasAttribute("data-a")){
    e.preventDefault(); t.click();
  }
});
document.addEventListener("keydown", function(e){
  if(!masAbierto) return;
  if(e.key === "Escape"){ e.preventDefault(); cierraMas(true); }
  else if(e.key === "Tab"){
    var bs = document.querySelectorAll("#sheetList button");
    if(!bs.length) return;
    var first = bs[0], last = bs[bs.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    else if(!document.getElementById("sheet").contains(document.activeElement)){ e.preventDefault(); first.focus(); }
  }
});

/* ---------- casa ---------- */
function tareaHTML(t, puede, dia){
  var h = hecha(t, dia), acc;
  /* Solo se etiqueta la tarea que se sale del calendario de su sección: las
     semanales viven en el bloque de la limpieza a fondo, que ya dice el día, y
     las de cubos llevan el color escrito en su propio texto. */
  var etiqueta = "";
  if(t.cualquier_dia) etiqueta = "CUALQUIER D\u00cdA";
  else if(!t.semanal && !t.cubos && t.dias && t.dias.length && t.dias.length < 7){
    var ds = t.dias.slice().sort(function(a, b){ return ((a+6)%7) - ((b+6)%7); });
    etiqueta = ds.map(function(n){ return DOW_C[n]; }).join(" ");
  }
  /* Una marca sin red está apuntada en el móvil pero aún no en el servidor: se
     dice aquí, en la propia tarea, y no se ofrece marcarla otra vez. */
  var enCola = !h && cola().some(function(c){ return c.tarea_id === t.id && c.periodo === periodoDe(t, dia); });
  if(h){
    acc = (h.foto_url ? '<img class="thumb" src="'+at(h.foto_url)+'" data-a="foto" data-src="'+at(h.foto_url)+'" alt="" loading="lazy">' : '');
  } else if(enCola){
    acc = '<span class="tag enviar">Por enviar</span>';
  } else if(puede){
    acc = t.foto
      ? '<button class="btn btn-pri btn-sm task-hecho" data-a="foto-tarea" data-t="'+at(t.id)+'">'+CAM_SVG+' Foto</button>'
      : '<button class="btn btn-pri btn-sm task-hecho" data-a="marcar" data-t="'+at(t.id)+'">Hecho</button>';
  } else {
    acc = '<span class="tag plain">Pendiente</span>';
  }
  return '<div class="task'+(h?" done":"")+'">' +
    '<span class="tick">'+TICK_SVG+'</span>' +
    '<div class="t-main"><div class="t-label">'+esc(textoTarea(t, dia)) +
      (etiqueta ? '<span class="freq">'+esc(etiqueta)+'</span>' : '') + '</div>' +
    (h ? '<div class="t-meta">'+esc(h.por)+' · '+hora(h.at)+'</div>' : '') + '</div>' + acc + '</div>';
}


/* El aviso del cambio en la ficha: quien lo hace ese día ya sale en los chips,
   así que lo que falta decir es a quién se lo está cubriendo. */
function cambioHTML(zid, dia){
  var c = cambioDe(zid, dia);
  if(!c) return '';
  return '<div class="zone-sw">\u21c4 Cambio pactado \u00b7 en lugar de ' + esc(c.en_lugar_de) +
    (c.nota ? ' \u00b7 ' + esc(c.nota) : '') + '</div>';
}
function zonaHTML(z, dia, mia, dormida){
  var sem = semanaDe(dia);
  var p = progreso(z.id, dia);
  /* Dormida: hoy no se le pide nada. La ficha sigue diciendo de quién es y, si
     es tuya, lo deja claro; el progreso se guarda para cuando se abra. */
  if(dormida === undefined) dormida = !p.t && tareasDe(z.id).length > 0;
  var eq = asignacionDia(dia)[z.id] || [];
  var gente = eq.length
    ? eq.map(function(n){
        return '<span class="chip'+(n===yo?" you":"")+'"><span class="av s" style="--zc:'+color(n)+'">'+esc(n.charAt(0))+'</span>'+esc(n===yo?"Tú":n)+'</span>';
      }).join('')
    : '<span class="chip vacia">Sin asignar</span>';
  var ts = tareasDeDia(z.id, dia);
  var abierta = !dormida && (mia || abierto["z"+z.id]);
  /* Lo que queda va primero; lo hecho se pliega para que no tape lo pendiente. */
  var pendientes = ts.filter(function(t){ return !hecha(t, dia); }),
      hechas = ts.filter(function(t){ return hecha(t, dia); });
  var puede = puedoHacer(z.id, dia);
  var filas = pendientes.map(function(t){ return tareaHTML(t, puede, dia); }).join('') +
    (hechas.length
      ? '<details class="hechas"><summary>' + hechas.length + (hechas.length === 1 ? " hecha" : " hechas") + '</summary>' +
        hechas.map(function(t){ return tareaHTML(t, puede, dia); }).join('') + '</details>'
      : '');
  var cuerpo = abierta
    ? '<div class="tasks">' + (ts.length ? filas : '<div class="empty">Esta zona no tiene tareas todavía.</div>') + '</div>'
    : '';
  return '<div class="zone'+(mia && !dormida ? " mine" : "")+(dormida ? " dormida" : "")+
    '" style="--zc:'+at(z.color)+'">' +
    '<div class="zone-top" role="button" tabindex="0" aria-expanded="'+(abierta?"true":"false")+'" data-a="abre-zona" data-z="'+at(z.id)+'">' +
      '<span class="zone-bar"></span>' +
      '<div class="zone-id"><div class="zone-name"><span class="zone-dot"></span>'+esc(z.nombre)+'</div>' +
        (z.descripcion ? '<div class="zone-rooms">'+esc(z.descripcion)+'</div>' : '') +
        '<div class="zone-people">'+gente+'</div>' + cambioHTML(z.id, dia) + '</div>' +
      '<div class="prog"><div class="n">' +
        (dormida ? (mia ? "tu zona" : esc(diasFondoTexto()))
                 : (p.t ? '<b>'+p.d+'</b>/'+p.t : '—')) + '</div>' +
        '<div class="bar'+(p.p===100?" done":"")+'"><i style="width:'+p.p+'%"></i></div></div>' +
    '</div>' + cuerpo + '</div>';
}

/* Un bloque de sección: cabecera con icono, explicación y etiqueta, y el
   cuerpo plegable. Lo que distingue de un vistazo el día a día del fondo. */
function bloque(id, clase, icono, titulo, sub, tag, cuerpo){
  var ab = abierto["b"+id] !== false;             /* abiertos por defecto */
  return '<section class="blk '+clase+'">' +
    '<div class="blk-h" role="button" tabindex="0" aria-expanded="'+(abierto["b"+id] !== false ? "true" : "false")+'" data-a="abre-blk" data-b="'+at(id)+'">' +
      '<span class="blk-ic">'+icono+'</span>' +
      '<div class="blk-t"><div class="blk-n">'+esc(titulo)+'</div>' +
        '<div class="blk-s">'+esc(sub)+'</div></div>' +
      '<span class="blk-tag">'+esc(tag)+'</span>' +
      '<span class="blk-ch">'+(ab ? ICO.chevD : ICO.chevR)+'</span>' +
    '</div>' + (ab ? cuerpo : '') + '</section>';
}


function avisoSinRota(dia){
  if(!S.rotacionDesde || semanaDe(dia) >= S.rotacionDesde) return '';
  /* Una semana anterior al ancla pero ya congelada sí tiene equipo: es lo que
     pasa la semana en que se re-ancla la rotación, y decir lo contrario ese
     día asusta sin motivo. */
  if(S.semanas[semanaDe(dia)]) return '';
  return '<div class="note"><div><b>La rotaci\u00f3n empieza el ' + DOW[dow(S.rotacionDesde)] + ' ' +
    corta(S.rotacionDesde) + '.</b><br>Hasta entonces las zonas no tienen equipo.</div></div>';
}

/* La tira de arriba: lo tuyo de hoy, en una línea. */
function tiraMia(dia){
  if(!yo) return '';
  var mias = misZonas(dia);
  var conHoy = mias.filter(function(z){ return tareasDeDia(z.id, dia).length > 0; });
  var pend = 0;
  conHoy.forEach(function(z){ var p = progreso(z.id, dia); pend += p.t - p.d; });
  var v, extra;
  if(conHoy.length){
    v = conHoy.map(function(z){ return z.nombre; }).join(" + ");
    extra = pend
      ? "\u00b7 " + (pend === 1 ? "queda 1 tarea" : "quedan " + pend + " tareas")
      : "\u00b7 todo hecho";
  } else {
    v = "Nada por hoy";
    var zf = mias.filter(function(z){ return !z.rota_aparte; })[0];
    extra = zf ? "\u00b7 tu zona del " + diasFondoLargo().replace(/^el /, "") + " es " + zf.nombre : "";
  }
  return '<div class="mio">' + avatar(yo) + '<div class="mio-t">' +
    '<div class="mio-k">Hoy te toca</div>' +
    '<div class="mio-v">' + esc(v) + ' <em>' + esc(extra) + '</em></div></div></div>';
}

/* Ordena poniendo delante lo que es tuyo. */
function miasPrimero(zs, dia){
  var mias = misZonas(dia).map(function(z){ return z.id; });
  return zs.slice().sort(function(a, b){
    return (mias.indexOf(b.id) > -1 ? 1 : 0) - (mias.indexOf(a.id) > -1 ? 1 : 0);
  });
}

/* ---------- hoy: el turno diario y lo que se pide cada día ---------- */
function vHoy(){
  var dia = hoy();
  var mias = misZonas(dia).map(function(z){ return z.id; });
  var zs = miasPrimero(zonasAparte().filter(function(z){
    return tareasDeDia(z.id, dia).length > 0;
  }), dia);
  var sig = zs.length ? null : proximoDiaAparte(dia);
  var zd = zonaDiaria();
  var cuerpo = (zs.length
    ? zs.map(function(z){ return zonaHTML(z, dia, mias.indexOf(z.id) > -1, false); }).join('')
    : (fondoAbierto(dia)
        ? '<div class="empty">Hoy es limpieza a fondo. ' +
          (function(){ var mz = misZonas(dia).filter(function(z){ return !z.rota_aparte; })[0];
            return mz ? 'Tu zona: <b>' + esc(mz.nombre) + '</b>.' : 'Cada equipo tiene su zona en A fondo.'; })() + '</div>'
        : '<div class="empty">Hoy no hay turno diario.' +
          (sig ? ' El siguiente es el ' + DOW[dow(sig)] + ' ' + corta(sig) + '.' : '') + '</div>')) +
    (zd ? proximosHTML(zd, dia) : '');
  return avisoSinRota(dia) + tiraMia(dia) +
    bloque("hoy", "blk-hoy", NAV_ICON.hoy, "Turno diario",
           "Una persona al d\u00eda, para toda la casa \u00b7 " + diasLimpiezaTexto() + ".",
           diasFondoTexto() === "dom" ? "salvo dom" : "cada d\u00eda", cuerpo);
}

/* El turno de la semana en curso, de lunes a domingo. Va por semana y no por
   los siete días siguientes a hoy a propósito: el turno corre un puesto al día
   y dos más al cambiar de semana, así que dentro de una semana pasan los siete
   sin repetir, pero una ventana que se montase sobre dos semanas enseñaría a
   alguien dos veces y a otro ninguna. Eso no es la rotación, es la ventana. */
function agendaSemana(z, dia){
  var sem = semanaDe(dia), out = [];
  for(var i=0;i<7;i++){
    var d = mas(sem, i);
    out.push({dia: d, quien: turnoReal(z, d)[0] || "", hoy: d === dia,
              pasado: d < dia, libre: !tareasDeDia(z.id, d).length,
              cambio: cambioDe(z.id, d)});
  }
  return out;
}
/* Tener el turno de un día no es lo mismo que tener algo que hacer: el día de
   la limpieza a fondo la rotación sigue nombrando a alguien, pero ese día no se
   le pide nada porque le toca su zona como a todos. Lo que cuenta es esto. */
function tieneTurno(z, dia, quien){
  return turnoReal(z, dia)[0] === quien && tareasDeDia(z.id, dia).length > 0;
}
/* El próximo día que te toca a ti de verdad. Mira un mes por delante: con la
   casa llena sobra, y antes de que arranque la rotación no hay nada. */
function miProximoTurno(z, dia){
  for(var i=1;i<=31;i++){
    var d = mas(dia, i);
    if(tieneTurno(z, d, yo)) return d;
  }
  return null;
}
function proximosHTML(z, dia){
  var ag = agendaSemana(z, dia);
  if(!ag.some(function(c){ return c.quien; })) return '';
  /* La semana enseña quién tiene cada día; la línea de encima dice cuándo le
     toca al que mira, que puede caer en otra semana y no verse en la tira. */
  var mio = miProximoTurno(z, dia), nota;
  if(!mio){
    nota = "Pr\u00f3ximos d\u00edas";
  } else if(tieneTurno(z, dia, yo)){
    nota = "Hoy te toca \u00b7 vuelves el " + DOW[dow(mio)] + " " + corta(mio);
  } else {
    var f = entre(dia, mio);
    nota = "Te toca el " + DOW[dow(mio)] + " " + corta(mio) +
           (f === 1 ? " \u00b7 ma\u00f1ana" : " \u00b7 en " + f + " d\u00edas");
  }
  return '<div class="prox">' +
    '<div class="prox-k">' + esc(nota) + '</div>' +
    '<div class="prox-d">' + ag.map(function(c){
      var n = new Date(c.dia + "T00:00:00").getDate();
      return '<div class="prox-c' + (c.hoy ? " hoy" : "") +
          (c.quien === yo && !c.libre ? " tu" : "") + (c.pasado ? " pasado" : "") +
          (c.libre ? " libre" : "") + (c.cambio ? " cambio" : "") + '">' +
        (c.cambio ? '<span class="prox-sw" title="' +
          at("Cambio pactado \u00b7 en lugar de " + c.cambio.en_lugar_de) +
          '">\u21c4</span>' : '') +
        '<div class="prox-dow">' + (c.hoy ? "HOY" : DOW_C[dow(c.dia)] + " " + n) + '</div>' +
        (c.libre
          ? '<span class="av s u-bg-v-line"></span>' +
            '<div class="prox-n">' + (fondoAbierto(c.dia) ? "a fondo" : "\u2014") + '</div>'
          : c.quien
            ? '<span class="av s" style="--zc:'+color(c.quien)+'">' +
                esc(c.quien.charAt(0)) + '</span>' +
              '<div class="prox-n">' + esc(c.quien === yo ? "T\u00fa" : c.quien) + '</div>'
            : '<span class="av s u-bg-v-line"></span>' +
              '<div class="prox-n">\u2014</div>') +
      '</div>';
    }).join('') + '</div></div>';
}

/* ---------- a fondo: las zonas, el fin de semana ---------- */
function vFondo(){
  var dia = hoy(), abierta = fondoAbierto(dia);
  var mias = misZonas(dia).map(function(z){ return z.id; });
  var tag, nota = '';
  if(abierta){
    tag = (ultimoFondo(dia) === dia) ? "\u00faltimo d\u00eda" : "abierto hoy";
  } else {
    tag = diasFondoTexto();
    var sig = proximoFondo(dia);
    if(sig){
      var f = entre(dia, sig);
      nota = '<div class="cuenta">Se abre el ' + DOW[dow(sig)] + ' \u00b7 ' +
        (f === 1 ? "ma\u00f1ana" : "faltan " + f + " d\u00edas") + '</div>';
    }
    /* Lo que no depende del día ya se puede ir haciendo, aunque el fondo no
       esté abierto. Si no se dice, la cuenta atrás parece cerrarlo todo. */
    if(zonasDeTurno().some(function(z){
         return tareasDeDia(z.id, dia).some(function(t){
           return t.cualquier_dia && !hecha(t, dia);
         });
       })){
      nota += '<div class="cuenta libre">Lo marcado <b>cualquier d\u00eda</b> ya se puede hacer</div>';
    }
  }
  var zs = miasPrimero(zonasDeTurno(), dia);
  var cuerpo = nota + (zs.length
    ? zs.map(function(z){
        return zonaHTML(z, dia, mias.indexOf(z.id) > -1, !tareasDeDia(z.id, dia).length);
      }).join('')
    : '<div class="empty">No hay zonas todav\u00eda.</div>');
  return avisoSinRota(dia) +
    bloque("fondo", "blk-fondo" + (abierta ? " activo" : ""), NAV_ICON.fondo,
           "Limpieza a fondo",
           "Por zonas, en equipo. Un solo tic: " + diasFondoTexto() + ".", tag, cuerpo);
}

/* ---------- mi mes: lo que te toca en todo el mes, de un vistazo ---------- */
/* El turno diario cambia cada día y las zonas cada lunes, así que de memoria
   nadie sabe cómo tiene el mes. Aquí se ve de una vez: tus días de turno y tu
   zona de cada domingo. Se puede mirar el de otro, que para discutir un cambio
   hace falta ver los dos. */
function ultimoDiaMes(m){
  var a = Number(m.slice(0,4)), b = Number(m.slice(5,7));
  return f(new Date(a, b, 0));
}
function mesCorto(m){ return MES[Number(m.slice(5,7)) - 1] + " " + m.slice(0,4); }
function mesMas(m, n){
  var a = Number(m.slice(0,4)), b = Number(m.slice(5,7)) - 1 + n;
  var d = new Date(a, b, 1);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}
function diasDelMes(m){
  var out = [], d = m + "-01", fin = ultimoDiaMes(m);
  while(d <= fin){ out.push(d); d = mas(d, 1); }
  return out;
}
/* Lo que le toca a alguien un día, separado por tipo. Se apoya en toca() y en
   el reparto de siempre, así que el calendario no puede decir una cosa y la
   lista de abajo otra: las dos preguntan lo mismo. */
function loDeUnDia(quien, d){
  var zd = zonaDiaria();
  var mio = !!zd && turnoReal(zd, d)[0] === quien;
  var ts = mio ? tareasDeDia(zd.id, d) : [];
  var hechas = function(lista){
    return lista.length > 0 && lista.every(function(t){ return !!hecha(t, d); });
  };
  var normales = ts.filter(function(t){ return !t.cubos; });
  var saca     = ts.filter(function(t){ return t.cubos === "sacar"; });
  var entra    = ts.filter(function(t){ return t.cubos === "entrar"; });
  var zonas = [];
  if(fondoAbierto(d)){
    var a = asignacionDia(d);
    zonas = zonasDeTurno().filter(function(z){ return (a[z.id] || []).indexOf(quien) > -1; });
  }
  var tFondo = [];
  zonas.forEach(function(z){ tFondo = tFondo.concat(tareasDeDia(z.id, d)); });
  return {
    td: normales.length > 0, tdHecho: hechas(normales),
    cs: saca.length > 0,     csHecho: hechas(saca),
    ce: entra.length > 0,    ceHecho: hechas(entra),
    af: zonas.length > 0,    afHecho: hechas(tFondo),
    zonas: zonas
  };
}
/* El mes en rejilla. Es lo primero que se ve porque responde de un vistazo a
   "¿cuándo me toca?", que es para lo que se abre esta pantalla; las listas de
   abajo son el detalle. Empieza en lunes, como la semana de la casa. */
var CAL_MARCAS = [
  {k:"td", cl:"td", ab:"TD", qu:"Turno diario", de:"barrer, fregar y sacar la basura"},
  {k:"af", cl:"af", ab:"AF", qu:"A fondo",      de:"tu zona, los domingos"},
  {k:"cs", cl:"cu", ab:"CS", qu:"Cubos: sacar", de:"sacarlos a la calle"},
  {k:"ce", cl:"cu", ab:"CE", qu:"Cubos: entrar",de:"entrarlos a casa"}
];
/* Chip del cubo en la rejilla: clase de color y abreviatura según el nombre. */
function cuboChip(n){
  var l = String(n || "").toLowerCase().trim();
  var k = l === "gris grande" ? ["gg","GG"] : l.indexOf("gris") === 0 ? ["gr","GR"]
        : l.indexOf("verde") === 0 ? ["ve","VE"] : l.indexOf("azul") === 0 ? ["az","AZ"]
        : l.indexOf("marr") === 0 ? ["ma","MA"] : l.indexOf("amar") === 0 ? ["am","AM"]
        : ["ot", l.slice(0,2).toUpperCase() || "?"];
  return {cl:k[0], ab:k[1]};
}
function calendarioHTML(quien){
  var dias = diasDelMes(mesVisto), hoyEs = hoy();
  var cubosMes = {};      /* nombre -> parte, para explicarlos en la leyenda */
  var cabe = ["L","M","X","J","V","S","D"]
    .map(function(x){ return '<div class="cal-h">' + x + '</div>'; }).join('');
  var celdas = "";
  /* Hueco hasta el primer día: la rejilla arranca en lunes. */
  for(var i = 0; i < (dow(dias[0]) + 6) % 7; i++) celdas += '<div class="cal-c vacia"></div>';

  dias.forEach(function(d){
    var x = loDeUnDia(quien, d), pas = d < hoyEs;
    var marcas = CAL_MARCAS.filter(function(m){ return x[m.k]; }).map(function(m){
      /* En rojo solo lo que ya pasó y no se hizo: lo que está por venir no es
         un fallo todavía. */
      var falta = pas && !x[m.k === "td" ? "tdHecho" : m.k === "af" ? "afHecho"
                            : m.k === "cs" ? "csHecho" : "ceHecho"];
      return '<span class="cal-m ' + (falta ? "falta" : m.cl) + '">' + m.ab + '</span>';
    }).join('');
    var rec = recogidaDe(d), chips = "", tit = "";
    if(rec){
      chips = '<div class="cal-bs">' + rec.partes.map(function(pt){
        var c = cuboChip(pt.n); cubosMes[pt.n] = pt;
        return '<span class="cal-b ' + c.cl + '">' + esc(c.ab) + '</span>';
      }).join('') + '</div>';
      tit = ' title="Recogida: ' + at(rec.color) + '"';
    }
    celdas += '<div class="cal-c' + (d === hoyEs ? " hoy" : "") + (pas ? " pasado" : "") +
      (dow(d) === 0 ? " dom" : "") + (marcas || chips ? "" : " libre") + '"' + tit + '>' +
      '<div class="cal-d">' + Number(d.slice(8,10)) + '</div>' + chips +
      '<div class="cal-ms">' + marcas + '</div></div>';
  });

  var leyenda = CAL_MARCAS.map(function(m){
    return '<div class="cal-l"><span class="cal-m ' + m.cl + '">' + m.ab + '</span>' +
      '<span><b>' + esc(m.qu) + '</b> \u00b7 ' + esc(m.de) + '</span></div>';
  }).join('') +
    '<div class="cal-l ancha"><span class="cal-m falta">TD</span>' +
      '<span>En rojo, lo que ya pas\u00f3 y <b>no se hizo</b>.</span></div>';

  /* Los cubos que salen este mes, con su nombre completo. El fijo dice desde
     cuándo cuenta, para que no extrañe que antes no aparezca. */
  var leyCubos = Object.keys(cubosMes).map(function(n){
    var pt = cubosMes[n], c = cuboChip(n);
    var de = pt.fijo
      ? 'cada ' + DOW[pt.dow] + (pt.desde ? ', desde el ' + Number(pt.desde.slice(8,10)) + ' ' + MES[Number(pt.desde.slice(5,7))-1] : '')
      : 'recogida del calendario';
    return '<div class="cal-l"><span class="cal-b ' + c.cl + '">' + esc(c.ab) + '</span>' +
      '<span><b>Cubo ' + esc(n) + '</b> \u00b7 ' + esc(de) + '</span></div>';
  }).join('');

  return '<div class="cal">' + cabe + celdas + '</div>' +
    '<div class="cal-leyenda">' + leyenda + leyCubos + '</div>';
}

function vMes(){
  var quien = mesQuien || yo;
  var zd = zonaDiaria();
  var dias = diasDelMes(mesVisto);
  var turnos = [], domingos = [], recogidas = [];

  dias.forEach(function(d){
    if(zd && turnoReal(zd, d)[0] === quien && tareasDeDia(zd.id, d).length){
      turnos.push(d);
    }
    /* Solo los días de limpieza a fondo, y solo desde que la rotación arranca:
       antes de eso las zonas no son de nadie y la fila saldría vacía. */
    if(fondoAbierto(d)){
      var a = asignacionDia(d);
      var mias = zonasDeTurno().filter(function(z){
        return (a[z.id] || []).indexOf(quien) > -1;
      });
      if(mias.length) domingos.push({dia:d, zonas:mias});
    }
    var rec = recogidaDe(d);
    if(rec) recogidas.push(rec);
  });

  var sel = '<div class="mes-top">' +
    '<button class="icon-btn" data-a="mes-mueve" data-n="-1" title="Mes anterior">'+ICO.prev+'</button>' +

        esc(n === yo ? "Tú" : n) + '</button>';
    }).join('') + '</div>';

  var filasTurno = turnos.length
    ? turnos.map(function(d){
        var rec = recogidaDe(d), ent = recogidaDe(mas(d, -1));
        var extra = [];
        if(rec) extra.push("saca " + rec.frase);
        if(ent) extra.push("entra " + ent.frase);
        var p = progreso(zd.id, d), pas = d < hoy();
        return '<div class="mrow' + (d === hoy() ? " hoy" : "") + (pas ? " pasado" : "") + '">' +
          '<div class="mrow-d">' + DOW_C[dow(d)] + ' <b>' + Number(d.slice(8,10)) + '</b></div>' +
          '<div class="mrow-t">Turno diario' +
            (extra.length ? '<span class="mrow-x">· ' + esc(extra.join(" · ")) + '</span>' : '') +
          '</div>' +
          (pas ? '<span class="tag ' + (p.t && p.d >= p.t ? "ok" : "out") + '">' +
                   (p.t && p.d >= p.t ? "hecho" : "sin hacer") + '</span>' : '') +
        '</div>';
      }).join('')
    : '<div class="empty">Ningún turno diario este mes.</div>';

  var filasDom = domingos.length
    ? domingos.map(function(x){
        var pas = x.dia < hoy();
        return '<div class="mrow' + (x.dia === hoy() ? " hoy" : "") + (pas ? " pasado" : "") + '">' +
          '<div class="mrow-d">DOM <b>' + Number(x.dia.slice(8,10)) + '</b></div>' +
          '<div class="mrow-t">' + (x.zonas.length
            ? x.zonas.map(function(z){
                return '<span class="zchip" style="--zc:'+at(z.color)+'">' +
                  '<span class="zone-dot"></span>' + esc(z.nombre) + '</span>';
              }).join(' ')
            : '<span class="u-c-v-muted">sin zona</span>') + '</div>' +
        '</div>';
      }).join('')
    : '<div class="empty">Este mes no hay domingos con reparto.</div>';

  var filasCubos = recogidas.length
    ? recogidas.map(function(r){
        var sig = mas(r.dia, 1);
        var qs = zd ? (turnoReal(zd, r.dia)[0] || "—") : "—";
        var qe = zd ? (turnoReal(zd, sig)[0] || "—") : "—";
        return '<div class="mrow' + (r.dia < hoy() ? " pasado" : "") + '">' +
          '<div class="mrow-d">' + DOW_C[dow(r.dia)] + ' <b>' + Number(r.dia.slice(8,10)) + '</b></div>' +
          '<div class="mrow-t"><b>' + esc(r.color) + '</b>' +
            '<span class="mrow-x">saca ' + esc(qs) + ' · entra ' + esc(qe) +
            ' el ' + DOW_C[dow(sig)].toLowerCase() + ' ' + Number(sig.slice(8,10)) + '</span></div>' +
        '</div>';
      }).join('')
    : '<div class="empty">No hay recogidas apuntadas este mes.</div>';

  return sel + calendarioHTML(quien) +
    '<h2 class="eyebrow">Turno diario · ' + turnos.length +
      (turnos.length === 1 ? " día" : " días") + '</h2>' +
    '<div class="zone u-p-6px_14px_8px">' + filasTurno + '</div>' +
    '<h2 class="eyebrow">Limpieza a fondo · ' + diasFondoLargo() + '</h2>' +
    '<div class="zone u-p-6px_14px_8px">' + filasDom + '</div>' +
    '<h2 class="eyebrow">Cubos del mes</h2>' +
    '<div class="zone u-p-6px_14px_8px">' + filasCubos + '</div>';
}

/* ---------- historial ---------- */
/* Dos niveles: la semana con su media, y dentro una fila por día. Un día en
   que tocaba limpiar y no se hizo nada sale marcado: era lo que no se veía. */
/* ---------- historial ---------- */
/* Quién ha cumplido y quién no, semana a semana. Todo sale de las mismas
   funciones que el resto de la app (tareasDeDia, asignacionDia, hecha,
   periodoDe, textoTarea), así que un día de cubos —incluido el gris grande de
   los jueves, que entra por toca()/recogidaDe()— cuenta aquí igual que en Hoy. */
var HIST_MAX = 26;
var semHist = null;          /* lunes de la semana que se mira; null = la actual */
var histEstado = "";         /* "", "cargando" o "error" */

function histPrimera(){
  var lim = mas(semanaDe(hoy()), -7*(HIST_MAX-1));
  var ini = S.rotacionDesde ? semanaDe(S.rotacionDesde) : lim;
  var cur = semanaDe(hoy());
  if(ini > cur) ini = cur;
  return ini > lim ? ini : lim;
}
function histCargada(w){ return w >= mas(semanaDe(hoy()), -7*(histSemanas-1)); }
/* Trae solo lo que falta (las semanas entre HIST_MAX y lo ya cargado) y lo
   mezcla en S; cargar() usa histSemanas, así que los refrescos no lo pierden. */
var histCarga = null;           /* la carga en curso, para no lanzar dos a la vez */
function cargaHistorial(){
  if(histSemanas >= HIST_MAX) return Promise.resolve();
  if(histCarga) return histCarga;
  var base = histSemanas;         /* con cuántas semanas salió esta carga */
  var cur = semanaDe(hoy());
  var antes = mas(cur, -7*(base-1)), desde = mas(cur, -7*(HIST_MAX-1));
  histCarga = Promise.all([
    api("casa_completadas?select=*&periodo=gte."+desde+"&periodo=lt."+antes+"&order=at.desc"),
    api("casa_semanas?select=*&semana=gte."+desde+"&semana=lt."+antes),
    api("casa_cambios?select=*&dia=gte."+desde+"&dia=lt."+antes+"&order=dia.asc")
  ]).then(function(r){
    /* Aquí histSemanas sigue siendo `base`: solo esta función lo cambia y no
       puede haber dos cargas a la vez (histCarga). Si cargar() reemplazó S
       mientras tanto, la mezcla va sobre la S nueva, así que vale igual. */
    (r[0]||[]).forEach(function(c){ S.hechas[c.tarea_id + "|" + c.periodo] = c; });
    (r[1]||[]).forEach(function(w){ S.semanas[w.semana] = w; });
    S.cambios = (r[2]||[]).concat(S.cambios.filter(function(c){ return c.dia >= antes; }));
    histSemanas = HIST_MAX;
  }).finally(function(){ histCarga = null; });
  return histCarga;
}
function histCargar(){
  histEstado = "cargando";
  cargaHistorial().then(function(){ histEstado = ""; pinta(); })
    .catch(function(){ histEstado = "error"; pinta(); });
}
function histVa(w){
  var min = histPrimera(), cur = semanaDe(hoy());
  if(w < min) w = min;
  if(w > cur) w = cur;
  semHist = (w === cur) ? null : w;
  /* El aviso de carga/error solo vale para semanas que faltan: al volver a una
     ya cargada se limpia un error anterior. */
  if(histCargada(w)){ if(histEstado === "error") histEstado = ""; }
  else if(histEstado !== "cargando") histCargar();
  pinta();
}

/* Qué tocaba esa semana y qué se hizo, por tarea y por persona. Función pura:
   no toca el DOM. Una tarea semanal cuenta una vez; la de varias personas
   (zona de equipo) se atribuye al equipo, no a un individuo. Una diaria falla
   si su día ya pasó, una semanal si ya pasó el domingo. */
function cumplimientoSemana(w){
  var tope = hoy(), vistos = {}, pers = {}, tareas = [];
  var res = {w:w, h:0, f:0, p:0, tareas:tareas, personas:pers,
             recalcReparto: !S.semanas[w], diasRecalculados: 0};
  function persona(n){
    return pers[n] || (pers[n] = {n:n, h:0, f:0, p:0, tareas:[], fuera: S.gente.indexOf(n) < 0});
  }
  S.gente.forEach(persona);
  for(var i=0;i<7;i++){
    var dia = mas(w, i);
    if(S.rotacionDesde && dia < S.rotacionDesde) continue;
    var fondo = fondoAbierto(dia), a = asignacionDia(dia);
    if(dia <= tope){
      zonasAparte().forEach(function(z){
        if(!turnoCongelado(z, dia) && turnoDe(z, dia).length) res.diasRecalculados++;
      });
    }
    S.zonas.forEach(function(z){
      var quien = a[z.id] || [];
      tareasDeDia(z.id, dia).forEach(function(t){
        /* Igual que progresoDia: lo "de cualquier día" se imputa al día del fondo. */
        if(t.cualquier_dia && !fondo) return;
        var k = t.id + "|" + periodoDe(t, dia);
        if(vistos[k]) return;
        vistos[k] = 1;
        var h = S.hechas[k] || null;
        var vence = t.semanal ? mas(w, 6) : dia;
        var e = {t:t, z:z, dia:dia, texto:textoTarea(t, dia), quien:quien.slice(),
                 estado: h ? "hecha" : (vence < tope ? "falla" : "pend"),
                 por: h ? h.por : null, at: h ? h.at : null,
                 equipo: quien.length > 1,
                 otro: !!(h && h.por && quien.length && quien.indexOf(h.por) < 0)};
        tareas.push(e);
        var c = e.estado === "hecha" ? "h" : e.estado === "falla" ? "f" : "p";
        res[c]++;
        quien.forEach(function(n){ var p = persona(n); p[c]++; p.tareas.push(e); });
      });
    });
  }
  return res;
}
function histPct(c, enCurso){
  var base = c.h + c.f + (enCurso ? c.p : 0);
  return base ? Math.round(c.h / base * 100) : null;
}
function histEstadoPers(p){
  if(p.f) return {cl:"bad", ic:"✕", tx:"Falló " + p.f};
  if(p.p) return {cl:"warn", ic:"!", tx:"Pendiente " + p.p};
  if(p.h) return {cl:"ok", ic:"✓", tx:"Al día"};
  return {cl:"mute", ic:"–", tx:"Sin tareas"};
}
function histRol(p){
  var zs = {}, orden = [];
  p.tareas.forEach(function(e){
    var x = zs[e.z.id];
    if(!x){ x = zs[e.z.id] = {z:e.z, dias:[], eq:e.equipo}; orden.push(x); }
    if(x.dias.indexOf(e.dia) < 0) x.dias.push(e.dia);
  });
  return orden.map(function(x){
    var d = x.z.rota_aparte ? ": " + x.dias.map(function(q){ return DOW_C[dow(q)].toLowerCase(); }).join(", ") : "";
    return x.z.nombre + d + (x.eq ? " (equipo)" : "");
  }).join(" · ");
}
function histTarea(e){
  var cuando = e.t.semanal ? "semana" : DOW_C[dow(e.dia)] + " " + Number(e.dia.slice(8,10));
  var est = e.estado === "hecha"
    ? '<span class="ht-e ok"><span aria-hidden="true">✓</span> Hecha' +
        (e.por ? ' · ' + esc(e.por) : '') + (e.at ? ' · ' + hora(e.at) : '') + '</span>'
    : e.estado === "falla"
      ? '<span class="ht-e bad"><span aria-hidden="true">✕</span> No hecha</span>'
      : '<span class="ht-e warn"><span aria-hidden="true">!</span> Pendiente</span>';
  var nota = [];
  if(e.equipo) nota.push("Equipo: " + e.quien.join(", "));
  if(e.otro) nota.push("Hecha por " + e.por + " (le tocaba a " + e.quien.join(" y ") + ")");
  return '<li class="ht"><span class="ht-d">' + esc(cuando) + '</span>' +
    '<span class="ht-t"><span class="zone-dot" style="--zc:' + at(e.z.color) + '"></span>' +
      esc(e.texto) + (nota.length ? '<small>' + esc(nota.join(" · ")) + '</small>' : '') + '</span>' +
    est + '</li>';
}

function vHistorial(){
  var cur = semanaDe(hoy()), w = semHist || cur, enCurso = (w === cur);
  var min = histPrimera();
  if(w < min) w = min;
  var selector =
    '<div class="hs' + (enCurso ? ' actual' : '') + '" role="group" aria-label="Selector de semana">' +
      '<button type="button" class="hs-b" data-a="hist-ant" aria-label="Semana anterior"' + (w <= min ? ' disabled' : '') + '>'+ICO.prev+'</button>' +
      '<div class="hs-c" aria-live="polite"><div class="hs-r">' + esc(rango(w)) + '</div>' +
        '<span class="tag ' + (enCurso ? 'ok' : 'plain') + '">' + (enCurso ? 'Esta semana · en curso' : 'Cerrada') + '</span></div>' +
      '<button type="button" class="hs-b" data-a="hist-sig" aria-label="Semana siguiente"' + (enCurso ? ' disabled' : '') + '>'+ICO.next+'</button>' +
    '</div>' +
    (enCurso ? '' : '<div class="u-ta-center u-m--4px_0_12px"><button type="button" class="chip" data-a="hist-hoy">Volver a esta semana</button></div>');

  var falta = !histCargada(w);
  if(falta && histEstado === "cargando")
    return selector + '<div class="hist-aviso" role="status" aria-busy="true">Cargando semanas anteriores…</div>';
  if(falta && histEstado === "error")
    return selector + '<div class="hist-aviso mal" role="alert">No se han podido cargar las semanas anteriores. ' +
      '<button type="button" class="chip" data-a="hist-reintenta">Reintentar</button></div>';
  if(!S.rotacionDesde || mas(w, 6) < S.rotacionDesde)
    return selector + '<div class="empty">La rotación aún no había empezado.</div>';

  var c = cumplimientoSemana(w);
  var avisos = '';
  if(copiaDe) avisos += '<div class="hist-aviso mal" role="status">Datos de las ' + esc(hora(copiaDe)) + ', sin conexión.</div>';
  if(c.recalcReparto)
    avisos += '<div class="hist-aviso" role="note"><b>Reparto recalculado.</b> Esta semana no se guardó en su día: ' +
      'se ha reconstruido con la gente y las zonas de hoy, así que puede no ser el que se vivió.</div>';
  else if(c.diasRecalculados)
    avisos += '<div class="hist-aviso" role="note"><b>Turno diario recalculado</b> en ' + c.diasRecalculados +
      (c.diasRecalculados === 1 ? ' día' : ' días') + ' que no se guardaron en su momento.</div>';

  if(!c.tareas.length)
    return selector + avisos + '<div class="empty">Esta semana no tocaba nada.</div>';

  var pct = histPct(c, enCurso), ant = null;
  var wa = mas(w, -7);
  if(histCargada(wa) && wa >= min){ ant = histPct(cumplimientoSemana(wa), false); }
  var delta = (pct !== null && ant !== null && !enCurso) ? pct - ant : null;
  var stats = '<div class="stat-row tres">' +
    '<div class="stat"><div class="k">Cumplido</div><div class="v">' + (pct === null ? '—' : pct + '%') +
      '<small> ' + c.h + '/' + (c.h + c.f + (enCurso ? c.p : 0)) + '</small></div>' +
      (delta !== null && delta !== 0 ? '<div class="stat-d">' + (delta > 0 ? '+' : '−') + Math.abs(delta) + ' pts vs. anterior</div>' : '') + '</div>' +
    '<div class="stat"><div class="k">Falladas</div><div class="v u-c-v-bad"' + (c.f ? '' : '') + '>' + c.f + '</div></div>' +
    '<div class="stat"><div class="k">Pendientes</div><div class="v">' + c.p + '</div></div>' +
  '</div>';

  var lista = S.gente.concat(Object.keys(c.personas).filter(function(n){ return S.gente.indexOf(n) < 0; }))
    .map(function(n){ return c.personas[n]; })
    .filter(function(p){ return p && (p.tareas.length || !p.fuera); });
  lista.sort(function(a, b){ return (b.f - a.f) || (b.p - a.p); });
  var cumplen = lista.filter(function(p){ return p.tareas.length && !p.f; }).map(function(p){ return p.n; });
  var fallan = lista.filter(function(p){ return p.f; }).map(function(p){ return p.n + " (" + p.f + ")"; });
  var quien = '<p class="hist-quien"><b>Han cumplido:</b> ' + esc(cumplen.join(", ") || "nadie todavía") +
    '<br><b>Han fallado:</b> ' + esc(fallan.join(", ") || "nadie") + '</p>';

  var filas = lista.map(function(p){
    var k = "hp" + w + p.n, ab = !!abierto[k], st = histEstadoPers(p), tot = p.h + p.f + p.p;
    var id = "hpd-" + w + "-" + S.gente.indexOf(p.n);
    return '<div class="hp">' +
      '<button type="button" class="hp-top" data-a="hist-abre" data-k="' + at(k) + '" aria-expanded="' + ab + '" aria-controls="' + id + '">' +
        '<span class="av" style="--zc:' + color(p.n) + '" aria-hidden="true">' + esc(p.n.charAt(0)) + '</span>' +
        '<span class="hp-nm"><b>' + esc(p.n) + '</b><small>' + esc(histRol(p) || "Sin tareas esta semana") + '</small></span>' +
        '<span class="hp-st ' + st.cl + '"><span aria-hidden="true">' + st.ic + '</span> ' + esc(st.tx) + '</span>' +
        '<span class="hp-n">' + p.h + ' de ' + tot + '<span class="sr"> cumplidas</span></span>' +
        '<span class="hp-ch" aria-hidden="true">' + (ab ? ICO.chevD : ICO.chevR) + '</span>' +
      '</button>' +
      (ab ? '<ul class="hp-det" id="' + id + '">' + (p.tareas.length
        ? p.tareas.map(histTarea).join('') : '<li class="empty">Nada que hacer esta semana.</li>') + '</ul>' : '') +
    '</div>';
  }).join('');
  var nota = c.tareas.some(function(e){ return e.equipo; })
    ? '<p class="hist-nota">Las tareas de zonas con varias personas cuentan para todo el equipo: no hay un responsable individual.</p>' : '';

  /* Secundarios, plegados: por zona y por día (lo de siempre). */
  var zs = S.zonas.map(function(z){
    var eq = z.rota_aparte ? turnoSemana(z, w) : (asignacion(w)[z.id] || []);
    if(eq.length > 3) eq = [eq.length + " personas"];
    return {z:z, p:progresoSemana(z.id, w), eq:eq};
  });
  var kz = "hz" + w, kd = "hd" + w;
  var porZona = '<div class="hist-sec"><button type="button" class="hist-sec-b" data-a="hist-abre" data-k="' + kz +
    '" aria-expanded="' + !!abierto[kz] + '">Por zona <span aria-hidden="true">' + (abierto[kz] ? ICO.chevD : ICO.chevR) + '</span></button>' +
    (abierto[kz] ? zs.map(function(x){
      return '<div class="wk-zone"><div class="nm"><span class="zone-dot" style="--zc:' + at(x.z.color) + '"></span>' +
        esc(x.z.nombre) + '<span class="who">' + esc(x.eq.join(", ") || "sin asignar") + '</span></div>' +
        '<div class="bar" style="--zc:' + at(x.z.color) + ';margin:0"><i style="width:' + x.p.p + '%"></i></div>' +
        '<span class="wk-pct u-fs-12px">' + x.p.p + '%</span></div>';
    }).join('') : '') + '</div>';

  var zd = zonaDiaria(), dias = [];
  for(var k = 0; k < 7; k++){
    var dd = mas(w, k);
    if(dd > hoy()) break;
    if(S.rotacionDesde && dd < S.rotacionDesde) continue;
    dias.push({d:dd, p:progresoDia(dd), quien: zd ? (turnoReal(zd, dd)[0] || "") : ""});
  }
  var porDia = '<div class="hist-sec"><button type="button" class="hist-sec-b" data-a="hist-abre" data-k="' + kd +
    '" aria-expanded="' + !!abierto[kd] + '">Por día <span aria-hidden="true">' + (abierto[kd] ? ICO.chevD : ICO.chevR) + '</span></button>' +
    (abierto[kd] ? dias.map(function(x){
      var nada = x.p.t && !x.p.d;
      return '<div class="dy' + (nada ? ' nada' : '') + '"><span class="d">' + DOW_C[dow(x.d)] + ' ' + Number(x.d.slice(8,10)) + '</span>' +
        '<span class="qn">' + esc(x.quien) + '</span><span class="segs"></span>' +
        '<span class="n">' + (x.p.t ? (nada ? '✕ nada' : x.p.d + '/' + x.p.t) : 'libre') + '</span></div>';
    }).join('') : '') + '</div>';

  /* La misma información en tabla, para lectores de pantalla y para mirarla de un vistazo. */
  var tabla = '<details class="hist-tab"><summary>Ver como tabla</summary>' +
    '<table class="hist-table"><caption>Cumplimiento por persona, ' + esc(rango(w)) + '</caption>' +
    '<thead><tr><th scope="col">Persona</th><th scope="col">Estado</th><th scope="col">Cumplidas</th>' +
    '<th scope="col">Falladas</th><th scope="col">Pendientes</th></tr></thead><tbody>' +
    lista.map(function(p){
      var st = histEstadoPers(p);
      return '<tr><th scope="row">' + esc(p.n) + '</th><td>' + esc(st.tx) + '</td><td>' + p.h +
        '</td><td>' + p.f + '</td><td>' + p.p + '</td></tr>';
    }).join('') + '</tbody></table></details>';
  return selector + avisos + stats + quien +
    '<h2 class="eyebrow">Por persona</h2><div class="hp-lista">' + filas + '</div>' + nota +
    tabla + porZona + porDia;
}

/* ================= acciones ================= */
/* Sube o baja un elemento de una lista y vuelve a numerar el orden entero.
   Se manda de una vez: una fila movida arrastra a las de al lado. */
function reordena(tabla, lista, i, dir){
  var j = i + dir;
  if(!lista || j < 0 || j >= lista.length) return Promise.resolve();
  var l = lista.slice(), tmp = l[i]; l[i] = l[j]; l[j] = tmp;
  return api(tabla + "?on_conflict=id", {
    method:"POST", prefer:"resolution=merge-duplicates,return=minimal",
    body: l.map(function(fila, k){
      var copia = {};
      for(var campo in fila) if(Object.prototype.hasOwnProperty.call(fila, campo)) copia[campo] = fila[campo];
      copia.orden = k + 1;
      return copia;
    })
  });
}
function toast(m, mal){
  var el = document.getElementById("toast");
  el.className = mal ? "bad" : ""; el.setAttribute("role", mal ? "alert" : "status");
  el.hidden = false; el.textContent = m;
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.hidden = true; }, mal ? 4500 : 2200);
}
/* `foto` es la imagen que todavía no ha podido subir: si la marca tampoco
   sale, se guardan las dos juntas y se mandan enteras más tarde. */
function completa(tareaId, url, foto){
  var t = S.tareas.filter(function(x){ return x.id === tareaId; })[0];
  if(!t) return Promise.resolve();
  var per = periodoDe(t, hoy());
  guardando = "guardando"; pinta();
  return api("casa_completadas?on_conflict=tarea_id,periodo", {
    method:"POST", prefer:"resolution=merge-duplicates,return=minimal",
    body:[{tarea_id:t.id, periodo:per, por:yo, at:new Date().toISOString(), foto_url:url || null}]
  }).then(cargar).then(function(){
    guardando = "ok"; pinta(); toast("Hecho");
  }).catch(function(e){
    var fallo = sinRed(e) ? encola(t.id, per, foto || null, url || null) : motivo(e);
    if(fallo){
      guardando = "error"; pinta(); toast(fallo, true);
    }else{
      guardando = "ok"; pinta();
      toast("Sin conexi\u00f3n: guardado, se env\u00eda solo al volver.");
    }
    if(window.console) console.error(e);
  });
}
function cfg(patch){
  patch.updated_at = new Date().toISOString();
  return api("casa_config?id=eq.1", {method:"PATCH", prefer:"return=minimal", body:patch});
}
function sincroCompra(){
  var a = document.getElementById("c-imp"), b = document.getElementById("c-con");
  if(a) compra.importe = a.value;
  if(b) compra.concepto = b.value;

function guardaCompra(){
  sincroCompra();
  var imp = num(compra.importe);
  if(imp === null || imp < 0){ toast("Pon el importe.", true); return; }
  if(!compra.ticket){ toast("Falta la foto del ticket.", true); return; }
  guardando = "guardando"; pinta();
  uploadPhoto(compra.ticket, "tickets").then(function(url){
    compraAbierta = false;
    compra = {importe:"", concepto:"", ticket:null};
    return run(api("casa_purchases", {method:"POST", prefer:"return=minimal",
      body:[{by_name:yo, amount:imp, note:compra.concepto || "Compra de limpieza", ticket_url:url}]}),
      "Compra registrada");
  }).catch(function(e){
    guardando = "error"; pinta();
    toast("No se pudo guardar la compra.", true);
    if(window.console) console.error(e);
  });
}

/* ================= cámara ================= */
function abreCamara(titulo, max, cb){
  camCb = cb; camShot = null; camMax = max;
  var cam = document.getElementById("cam");
  cam.hidden = false;
  cam.innerHTML = '<div class="cam-back"><div class="cam-box">' +
    '<div class="cam-head"><span>'+esc(titulo)+'</span><button data-c="cerrar" aria-label="Cerrar">✕</button></div>' +
    '<div class="cam-stage"><video id="cv" playsinline muted></video><img id="cp" hidden alt="">' +
    '<div class="cam-status" id="cs">Abriendo cámara…</div></div>' +
    '<div class="cam-actions" id="ca"><button class="btn btn-pri" data-c="disparo" disabled>'+CAM_SVG+' Hacer foto</button></div>' +
    '</div></div>';
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ fallback(); return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}, audio:false})
    .then(function(st){
      camStream = st;
      var v = document.getElementById("cv");
      if(!v){ paraCam(); return; }
      v.srcObject = st; v.play();
      var s = document.getElementById("cs"); if(s) s.textContent = "";
      var b = document.querySelector("[data-c='disparo']"); if(b) b.disabled = false;
    }).catch(fallback);
}
function fallback(){
  var box = document.querySelector(".cam-box");
  if(!box) return;
  var st = box.querySelector(".cam-stage"); if(st) st.remove();
  var ac = box.querySelector(".cam-actions"); if(ac) ac.remove();
  var d = document.createElement("div");
  d.className = "cam-fallback";
  d.innerHTML = '<p>Este navegador no deja abrir la cámara dentro de la app. Pulsa el botón: en el móvil se abrirá la cámara.</p>' +
    '<label class="btn btn-pri btn-file">'+CAM_SVG+' Abrir cámara<input type="file" accept="image/*" capture="environment" data-c="archivo"></label>';
  box.appendChild(d);
}
function paraCam(){ if(camStream){ camStream.getTracks().forEach(function(t){ t.stop(); }); camStream = null; } }
function cierraCam(){
  paraCam(); camCb = null; camShot = null;
  var c = document.getElementById("cam"); c.innerHTML = ""; c.hidden = true;
}
function dispara(){
  var v = document.getElementById("cv");
  if(!v || !v.videoWidth) return;
  var w = v.videoWidth, h = v.videoHeight, m = camMax;
  if(w > h && w > m){ h = Math.round(h*m/w); w = m; }
  else if(h >= w && h > m){ w = Math.round(w*m/h); h = m; }
  var c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(v, 0, 0, w, h);
  camShot = c.toDataURL("image/jpeg", 0.7);
  var p = document.getElementById("cp");
  p.src = camShot; p.hidden = false; v.hidden = true;
  paraCam();
  document.getElementById("ca").innerHTML =
    '<button class="btn" data-c="repite">Repetir</button>' +
    '<button class="btn btn-pri" data-c="usa">Usar esta foto</button>';
}
function encoge(src, max){
  return new Promise(function(res, rej){
    var img = new Image();
    img.onerror = function(){ rej(new Error("decode")); };
    img.onload = function(){
      var w = img.width, h = img.height;
      if(w > h && w > max){ h = Math.round(h*max/w); w = max; }
      else if(h >= w && h > max){ w = Math.round(w*max/h); h = max; }
      var c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      res(c.toDataURL("image/jpeg", 0.7));
    };
    img.src = src;
  });
}
function leeArchivo(file){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onerror = function(){ rej(new Error("read")); };
    r.onload = function(e){ res(e.target.result); };
    r.readAsDataURL(file);
  });
}

/* ================= eventos ================= */
/* La barra inferior vive fuera de #app, así que el mismo manejador se engancha
   a los dos contenedores. */
function onClick(e){
  var el = e.target.closest("[data-a]");
  if(!el || !S) return;
  var a = el.getAttribute("data-a"), id = el.getAttribute("data-id"), i;

  if(a === "yo"){
    yo = el.getAttribute("data-n");
    try{ localStorage.setItem(KEY, yo); }catch(x){}
    pinta();
  }
  else if(a === "cambiar-yo"){
    confirma("¿Cambiar de usuario en este móvil?", "Cambiar", function(){
      try{ localStorage.removeItem(KEY); }catch(x){}
      yo = null; pinta();
    });
  }
  else if(a === "tema"){
    var r = document.documentElement;
    var osc = r.getAttribute("data-theme") === "dark" ||
      (!r.getAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches);
    r.setAttribute("data-theme", osc ? "light" : "dark");
  }
  else if(a === "ir"){
    var enHoja = masAbierto;
    vista = el.getAttribute("data-v"); cierraMas(false); pinta(); window.scrollTo(0,0);
    if(enHoja){ var mb = document.getElementById("masBtn"); if(mb) mb.focus(); }
  }
  else if(a === "mas"){ if(masAbierto) cierraMas(true); else abreMas(); }
  else if(a === "cierra-mas"){ if(e.target === el) cierraMas(true); }
  else if(a === "abre-zona"){ var z = el.getAttribute("data-z"); abierto["z"+z] = !abierto["z"+z]; pinta(); }
  else if(a === "abre-blk"){
    var b = el.getAttribute("data-b");
    abierto["b"+b] = abierto["b"+b] === false;    /* por defecto están abiertos */
    pinta();
  }
  else if(a === "hist-ant"){ histVa(mas(semHist || semanaDe(hoy()), -7)); }
  else if(a === "hist-sig"){ histVa(mas(semHist || semanaDe(hoy()), 7)); }
  else if(a === "hist-hoy"){ histVa(semanaDe(hoy())); }
  else if(a === "hist-reintenta"){ histCargar(); pinta(); }
  else if(a === "reintenta"){ vaciaCola().then(function(m){ if(!m) refrescar(); }); }
  else if(a === "ap-foco"){ var af = document.getElementById("ap-cuanto"); if(af) af.focus(); }
  else if(a === "l-foco"){ var lf = document.getElementById("l-nombre"); if(lf) lf.focus(); }
  else if(a === "hist-abre"){ var hk = el.getAttribute("data-k"); abierto[hk] = !abierto[hk]; pinta(); }
  else if(a === "abre-sem"){ var w = el.getAttribute("data-w"); abierto["w"+w] = !abierto["w"+w]; pinta(); }
  else if(a === "abre-acc"){ var k = el.getAttribute("data-k"); abierto["a"+k] = !abierto["a"+k]; pinta(); }
  else if(a === "foto"){ lightboxOrigen = el; lightbox = el.getAttribute("data-src"); pinta(); }
  else if(a === "cerrar-foto"){ cierraFoto(); }
  else if(a === "foto-tarea"){
    var tid = el.getAttribute("data-t");
    abreCamara("Foto de la tarea", 1024, function(img){
      guardando = "guardando"; pinta();
      uploadPhoto(img, "tareas")
        .then(function(u){ return completa(tid, u, null); })
        .catch(function(err){
          /* Si la foto no sube por falta de red, la marca se apunta con la
             imagen dentro y suben las dos juntas cuando vuelva. */
          if(sinRed(err)) return completa(tid, null, img);
          guardando = "error"; pinta(); toast(motivo(err), true);
          if(window.console) console.error(err);
        });
    });
  }
  else if(a === "marcar") completa(el.getAttribute("data-t"), null);
  else if(a === "compra-abre"){ compraAbierta = true; pinta(); }
  else if(a === "c-cancela"){ compraAbierta = false; compra = {importe:"",concepto:"",ticket:null}; pinta(); }
  else if(a === "c-ticket"){ sincroCompra(); abreCamara("Foto del ticket", 1400, function(img){ compra.ticket = img; pinta(); }); }
  else if(a === "c-guardar") guardaCompra();

  /* --- admin --- */
  else if(a === "g-add"){
    var n = document.getElementById("g-nuevo").value.trim();
    if(!n || S.gente.indexOf(n) > -1) return;
    run(cfg({people: S.gente.concat([n])}), "Añadido");
  }
  else if(a === "g-quita"){
    i = parseInt(el.getAttribute("data-i"),10);
    var quita = S.gente[i];
    if(quita == null) return;
    confirma("¿Quitar a " + quita + " de la casa?", "Quitar", function(){
      /* Por nombre, no por posición: la lista puede haber cambiado con el diálogo abierto. */
      var g = S.gente.filter(function(x){ return x !== quita; });
      run(cfg({people:g}));
    });
  }
  else if(a === "g-sube" || a === "g-baja"){
    i = parseInt(el.getAttribute("data-i"),10);
    var j = i + (a === "g-sube" ? -1 : 1);
    if(j < 0 || j >= S.gente.length) return;
    var gg = S.gente.slice(); var tmp = gg[i]; gg[i] = gg[j]; gg[j] = tmp;
    run(cfg({people:gg}));
  }
  else if(a === "dl"){
    var dd = parseInt(el.getAttribute("data-d"), 10);
    var ds = diasLimpieza().slice(), pos = ds.indexOf(dd);
    if(pos > -1) ds.splice(pos, 1); else ds.push(dd);
    ds.sort(function(x, y){ return x - y; });
    run(cfg({dias_limpieza: ds}), ds.length ? "Días de limpieza actualizados" : "Ya no hay días de limpieza");
  }
  else if(a === "g-admin"){
    var na = el.getAttribute("data-n");
    var ad = S.admins.slice(), ka = ad.indexOf(na);
    if(ka > -1){
      if(ad.length === 1){ toast("Tiene que quedar al menos un admin.", true); return; }
      ad.splice(ka, 1);
    } else ad.push(na);
    run(cfg({admins: ad}), "Admins actualizados");
  }
  else if(a === "z-aparte"){
    var za = S.zonas.filter(function(x){ return x.id === id; })[0];
    if(!za) return;
    run(api("casa_zonas?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal",
      body: za.rota_aparte
        ? {rota_aparte:false, rota_salto:0}
        : {rota_aparte:true, rota_cada:7, rota_salto:0,
           rota_desde: za.rota_desde || mas(semanaDe(hoy()), 7),
           rota_persona: za.rota_persona || S.gente[0] || null}}),
      za.rota_aparte ? "Vuelve al reparto de zonas" : "Pasa a turno propio");
  }
  else if(a === "z-sube" || a === "z-baja"){
    i = parseInt(el.getAttribute("data-i"), 10);
    run(reordena("casa_zonas", S.zonas, i, a === "z-sube" ? -1 : 1));
  }
  else if(a === "t-sube" || a === "t-baja"){
    i = parseInt(el.getAttribute("data-i"), 10);
    run(reordena("casa_tareas", tareasDe(el.getAttribute("data-z")), i, a === "t-sube" ? -1 : 1));
  }
  else if(a === "t-dia"){
    var td = S.tareas.filter(function(x){ return x.id === id; })[0];
    if(!td) return;
    var dd2 = parseInt(el.getAttribute("data-d"), 10);
    var ds2 = (td.dias && td.dias.length ? td.dias : diasLimpieza()).slice();
    var kd = ds2.indexOf(dd2);
    if(kd > -1) ds2.splice(kd, 1); else ds2.push(dd2);
    ds2.sort(function(x, y){ return ((x+6)%7) - ((y+6)%7); });
    run(api("casa_tareas?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal",
      body:{dias: ds2.length ? ds2 : null}}));
  }
  else if(a === "t-sem" || a === "t-foto" || a === "t-libre"){
    var tf = S.tareas.filter(function(x){ return x.id === id; })[0];
    if(!tf) return;
    var campo = a === "t-sem" ? "semanal" : a === "t-foto" ? "foto" : "cualquier_dia";
    var cuerpo2 = {}; cuerpo2[campo] = !tf[campo];
    /* Sin día fijo solo tiene sentido contando una vez por semana: si no, se
       pediría de nuevo cada día y habría que marcarla siete veces. */
    if(campo === "cualquier_dia" && !tf.cualquier_dia) cuerpo2.semanal = true;
    run(api("casa_tareas?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal",
      body: cuerpo2}));
  }
  else if(a === "z-add"){
    var zn = document.getElementById("z-nueva").value.trim();
    if(!zn) return;
    var slug = zn.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,24) || ("z"+Date.now());
    run(api("casa_zonas", {method:"POST", prefer:"return=minimal",
      body:[{id:slug, nombre:zn, plazas:1, color:PAL[S.zonas.length % PAL.length], orden:S.zonas.length+1}]}), "Zona añadida");
  }
  else if(a === "z-quita"){
    confirma("¿Eliminar la zona y todas sus tareas?", "Eliminar", function(){
      run(api("casa_zonas?id=eq."+encodeURIComponent(id), {method:"DELETE", prefer:"return=minimal"}));
    });
  }
  else if(a === "t-add"){
    var zid = el.getAttribute("data-z");
    var inp = document.querySelector("[data-f='t-nueva'][data-z='"+zid+"']");
    var lb = inp.value.trim();
    if(!lb) return;
    inp.value = "";
    run(api("casa_tareas", {method:"POST", prefer:"return=minimal",
      body:[{zona_id:zid, label:lb, foto:true, orden:tareasDe(zid).length+1}]}), "Tarea añadida");
  }
  else if(a === "t-quita"){
    confirma("¿Eliminar esta tarea?", "Eliminar", function(){
      run(api("casa_tareas?id=eq."+encodeURIComponent(id), {method:"DELETE", prefer:"return=minimal"}));
    });
  }
  else if(a === "mes-mueve"){
    mesVisto = mesMas(mesVisto, parseInt(el.getAttribute("data-n"), 10));
    pinta(); window.scrollTo(0,0);
  }
  else if(a === "mes-quien"){
    mesQuien = el.getAttribute("data-n");
    pinta();
  }
  else if(a === "l-add"){
    var ln = document.getElementById("l-nombre").value.trim();
    if(!ln){ toast("Pon qu\u00e9 falta.", true); return; }
    var lc = num(document.getElementById("l-cant").value);
    if(lc === null || lc <= 0) lc = 1;
    var lt = document.getElementById("l-nota").value.trim();
    var tope = S.lista.reduce(function(m, x){ return Math.max(m, x.orden || 0); }, 0);
    run(api("casa_lista", {method:"POST", prefer:"return=minimal",
      body:[{nombre:ln, cantidad:lc, nota:lt || null, pedido_por:yo, orden:tope + 1}]}),
      "A\u00f1adido a la lista");
  }
  else if(a === "l-tick"){
    var li = S.lista.filter(function(x){ return x.id === id; })[0];
    if(!li) return;
    /* Tachar y destachar es el mismo bot\u00f3n: equivocarse es barato. */
    run(api("casa_lista?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal",
      body: li.comprado
        ? {comprado:false, comprado_por:null, comprado_at:null}
        : {comprado:true, comprado_por:yo, comprado_at:new Date().toISOString()}}));
  }
  else if(a === "l-edita"){ editando = id; pinta(); }
  else if(a === "l-cancela"){ editando = null; pinta(); }
  else if(a === "l-guarda"){
    var en = document.getElementById("e-nombre").value.trim();
    if(!en){ toast("El nombre no puede quedar vac\u00edo.", true); return; }
    var ec = num(document.getElementById("e-cant").value);
    if(ec === null || ec <= 0) ec = 1;
    var et = document.getElementById("e-nota").value.trim();
    editando = null;
    run(api("casa_lista?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal",
      body:{nombre:en, cantidad:ec, nota:et || null}}), "Guardado");
  }
  else if(a === "l-quita"){
    if(editando === id) editando = null;
    run(api("casa_lista?id=eq."+encodeURIComponent(id), {method:"DELETE", prefer:"return=minimal"}));
  }
  else if(a === "l-limpia"){
    run(api("casa_lista?comprado=is.true", {method:"DELETE", prefer:"return=minimal"}),
      "Lista limpia");
  }
  else if(a === "cu-add"){
    var cud = document.getElementById("cu-dia").value;
    var cuc = document.getElementById("cu-color").value.trim().toLowerCase();
    if(!cud || !cuc){ toast("Pon el d\u00eda y el color.", true); return; }
    run(api("casa_cubos?on_conflict=dia", {method:"POST",
      prefer:"resolution=merge-duplicates,return=minimal",
      body:[{dia:cud, color:cuc, por:yo}]}), "Recogida apuntada");
  }
  else if(a === "cf-add"){
    var cfd = Number(document.getElementById("cf-dow").value);
    var cfc = document.getElementById("cf-cubo").value.trim().toLowerCase();
    if(!cfc){ toast("Pon qué cubo es.", true); return; }
    /* Desde hoy: lo que ya pasó no se pidió y no puede salir como no hecho. */
    run(cfg({cubos_fijos: (S.cubosFijos || []).concat([{dow:cfd, cubo:cfc, desde:hoy()}])}),
      "Cubo fijo apuntado");
  }
  else if(a === "cf-quita"){
    var cfi = Number(el.getAttribute("data-i"));
    run(cfg({cubos_fijos: (S.cubosFijos || []).filter(function(f, i){ return i !== cfi; })}),
      "Cubo fijo quitado");
  }
  else if(a === "cu-quita"){
    run(api("casa_cubos?dia=eq."+encodeURIComponent(el.getAttribute("data-d")),
      {method:"DELETE", prefer:"return=minimal"}), "Recogida quitada");
  }
  else if(a === "ap-add"){
    var apq = document.getElementById("ap-quien").value;
    var apc = num(document.getElementById("ap-cuanto").value);
    if(apc === null || apc <= 0){ toast("Pon la cantidad.", true); return; }
    run(api("casa_contributions", {method:"POST", prefer:"return=minimal",
      body:[{by_name:apq, amount:apc}]}), "Aportaci\u00f3n registrada");
  }
  else if(a === "cb-add"){
    var cz = document.getElementById("cb-zona").value;
    var cd = document.getElementById("cb-dia").value;
    var cq = document.getElementById("cb-quien").value;
    var cn = document.getElementById("cb-nota").value.trim();
    var zx = S.zonas.filter(function(q){ return q.id === cz; })[0];
    if(!zx || !cd){ toast("Falta la secci\u00f3n o el d\u00eda.", true); return; }
    /* A quién le tocaba lo saca la rotación, no el formulario: así no se puede
       apuntar un cambio contra alguien que no tenía ese día. */
    var tit = turnoDe(zx, cd)[0];
    if(!tit){ toast("Ese d\u00eda esa secci\u00f3n no es de nadie.", true); return; }
    if(tit === cq){ toast("Ya le toca a " + cq + " ese d\u00eda.", true); return; }
    run(api("casa_cambios?on_conflict=zona_id,dia", {
      method:"POST", prefer:"resolution=merge-duplicates,return=minimal",
      body:[{zona_id:cz, dia:cd, quien:cq, en_lugar_de:tit, nota:cn || null, por:yo}]
    }), "Cambio apuntado");
  }
  else if(a === "cb-quita"){
    run(api("casa_cambios?id=eq." + encodeURIComponent(el.getAttribute("data-id")),
            {method:"DELETE", prefer:"return=minimal"}), "Cambio deshecho");
  }
  else if(a === "m-add"){
    var m = document.getElementById("m-nuevo").value.trim();
    if(!m || m.indexOf("@") < 0){ toast("Correo no válido.", true); return; }
    if(S.correos.indexOf(m) > -1) return;
    run(cfg({aviso_emails: S.correos.concat([m])}), "Añadido");
  }
  else if(a === "m-quita"){
    i = parseInt(el.getAttribute("data-i"),10);
    var cs = S.correos.slice(); cs.splice(i,1);
    run(cfg({aviso_emails:cs}));
  }
}
document.getElementById("app").addEventListener("click", onClick);
document.getElementById("nav").addEventListener("click", onClick);
document.getElementById("sheetBg").addEventListener("click", onClick);

document.getElementById("app").addEventListener("change", function(e){
  var el = e.target, fl = el.getAttribute("data-f"), a = el.getAttribute("data-a");
  var id = el.getAttribute("data-id");
  if(!S) return;

  if(!fl) return;

  if(fl === "z-turno"){
    /* Re-ancla el turno en su próximo relevo: a partir de ahí sigue corriendo
       por la lista a su ritmo. */
    var zt = S.zonas.filter(function(x){ return x.id === id; })[0];
    if(!zt) return;
    run(api("casa_zonas?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal",
      body:{rota_persona: el.value, rota_desde: proximoRelevo(zt)}}), "Turno actualizado");
    return;
  }
  if(fl === "z-cada"){
    /* Al cambiar el ritmo se re-ancla en mañana con quien lo tiene hoy, para
       que el cambio no reordene el pasado. */
    var zc = S.zonas.filter(function(x){ return x.id === id; })[0];
    if(!zc) return;
    run(api("casa_zonas?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal",
      body:{rota_cada: Math.max(1, parseInt(el.value, 10) || 7),
            rota_persona: turnoDe(zc, hoy())[0] || zc.rota_persona,
            rota_desde: hoy()}}), "Ritmo del turno actualizado");
    return;
  }
  if(fl === "z-nombre" || fl === "z-desc" || fl === "z-plazas" || fl === "z-color"){
    var campo = {"z-nombre":"nombre","z-desc":"descripcion","z-plazas":"plazas","z-color":"color"}[fl];
    var val = fl === "z-plazas" ? Math.max(0, parseInt(el.value,10) || 0) : el.value;
    var p = {}; p[campo] = val;
    run(api("casa_zonas?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal", body:p}));
  }
  else if(fl === "t-label"){
    run(api("casa_tareas?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal", body:{label: el.value}}));
  }
  else if(fl === "cfg-ancla"){
    if(!el.value) return;
    /* Se guarda siempre el lunes de esa semana: la rotación cuenta semanas
       enteras desde el ancla. */
    run(cfg({rotacion_desde: semanaDe(el.value)}), "Rotación re-anclada");
  }
  else if(fl === "z-salto"){
    var sl = parseInt(el.value, 10);
    run(api("casa_zonas?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=minimal",
      body:{rota_salto: (isNaN(sl) || sl < 0) ? 0 : sl}}));
  }
});

document.getElementById("cam").addEventListener("click", function(e){
  var el = e.target.closest("[data-c]");
  if(!el) return;
  var c = el.getAttribute("data-c");
  if(c === "cerrar") cierraCam();
  else if(c === "disparo") dispara();
  else if(c === "repite"){
    var cb = camCb, m = camMax, t = document.querySelector(".cam-head span");
    var titulo = t ? t.textContent : "Hacer foto";
    cierraCam(); abreCamara(titulo, m, cb);
  }
  else if(c === "usa"){
    var img = camShot, cb2 = camCb;
    cierraCam();
    if(img && cb2) cb2(img);
  }
});
document.getElementById("cam").addEventListener("change", function(e){
  var el = e.target;
  if(el.getAttribute("data-c") !== "archivo") return;
  var file = el.files && el.files[0];
  if(!file) return;
  var cb = camCb, m = camMax;
  leeArchivo(file).then(function(src){ return encoge(src, m); }).then(function(img){
    cierraCam(); if(cb) cb(img);
  }).catch(function(){ toast("No se pudo procesar la foto.", true); });
});

/* ================= arranque ================= */
cargar().then(function(){
  pinta();
  return fijarSemana();
}).then(pinta).then(vaciaCola).catch(function(e){
  /* Sin servidor, se enseña la última copia en vez de una pantalla muerta:
     con ella se puede al menos ver a quién le toca y marcar, que se enviará
     al volver la red. */
  if(leeCopia()){
    pinta();
    vaciaCola();
  }else{
    document.getElementById("app").innerHTML =
      '<div class="boot">No se pudo conectar y no hay copia guardada.<br>' +
      'Con\u00e9ctate una vez y la app ya funcionar\u00e1 sin cobertura.</div>';
  }
  if(window.console) console.error(e);
});

/* La app guardada en el navegador: con esto abre sin cobertura. Si falla, no
   pasa nada — es una mejora, no un requisito. */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
window.addEventListener("online", function(){
  /* Sin el `|| !S` no se recupera quien abrió la app por primera vez sin
     cobertura: se quedaría en la pantalla de error hasta recargar a mano. */
  vaciaCola().then(function(mandado){ if(!mandado || !S) refrescar(); });
});

/* El refresco repinta la pantalla entera, así que no puede saltar mientras
   alguien escribe: le borraría lo tecleado a media frase. */
function escribiendo(){
  if(compraAbierta || editando || masAbierto) return true;
  var el = document.activeElement;
  return !!el && (el.tagName === "INPUT" || el.tagName === "SELECT" || el.tagName === "TEXTAREA");
}
setInterval(function(){
  if(document.hidden || !S || escribiendo()) return;
  vaciaCola().then(function(mandado){ if(!mandado) refrescar(); });
}, 45000);
window.addEventListener("focus", function(){ if(S && !escribiendo()) refrescar(); });

})();
