<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#176B4A">
<title>Vista previa · Casa Holanda</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F5F2;
  --surface:#FFFFFF;
  --surface-2:#EDF0EC;
  --line:#E0E5DF;
  --ink:#15201B;
  --muted:#697A71;
  --accent:#176B4A;
  --accent-soft:#E4EFE9;
  --ok:#2E8B57;
  --warn:#B07A24;
  --bad:#B4453A;
  --bad-soft:#F7E8E6;
  --z1:#C2602F;
  --z2:#4C7A34;
  --z3:#3D6B9E;
  --z4:#7A5296;
  --r:14px;
  --shadow:0 1px 2px rgba(16,32,24,.05), 0 8px 24px -12px rgba(16,32,24,.18);
  --font:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1613; --surface:#18211D; --surface-2:#202B26; --line:#2C3832;
    --ink:#E8EFEA; --muted:#92A49A;
    --accent:#4FB487; --accent-soft:#1A2E26;
    --ok:#5CBE87; --warn:#D6A050; --bad:#DE7A6D; --bad-soft:#331F1C;
    --z1:#DD8356; --z2:#7FAE62; --z3:#6D9BCE; --z4:#A77FC4;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#18211D; --surface-2:#202B26; --line:#2C3832;
  --ink:#E8EFEA; --muted:#92A49A;
  --accent:#4FB487; --accent-soft:#1A2E26;
  --ok:#5CBE87; --warn:#D6A050; --bad:#DE7A6D; --bad-soft:#331F1C;
  --z1:#DD8356; --z2:#7FAE62; --z3:#6D9BCE; --z4:#A77FC4;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit}
img{max-width:100%;display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- aviso de maqueta ---------- */
.demo-bar{
  background:var(--ink); color:var(--bg); text-align:center;
  padding:7px 14px; font-size:12.5px; font-weight:500; letter-spacing:.01em;
}
.demo-bar b{font-weight:700}

/* ---------- armazón ---------- */
.app{max-width:480px;margin:0 auto;padding:0 16px 96px}
.topbar{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding:16px 0 12px; display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand .name{font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand .week{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.01em}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);
}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
.icon-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.me{
  display:flex;align-items:center;gap:7px;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 3px;cursor:pointer;
}
.me .nm{font-size:13px;font-weight:600}
.av{
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:12px;flex-shrink:0;letter-spacing:-.01em;
}
.av.s{width:22px;height:22px;font-size:10px}
.av.l{width:46px;height:46px;font-size:18px}

/* ---------- secciones ---------- */
.eyebrow{
  font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;justify-content:space-between;
}
.eyebrow:first-of-type{margin-top:4px}

/* ---------- tarjeta de zona ---------- */
.zone{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;margin-bottom:10px;
}
.zone.mine{box-shadow:var(--shadow);border-color:transparent}
.zone-top{padding:15px 16px;display:flex;align-items:flex-start;gap:12px}
.zone-bar{width:3px;align-self:stretch;border-radius:3px;background:var(--zc);flex-shrink:0}
.zone-id{flex:1;min-width:0}
.zone-name{font-weight:700;font-size:16px;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.zone-dot{width:8px;height:8px;border-radius:50%;background:var(--zc);flex-shrink:0}
.zone-rooms{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.zone-people{display:flex;align-items:center;gap:5px;margin-top:9px;flex-wrap:wrap}
.zone-people .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);
  border-radius:999px;padding:3px 9px 3px 3px;font-size:12px;font-weight:600;
}
.chip.you{background:var(--accent-soft);color:var(--accent)}
.prog{flex-shrink:0;text-align:right}
.prog .n{font-family:var(--mono);font-size:13px;font-weight:500}
.prog .n b{font-size:17px;font-weight:500}
.bar{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:6px;width:62px}
.bar i{display:block;height:100%;background:var(--zc);border-radius:4px}
.bar.done i{background:var(--ok)}

/* ---------- tareas ---------- */
.tasks{border-top:1px solid var(--line)}
.task{
  display:flex;align-items:center;gap:11px;padding:11px 16px;
  border-bottom:1px solid var(--line);
}
.task:last-child{border-bottom:0}
.tick{
  width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line);
  flex-shrink:0;display:grid;place-items:center;color:transparent;
}
.task.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.t-main{flex:1;min-width:0}
.t-label{font-size:14px;font-weight:500;line-height:1.35}
.task.done .t-label{color:var(--muted)}
.t-meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.freq{
  font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 4px;margin-left:6px;
  vertical-align:1px;
}
.thumb{width:34px;height:34px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--line)}
/* En la maqueta no hay fotos reales: este bloque ocupa su sitio exacto. */
.thumb.ph{
  background:
    radial-gradient(circle at 50% 38%, #9FB3A4 0 18%, transparent 19%),
    linear-gradient(170deg, #CBD8CE 0 58%, #AFC0B4 58% 100%);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);background:var(--surface);border-radius:9px;
  padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.btn:hover{border-color:var(--muted)}
.btn-pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-pri:hover{filter:brightness(1.08);border-color:var(--accent)}
.btn-sm{padding:5px 9px;font-size:12px}
.btn-wide{width:100%;padding:11px}

/* ---------- avisos ---------- */
.note{
  display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;
  font-size:13.5px;line-height:1.4;margin-bottom:10px;border:1px solid;
}
.note.buy{background:#FBF3E4;border-color:#E5CFA0;color:#7A5312}
.note b{font-weight:700}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .note.buy{background:#2C2516;border-color:#4A3D1E;color:#E0BE78}
}
:root[data-theme="dark"] .note.buy{background:#2C2516;border-color:#4A3D1E;color:#E0BE78}

/* ---------- stock ---------- */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.stat .k{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat .v{font-size:23px;font-weight:700;letter-spacing:-.03em;margin-top:3px;font-variant-numeric:tabular-nums}
.item{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{flex:1;min-width:0;font-size:14px;font-weight:500}
.item .nm small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:400;margin-top:1px}
.qty{display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:9px;padding:2px}
.qty button{
  width:28px;height:28px;border:0;background:none;border-radius:7px;cursor:pointer;
  color:var(--muted);font-size:16px;line-height:1;display:grid;place-items:center;
}
.qty button:hover{background:var(--surface);color:var(--ink)}
.qty .n{
  min-width:28px;text-align:center;font-family:var(--mono);font-size:13.5px;font-weight:500;
  font-variant-numeric:tabular-nums;
}
.tag{
  font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;
  padding:3px 7px;border-radius:5px;font-weight:500;flex-shrink:0;
}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.low{background:#FBF3E4;color:#8A6016}
.tag.out{background:var(--bad-soft);color:var(--bad)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .tag.low{background:#2C2516;color:#E0BE78}
}
:root[data-theme="dark"] .tag.low{background:#2C2516;color:#E0BE78}

/* ---------- historial ---------- */
.wk{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden}
.wk-top{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer}
.wk-when{font-family:var(--mono);font-size:12px;color:var(--muted);flex-shrink:0;min-width:74px}
.wk-sum{flex:1;display:flex;gap:4px}
.seg{height:5px;border-radius:3px;flex:1;background:var(--surface-2);overflow:hidden}
.seg i{display:block;height:100%;background:var(--zc)}
.wk-pct{font-family:var(--mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.wk-body{border-top:1px solid var(--line);padding:4px 0}
.wk-zone{display:flex;align-items:center;gap:10px;padding:9px 15px}
.wk-zone .nm{flex:1;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.wk-zone .who{font-size:12px;color:var(--muted)}
.miss{background:var(--bad-soft)}
.miss .wk-pct{color:var(--bad)}

/* ---------- navegación inferior ---------- */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));
}
.nav-in{max-width:480px;margin:0 auto;display:flex}
.nav button{
  flex:1;border:0;background:none;cursor:pointer;padding:6px 0 4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);
}
.nav button.on{color:var(--accent)}
.nav .lb{font-size:10.5px;font-weight:600;letter-spacing:.01em}
.nav svg{width:21px;height:21px}

.empty{color:var(--muted);font-size:13px;padding:14px 2px;text-align:center}
</style>
</head>
<body>

<div class="demo-bar"><b>Vista previa</b> — datos de ejemplo, nada se guarda</div>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="name">Casa Holanda</div>
      <div class="week" id="weekLabel">28 SEP – 4 OCT</div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="themeBtn" title="Cambiar tema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3v1.5M12 19.5V21M4.2 4.2l1.1 1.1M18.7 18.7l1.1 1.1M3 12h1.5M19.5 12H21M4.2 19.8l1.1-1.1M18.7 5.3l1.1-1.1"/><circle cx="12" cy="12" r="4"/></svg>
      </button>
      <button class="me" id="meBtn">
        <span class="av" style="background:#7A5296">A</span>
        <span class="nm">Alberto</span>
      </button>
    </div>
  </div>

  <div id="view"></div>
</div>

<nav class="nav">
  <div class="nav-in">
    <button data-go="casa" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span class="lb">Casa</span>
    </button>
    <button data-go="stock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>
      <span class="lb">Stock</span>
    </button>
    <button data-go="historial">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      <span class="lb">Historial</span>
    </button>
    <button data-go="admin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 14a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.3a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-2.8-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 4 14H3.7a2 2 0 1 1 0-4h.2A1.6 1.6 0 0 0 5 7.2l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 4.6V4a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1h.3a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.4 1z"/></svg>
      <span class="lb">Admin</span>
    </button>
  </div>
</nav>

<script>
(function(){
"use strict";

var CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2L8 5h8l1.5 2h2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.2"/></svg>';
var TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><path d="M4 12.5 9.5 18 20 6.5"/></svg>';

var COLOR = {Yassine:"#C2602F",Jorge:"#B07A24",Noel:"#4C7A34",Raul:"#3D6B9E",Alberto:"#7A5296",Sufian:"#2E8B8B",Pablo:"#A64D79"};

var ZONAS = [
  {id:"cocina", nombre:"Cocina", rooms:"Cocina", plazas:2, color:"var(--z1)",
   equipo:["Alberto","Yassine"],
   tareas:[
     {t:"Fregar los platos y vaciar el escurridor", f:"diaria", hecha:true, por:"Yassine", h:"09:40", foto:1},
     {t:"Limpiar encimera y fogones", f:"diaria", hecha:true, por:"Alberto", h:"14:05", foto:1},
     {t:"Barrer y fregar el suelo", f:"diaria", hecha:false},
     {t:"Sacar la basura y poner bolsa nueva", f:"diaria", hecha:false},
     {t:"Limpiar microondas y nevera por fuera", f:"semanal", hecha:true, por:"Alberto", h:"lun", foto:1}
   ]},
  {id:"jardin", nombre:"Jardín / Garaje", rooms:"Jardín y garaje", plazas:2, color:"var(--z2)",
   equipo:["Jorge","Noel"],
   tareas:[
     {t:"Recoger y barrer el garaje", f:"semanal", hecha:true, por:"Jorge", h:"mar", foto:1},
     {t:"Ordenar el jardín y recoger basura", f:"semanal", hecha:false},
     {t:"Sacar los cubos verdes a la calle", f:"domingo", hecha:false},
     {t:"Entrar los cubos verdes", f:"lunes", hecha:true, por:"Noel", h:"lun", foto:1}
   ]},
  {id:"baja", nombre:"Planta baja", rooms:"Comedor, salón, escalera, baño 1 y cuarto de la lavadora", plazas:1, color:"var(--z3)",
   equipo:["Raul"],
   tareas:[
     {t:"Recoger el salón y el comedor", f:"diaria", hecha:true, por:"Raul", h:"20:15", foto:1},
     {t:"Barrer y fregar comedor, salón y escalera", f:"semanal", hecha:false},
     {t:"Limpiar el baño 1", f:"semanal", hecha:false},
     {t:"Ordenar el cuarto de la lavadora", f:"semanal", hecha:false}
   ]},
  {id:"arriba", nombre:"Arriba", rooms:"Ducha, baño y pasillo de arriba", plazas:2, color:"var(--z4)",
   equipo:["Sufian","Pablo"],
   tareas:[
     {t:"Limpiar la ducha", f:"semanal", hecha:true, por:"Sufian", h:"mié", foto:1},
     {t:"Limpiar el baño de arriba", f:"semanal", hecha:true, por:"Pablo", h:"mié", foto:1},
     {t:"Barrer y fregar el pasillo", f:"semanal", hecha:false}
   ]}
];

var STOCK = [
  {z:"Cocina", color:"var(--z1)", items:[
    {n:"Lavavajillas a mano", q:3, min:1}, {n:"Bolsas de basura", q:1, min:2},
    {n:"Friegasuelos", q:2, min:1}, {n:"Papel de cocina", q:0, min:1}]},
  {z:"Jardín / Garaje", color:"var(--z2)", items:[
    {n:"Bolsas de jardín", q:4, min:2}]},
  {z:"Planta baja", color:"var(--z3)", items:[
    {n:"Limpiacristales", q:2, min:1}, {n:"Limpiador de WC", q:1, min:1},
    {n:"Papel higiénico", q:6, min:4}]},
  {z:"Arriba", color:"var(--z4)", items:[
    {n:"Antical / quitacal", q:1, min:1}, {n:"Limpiador de WC", q:2, min:1},
    {n:"Papel higiénico", q:3, min:4}]}
];

var SEMANAS = [
  {r:"28 sep – 4 oct", actual:true, z:[{n:"Cocina",c:"var(--z1)",p:60,q:"Alberto, Yassine"},{n:"Jardín / Garaje",c:"var(--z2)",p:50,q:"Jorge, Noel"},{n:"Planta baja",c:"var(--z3)",p:25,q:"Raul"},{n:"Arriba",c:"var(--z4)",p:67,q:"Sufian, Pablo"}]},
  {r:"21 – 27 sep", z:[{n:"Cocina",c:"var(--z1)",p:100,q:"Pablo, Alberto"},{n:"Jardín / Garaje",c:"var(--z2)",p:75,q:"Yassine, Jorge"},{n:"Planta baja",c:"var(--z3)",p:100,q:"Noel"},{n:"Arriba",c:"var(--z4)",p:100,q:"Raul, Sufian"}]},
  {r:"14 – 20 sep", z:[{n:"Cocina",c:"var(--z1)",p:80,q:"Sufian, Pablo"},{n:"Jardín / Garaje",c:"var(--z2)",p:0,q:"Alberto, Yassine"},{n:"Planta baja",c:"var(--z3)",p:75,q:"Jorge"},{n:"Arriba",c:"var(--z4)",p:100,q:"Noel, Raul"}]}
];

var YO = "Alberto";
var vista = "casa";
var abierta = {};

function av(n, cls){
  return '<span class="av '+(cls||'')+'" style="background:'+(COLOR[n]||'#777')+'">'+n.charAt(0)+'</span>';
}
function pct(z){
  var d = z.tareas.filter(function(t){return t.hecha;}).length;
  return {d:d, t:z.tareas.length, p:Math.round(d/z.tareas.length*100)};
}

function tareaHTML(t, puede){
  var acc;
  if(t.hecha){
    acc = (t.foto ? '<span class="thumb ph" title="foto adjunta"></span>' : '');
  } else if(puede){
    acc = '<button class="btn btn-pri btn-sm">'+CAM+' Foto</button>';
  } else {
    acc = '<span class="tag low">Pendiente</span>';
  }
  return '<div class="task'+(t.hecha?' done':'')+'">'+
    '<span class="tick">'+TICK+'</span>'+
    '<div class="t-main"><div class="t-label">'+t.t+'<span class="freq">'+t.f+'</span></div>'+
    (t.hecha?'<div class="t-meta">'+t.por+' · '+t.h+'</div>':'')+'</div>'+
    acc+'</div>';
}

function zonaHTML(z, mia){
  var p = pct(z);
  var gente = z.equipo.map(function(n){
    return '<span class="chip'+(n===YO?' you':'')+'">'+av(n,'s')+(n===YO?'Tú':n)+'</span>';
  }).join('');
  var cuerpo = (mia || abierta[z.id])
    ? '<div class="tasks">'+z.tareas.map(function(t){ return tareaHTML(t, mia); }).join('')+'</div>'
    : '';
  return '<div class="zone'+(mia?' mine':'')+'" style="--zc:'+z.color+'">'+
    '<div class="zone-top" data-zona="'+z.id+'">'+
      '<span class="zone-bar"></span>'+
      '<div class="zone-id">'+
        '<div class="zone-name"><span class="zone-dot"></span>'+z.nombre+'</div>'+
        '<div class="zone-rooms">'+z.rooms+'</div>'+
        '<div class="zone-people">'+gente+'</div>'+
      '</div>'+
      '<div class="prog"><div class="n"><b>'+p.d+'</b>/'+p.t+'</div>'+
        '<div class="bar'+(p.p===100?' done':'')+'"><i style="width:'+p.p+'%"></i></div></div>'+
    '</div>'+ cuerpo +'</div>';
}

function vCasa(){
  var mia = ZONAS.filter(function(z){ return z.equipo.indexOf(YO)>-1; })[0];
  var otras = ZONAS.filter(function(z){ return z!==mia; });
  var faltan = [];
  STOCK.forEach(function(g){ g.items.forEach(function(i){ if(i.q<=i.min) faltan.push(i.n); }); });
  return (faltan.length
      ? '<div class="note buy"><div><b>Hay que comprar ('+faltan.length+')</b><br>'+faltan.slice(0,3).join(' · ')+(faltan.length>3?' · +'+(faltan.length-3):'')+'</div></div>'
      : '')+
    '<div class="eyebrow">Tu zona esta semana</div>'+
    zonaHTML(mia, true)+
    '<div class="eyebrow">El resto de la casa</div>'+
    otras.map(function(z){ return zonaHTML(z, false); }).join('');
}

function vStock(){
  var faltan=0, total=0;
  STOCK.forEach(function(g){ g.items.forEach(function(i){ total++; if(i.q<=i.min) faltan++; }); });
  return '<div class="eyebrow">Inventario</div>'+
    '<div class="stat-row">'+
      '<div class="stat"><div class="k">Bote común</div><div class="v">47,20 €</div></div>'+
      '<div class="stat"><div class="k">Por comprar</div><div class="v">'+faltan+'<span style="font-size:14px;color:var(--muted);font-weight:500"> / '+total+'</span></div></div>'+
    '</div>'+
    STOCK.map(function(g){
      return '<div class="zone" style="--zc:'+g.color+'">'+
        '<div class="zone-top" style="padding-bottom:12px"><span class="zone-bar"></span>'+
        '<div class="zone-id"><div class="zone-name"><span class="zone-dot"></span>'+g.z+'</div></div>'+
        '<div class="prog"><div class="n" style="color:var(--muted);font-size:12px">'+g.items.length+' art.</div></div></div>'+
        '<div class="tasks">'+g.items.map(function(i){
          var est = i.q<=0 ? ['out','Agotado'] : (i.q<=i.min ? ['low','Queda poco'] : ['ok','OK']);
          return '<div class="item"><div class="nm">'+i.n+'<small>avisa con '+i.min+'</small></div>'+
            '<span class="tag '+est[0]+'">'+est[1]+'</span>'+
            '<div class="qty"><button>−</button><span class="n">'+i.q+'</span><button>+</button></div></div>';
        }).join('')+'</div></div>';
    }).join('')+
    '<button class="btn btn-wide" style="margin-top:12px">Registrar una compra</button>';
}

function vHistorial(){
  return '<div class="eyebrow">Por semanas</div>'+
    SEMANAS.map(function(s,i){
      var media = Math.round(s.z.reduce(function(a,z){return a+z.p;},0)/s.z.length);
      var ab = abierta['w'+i];
      return '<div class="wk'+(media===0?' miss':'')+'">'+
        '<div class="wk-top" data-wk="'+i+'">'+
          '<span class="wk-when">'+(s.actual?'ESTA SEM.':s.r.toUpperCase())+'</span>'+
          '<div class="wk-sum">'+s.z.map(function(z){
            return '<span class="seg" style="--zc:'+z.c+'"><i style="width:'+z.p+'%"></i></span>';
          }).join('')+'</div>'+
          '<span class="wk-pct">'+media+'%</span>'+
        '</div>'+
        (ab ? '<div class="wk-body">'+s.z.map(function(z){
          return '<div class="wk-zone"><div class="nm"><span class="zone-dot" style="background:'+z.c+'"></span>'+z.n+
            '<span class="who">'+z.q+'</span></div>'+
            '<div class="bar" style="--zc:'+z.c+';margin:0"><i style="width:'+z.p+'%"></i></div>'+
            '<span class="wk-pct" style="font-size:12px">'+z.p+'%</span></div>';
        }).join('')+'</div>' : '')+
      '</div>';
    }).join('');
}

function vAdmin(){
  return '<div class="eyebrow">Rotación</div>'+
    '<div class="zone"><div class="tasks">'+
      ['Yassine','Jorge','Noel','Raul','Alberto','Sufian','Pablo'].map(function(n,i){
        return '<div class="item">'+av(n)+'<div class="nm" style="margin-left:4px">'+n+
          '<small>semana '+(i+1)+' → '+ZONAS[i%4].nombre+'</small></div>'+
          '<button class="btn btn-sm">Quitar</button></div>';
      }).join('')+
    '</div></div>'+
    '<div class="eyebrow">Zonas y plazas</div>'+
    ZONAS.map(function(z){
      return '<div class="zone" style="--zc:'+z.color+'"><div class="zone-top" style="padding-bottom:13px">'+
        '<span class="zone-bar"></span><div class="zone-id">'+
        '<div class="zone-name"><span class="zone-dot"></span>'+z.nombre+'</div>'+
        '<div class="zone-rooms">'+z.tareas.length+' tareas · '+z.plazas+' plaza'+(z.plazas>1?'s':'')+'</div></div>'+
        '<button class="btn btn-sm">Editar</button></div></div>';
    }).join('')+
    '<div class="eyebrow">Correo de las 23:00</div>'+
    '<div class="zone"><div class="tasks">'+
      '<div class="item"><div class="nm">Miguel<small>Miguel.ferrer.toribio@gmail.com</small></div><span class="tag ok">Activo</span></div>'+
      '<div class="item"><div class="nm">Alberto<small>joruxoo@gmail.com</small></div><span class="tag ok">Activo</span></div>'+
    '</div></div>';
}

function render(){
  var v = document.getElementById("view");
  v.innerHTML = vista==="casa" ? vCasa()
    : vista==="stock" ? vStock()
    : vista==="historial" ? vHistorial()
    : vAdmin();
  [].forEach.call(document.querySelectorAll(".nav button"), function(b){
    b.classList.toggle("on", b.getAttribute("data-go")===vista);
  });
  window.scrollTo(0,0);
}

document.querySelector(".nav").addEventListener("click", function(e){
  var b = e.target.closest("[data-go]");
  if(!b) return;
  vista = b.getAttribute("data-go");
  render();
});

document.getElementById("view").addEventListener("click", function(e){
  var z = e.target.closest("[data-zona]");
  if(z){ var id=z.getAttribute("data-zona"); abierta[id]=!abierta[id]; render(); return; }
  var w = e.target.closest("[data-wk]");
  if(w){ var k='w'+w.getAttribute("data-wk"); abierta[k]=!abierta[k]; render(); return; }
});

document.getElementById("themeBtn").addEventListener("click", function(){
  var r = document.documentElement;
  var oscuro = r.getAttribute("data-theme")==="dark"
    || (!r.getAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches);
  r.setAttribute("data-theme", oscuro ? "light" : "dark");
});

render();
})();
</script>
</body>
</html>
